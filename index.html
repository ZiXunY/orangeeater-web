<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Orange Island</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================
           Header (Logo & Language)
           ========================= */
        #site-header {
            width: 100%;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
        }

        .header-content {
            width: 850px; /* 和主图对齐宽度 */
            padding: 20px 0;
            display: flex;
        }

        /* 左侧 2/3 放 Logo */
        .header-left {
            width: 66.66%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .site-logo {
            max-height: 50px;
            width: auto;
            font-style: italic; 
            color: #444;
        }

        /* 右侧 1/3 放语言切换 */
        .header-right {
            width: 33.33%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .lang-btn:hover {
            color: #aaa;
        }

        .lang-btn.active {
            color: #d35400;
            font-weight: bold;
            border-bottom: 2px solid #d35400;
        }

        /* =========================
           Family Tree (上半部分)
           ========================= */
        #family-tree {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .family-tree-image {
            display: block;
            width: 850px;
            height: 400px;
        }

        /* 隐形点击热区 */
        .avatar-hotspot {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent; 
            border: 2px solid transparent;
        }

        .avatar-hotspot:hover {
            border: 2px solid #d35400;
            background: rgba(211, 84, 0, 0.3);
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 10px #d35400;
        }

        /* =========================
           Character Information (下半部分)
           ========================= */
        #character-info {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            border-top: 1px solid #333;
            padding: 60px 20px;
            transition: all 0.3s ease;
        }

        .character-info-placeholder {
            color: #666;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        #info-panel {
            display: none; 
            width: 100%;
            max-width: 850px;
            flex-direction: row;
            gap: 40px;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        #char-portrait {
            width: 100px;  
            height: 100px;
            border-radius: 50%;
            background-image: url('images/family-tree/family-tree.png');
            background-size: 1700px 800px; 
            background-repeat: no-repeat;
            border: 3px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .info-right {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .puzzle-title {
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .puzzle-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #151515;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .select-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .select-group label {
            color: #aaa;
            font-size: 14px;
        }

        select {
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            width: 60%;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        select:focus {
            border-color: #d35400;
        }

        #bio-section {
            display: none; 
            background: rgba(211, 84, 0, 0.1);
            padding: 20px;
            border-left: 4px solid #d35400;
            border-radius: 4px;
            color: #ddd;
            line-height: 1.8;
            font-size: 15px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================
           Footer
           ========================= */
        footer {
            width: 100%;
            padding: 40px 20px;
            background: #050505;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            color: #666;
        }

        .footer-title {
            font-size: 16px;
            font-weight: bold;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-links a:hover {
            color: #ff7b25;
            text-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
        }

        .footer-copyright {
            font-size: 12px;
            color: #444;
        }
    </style>
</head>

<body>

    <!-- =========================
         Header (Logo & Lang)
         ========================= -->
    <header id="site-header">
        <div class="header-content">
            <!-- 左侧 Logo (占 2/3) -->
            <div class="header-left">
                <img src="images/logo.png" alt="Whispers of Orange Island" class="site-logo">
            </div>
            
            <!-- 右侧语言切换 (占 1/3) -->
            <div class="header-right">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </header>

    <!-- =========================
         上半部分：家族树
         ========================= -->
    <section id="family-tree">
        <div style="position: relative; width: 850px; height: 400px;">
            <img src="images/family-tree/family-tree.png" alt="Family Tree" class="family-tree-image">
            
            <div class="avatar-hotspot" data-id="cD" style="left: 26.5%; top: 23.5%;"></div>
            <div class="avatar-hotspot" data-id="Bc" style="left: 7.5%; top: 37.5%;"></div>
            <div class="avatar-hotspot" data-id="cE" style="left: 33.5%; top: 46.5%;"></div>
            <div class="avatar-hotspot" data-id="i" style="left: 13.5%; top: 55.5%;"></div>
            <div class="avatar-hotspot" data-id="f" style="left: 11.5%; top: 26.5%;"></div>
        </div>
    </section>

    <!-- =========================
         下半部分：解谜与生平信息
         ========================= -->
    <section id="character-info">
        
        <div class="character-info-placeholder" id="placeholder-text">
            Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.
        </div>

        <div id="info-panel">
            <div class="info-left">
                <div id="char-portrait"></div>
            </div>

            <div class="info-right">
                <div class="puzzle-title" id="ui-puzzle-title">Complete the character's profile to unlock their biography:</div>
                
                <div class="puzzle-section">
                    <div class="select-group">
                        <label id="ui-label-birth">Birth Place:</label>
                        <select id="select-birth">
                            <option value="">-- Select --</option>
                            <option value="orange_island">Orange Island</option>
                            <option value="mainland">Mainland</option>
                            <option value="outside">Outside Island</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-death">Death Year:</label>
                        <select id="select-death">
                            <option value="">-- Select --</option>
                            <option value="1980">1980</option>
                            <option value="1985">1985</option>
                            <option value="2017">2017</option>
                            <option value="2026">2026</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-cause">Cause of Death:</label>
                        <select id="select-cause">
                            <option value="">-- Select --</option>
                            <option value="illness">Illness (Albinism)</option>
                            <option value="depression">Depression</option>
                            <option value="shipwreck">Shipwreck</option>
                            <option value="assassination">Assassination</option>
                            <option value="explosion">Massive Explosion</option>
                        </select>
                    </div>
                </div>

                <div id="bio-section"></div>
            </div>
        </div>
    </section>

    <!-- =========================
         Footer
         ========================= -->
    <footer>
        <div class="footer-title">Whispers of Orange Island</div>
        <div class="footer-links">
            <a href="https://store.steampowered.com/app/5165730" target="_blank">Steam</a>
            <a href="https://discord.gg/GMvHrNVfru" target="_blank">Discord</a>
            <a href="mailto:contact@orangeeater.com">contact@orangeeater.com</a>
        </div>
        <div class="footer-copyright">
            © 2026 ZiXunY. All rights reserved.
        </div>
    </footer>

    <!-- =========================
         核心交互与双语逻辑
         ========================= -->
    <script>
        // 1. 语言字典库
        const i18n = {
            en: {
                prompt: "Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.",
                puzzleTitle: "Complete the character's profile to unlock their biography:",
                birthLabel: "Birth Place:",
                deathLabel: "Death Year:",
                causeLabel: "Cause of Death:",
                birthOptions: ["-- Select --", "Orange Island", "Mainland", "Outside Island"],
                deathOptions: ["-- Select --", "1980", "1985", "2017", "2026"],
                causeOptions: ["-- Select --", "Illness (Albinism)", "Depression", "Shipwreck", "Assassination", "Massive Explosion"],
                bioPrefix: "<strong>Unlocked Memory:</strong><br><br>"
            },
            zh: {
                prompt: "请点击上方家族树中的人物头像，补全档案线索，<br>以解锁其生平记忆。",
                puzzleTitle: "请补全该角色的档案线索，以解锁生平记忆：",
                birthLabel: "出生地 (Birth Place):",
                deathLabel: "去世年代 (Death Year):",
                causeLabel: "死因 (Cause of Death):",
                birthOptions: ["-- 选择 --", "Orange Island (橘子岛)", "大陆 (Mainland)", "岛外 (Outside Island)"],
                deathOptions: ["-- 选择 --", "1980", "1985", "2017", "2026"],
                causeOptions: ["-- 选择 --", "病逝 (白化病)", "郁郁而终", "海难", "暗杀伪装成意外", "大爆炸"],
                bioPrefix: "<strong>解锁生平：</strong><br><br>"
            }
        };

        // 2. 游戏数据库 (双语支持)
        const charDatabase = {
            "cD": {
                name: "cD", posX: "26.5%", posY: "23.5%", 
                correctBirth: "orange_island", correctDeath: "1985", correctCause: "depression",
                bio_en: "The 2nd generation of the c family, founder of the family business. Established the 'nocturnal society' and 'Holy Water Ritual' to protect his albino daughter Bc. What started as paternal love became a dystopian cage. Died of depression after his daughter's death and his son's refusal to return.",
                bio_zh: "c家第二代，家族产业奠基人。为保护患白化病的女儿Bc建立“夜间社会”规则和“圣水仪式”，初衷是父爱，却造就后来的反乌托邦牢笼。在女儿去世、儿子不肯回岛后，郁郁而终。"
            },
            "Bc": {
                name: "Bc", posX: "7.5%", posY: "37.5%",
                correctBirth: "orange_island", correctDeath: "1980", correctCause: "illness",
                bio_en: "Daughter of cD and Ba1, born with albinism. The 'first curse' of the two families' marriage. Despite being spoiled, she always felt unfortunate. Her condition led to the custom of 'sleeping by day and working by night'.",
                bio_zh: "cD与Ba1之女，先天性白化病患者。两家联姻的“第一次诅咒”。虽受尽溺爱却一直觉得自己不幸，她的病情促使了“昼伏夜出”习俗的形成。"
            },
            "cE": {
                name: "cE", posX: "33.5%", posY: "46.5%",
                correctBirth: "orange_island", correctDeath: "2026", correctCause: "explosion",
                bio_en: "Son of cD and E. Sent away from the island at age 3, resulting in a twisted childhood. An elitist who built the HorseCrab factory to maintain oppressive rule through cruel blood extraction. Died in the 2026 massive explosion, becoming a boss of obsession who continues to poison the water tower.",
                bio_zh: "cD与E之子。3岁被送出岛，造成扭曲童年。精英主义者，建立鲎工厂残酷抽血维持高压统治。死于2026大爆炸，死后化为执念Boss继续向水塔投毒。"
            },
            "i": {
                name: "i", posX: "13.5%", posY: "55.5%",
                correctBirth: "outside", correctDeath: "2017", correctCause: "assassination",
                bio_en: "A marine biologist full of justice who loved the sea. After discovering the truth behind the HorseCrab factory's cruel practices, he was assassinated, and his death was disguised as an accident.",
                bio_zh: "热爱大海、充满正义感的海洋学家。发现了鲎工厂虐杀鲎的真相后，被暗杀并伪装成意外。"
            },
            "f": {
                name: "f", posX: "11.5%", posY: "26.5%",
                correctBirth: "orange_island", correctDeath: "1980", correctCause: "shipwreck",
                bio_en: "A quiet and kind fisherman, representing the pure old days of the island. Whether he caught fish or not, he enjoyed the feeling of riding the waves. Ultimately died in a shipwreck.",
                bio_zh: "沉默善良的渔民，代表岛上淳朴的旧时光。无论捕不捕得到鱼，都觉得乘风破浪的感觉很好。最终死于一场海难。"
            }
        };

        // 3. 全局状态
        let currentLang = 'en'; // 默认英语
        let currentActiveChar = null;

        // 获取 DOM 元素
        const langButtons = document.querySelectorAll('.lang-btn');
        const hotspots = document.querySelectorAll('.avatar-hotspot');
        const placeholder = document.getElementById('placeholder-text');
        const infoPanel = document.getElementById('info-panel');
        const portrait = document.getElementById('char-portrait');
        
        const selBirth = document.getElementById('select-birth');
        const selDeath = document.getElementById('select-death');
        const selCause = document.getElementById('select-cause');
        const bioSection = document.getElementById('bio-section');

        // 4. 语言切换核心逻辑
        function applyLanguage(lang) {
            currentLang = lang;
            const textData = i18n[lang];

            // 更新静态文本
            placeholder.innerHTML = textData.prompt;
            document.getElementById('ui-puzzle-title').textContent = textData.puzzleTitle;
            document.getElementById('ui-label-birth').textContent = textData.birthLabel;
            document.getElementById('ui-label-death').textContent = textData.deathLabel;
            document.getElementById('ui-label-cause').textContent = textData.causeLabel;

            // 更新下拉框的文本（但保持底层 value 不变，这样切换语言时不会丢失玩家的选项进度）
            updateSelectOptions(selBirth, textData.birthOptions);
            updateSelectOptions(selDeath, textData.deathOptions);
            updateSelectOptions(selCause, textData.causeOptions);

            // 如果当前已经解锁了生平，也要立刻刷新其语言
            if (currentActiveChar && bioSection.style.display === 'block') {
                const bioText = lang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = textData.bioPrefix + bioText;
            }
        }

        // 辅助函数：只更新选项文字，不破坏底层 Value
        function updateSelectOptions(selectElement, textArray) {
            Array.from(selectElement.options).forEach((opt, index) => {
                if(textArray[index]) {
                    opt.textContent = textArray[index];
                }
            });
        }

        // 绑定语言切换按钮事件
        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                langButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                applyLanguage(this.getAttribute('data-lang'));
            });
        });

        // 5. 家族树头像点击逻辑
        hotspots.forEach(spot => {
            spot.addEventListener('click', function() {
                const charId = this.getAttribute('data-id');
                const data = charDatabase[charId];
                if(!data) return;

                currentActiveChar = data;

                placeholder.style.display = 'none';
                infoPanel.style.display = 'flex';
                bioSection.style.display = 'none'; 

                const pctX = parseFloat(data.posX) / 100;
                const pctY = parseFloat(data.posY) / 100;
                const scaledCenterX = 1700 * pctX;
                const scaledCenterY = 800 * pctY;
                const bgPosX = 50 - scaledCenterX;
                const bgPosY = 50 - scaledCenterY;
                
                portrait.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;

                selBirth.value = "";
                selDeath.value = "";
                selCause.value = "";
            });
        });

        // 6. 解谜校验逻辑
        function checkPuzzle() {
            if(!currentActiveChar) return;

            const bMatch = selBirth.value === currentActiveChar.correctBirth;
            const dMatch = selDeath.value === currentActiveChar.correctDeath;
            const cMatch = selCause.value === currentActiveChar.correctCause;

            if(bMatch && dMatch && cMatch) {
                const bioText = currentLang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = i18n[currentLang].bioPrefix + bioText;
                bioSection.style.display = 'block';
            } else {
                bioSection.style.display = 'none';
            }
        }

        selBirth.addEventListener('change', checkPuzzle);
        selDeath.addEventListener('change', checkPuzzle);
        selCause.addEventListener('change', checkPuzzle);

        // 7. 页面加载完毕后，自动初始化为英文
        applyLanguage('en');

    </script>
</body>
</html>
