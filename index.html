                        "rel_zh": "外公 · 海洋学家",
                        "sum_en": "Built the horseshoe crab lab, then spent a decade watching it turn into a factory. Murdered before he could report it.",
                        "sum_zh": "筹建鲎实验室的海洋学家，眼看实验室变成工厂。准备举报前被杀，现场被伪装成溺水。",
                        "bio_en": "<p class='bio-entry'><strong>November 20, 1965</strong> — I was born in Harbor City.</p><p class='bio-entry'><strong>June 20, 1988</strong> — I graduated from the Royal Ocean University with a Bachelor of Science in marine biology.</p><p class='bio-entry'><strong>1990</strong> — I was offered a job on Orange Island, sixty kilometers from Harbor City: they needed a marine scientist to set up a large horseshoe crab laboratory. I had read about Orange Island in textbooks. Its summer intertidal beach is the most famous horseshoe crab breeding ground in the entire northern hemisphere. The island's nocturnal rhythm was a real advantage for studying them too. Put together, it was the perfect place for a crab lab.</p><p class='bio-entry'>The bigger surprise was that I met a girl there. <strong>1992</strong> — We were married.</p><p class='bio-entry'><strong>1992</strong> — After a year and a half of preparation, the lab was finished. I worked hard to bring in several research grants. Within six months the Island Mayor told me the grants came nowhere near covering what the lab cost to build and run. He suggested we draw blood from the crabs and produce Limulus Amebocyte Lysate (LAL) to keep the lab alive. I agreed, and bought centrifuges, hypotonic lysis tanks, freeze dryers, and everything else.</p><p class='bio-entry'><strong>Spring into summer 1993</strong> — For three months, the large crew of seasonal workers I had hastily trained worked the beach south of the lab, carrying horseshoe crabs up from the shallows and the sand, and carrying the bled ones back down to the water. I set a strict limit on how much blood could be taken from a single animal, but there was always someone who wanted to take more in one go. At the end of that breeding season, the Mayor told me the profit still did not cover the equipment.</p><p class='bio-entry'>The whole of 1993 was crushing, but my life at home held me up. My wife gave birth to twin daughters with eyes as clear as deep water. I worked nights and slept days; she slept nights and worked days. Our brief reunions at dawn and dusk were happiness enough.</p><p class='bio-entry'>Standing in 2003 and looking back over ten years, I saw that I had been compromising the entire time, and that the lab's purpose had been quietly turned inside out. Huge tanks held crabs packed on top of one another. They were pulled out on a schedule and bled, recovered in the crowded tanks, and pulled out and bled again. The death rate kept climbing, and the tanks got more crowded anyway, because you could scoop up a fresh armful from the beach without effort. The one line I managed to hold was that no single crab would lose more than thirty percent of its blood in one draw.</p><p class='bio-entry'><strong>2004</strong> — I published an important paper on the threat medical bleeding poses to horseshoe crab populations. I had discovered that the marine association's rules only banned overfishing, and that \"catch, bleed, release\" was governed by nothing at all. The paper drew attention from every direction. In the middle of all that praise, one question surfaced in my head: at what point did I, the director of this laboratory, lose the ability to protect the animals I study?</p><p class='bio-entry'>Every year the financial report still showed a loss. I could not settle down to research either, waiting day after day for the association to write a rule that would protect the crabs. <strong>2016</strong> — The Marine Conservation Association finally brought \"medical bleeding\" under horseshoe crab resource management. Now I had a legal basis. I went straight to the Island Mayor and spoke plainly: bring the death rate down, or I report this to the Marine Conservation Association. He said he would think about it.</p><p class='bio-entry'><strong>February 14, 2017</strong> — I received an anonymous threat, the letters cut from newspapers, warning me that \"the waves can swallow people who mind other people's business.\"</p><p class='bio-entry'><strong>April 12, 2017</strong> — I was murdered. It was staged as an accidental drowning. The sheriff on the case found my dive watch with blood on it and my waterproof notes, and he did not take it any further.</p><p class='bio-entry'>My wife and my daughters never left Orange Island. They buried me in the cemetery. They come to see me often.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1965年11月20日</strong> — 我出生在海港城。</p><p class='bio-entry'><strong>1988年6月20日</strong> — 我从皇家海洋大学毕业，获得了海洋生物学理学学士学位。</p><p class='bio-entry'><strong>1990年</strong> — 我获得一个工作机会：在距离海港城六十公里的橘子岛上，需要一位海洋学家负责筹建一个大型鲎实验室。我早就在教科书上读到过橘子岛，夏天的潮间带沙滩是整个北半球最有名的鲎繁殖地。橘子岛昼伏夜出的作息对于研究鲎也是一大助力。这些因素加在一起，是建设鲎实验室的完美前提。</p><p class='bio-entry'>然而橘子岛更大的惊喜是，我遇到了一个女孩。<strong>1992年</strong>，我们结婚了。</p><p class='bio-entry'><strong>1992年</strong> — 筹备了一年半的实验室建成了。我努力引入了几项研究资金。然而不到半年，橘子岛岛长告诉我，研究资金远远不够支付鲎实验室的投资和开销。他建议采集鲎血，制成“鲎试剂”（Limulus Amebocyte Lysate, LAL），支撑实验室的发展。我同意了，为实验室添置了离心机、低渗裂解槽、冻干机等一系列设备。</p><p class='bio-entry'><strong>1993年春夏之交</strong> — 我临时培训的大量季节性工人在实验室南面的沙滩上忙碌了三个月，一趟一趟把浅海里和沙滩上的鲎运到实验室，又把实验室里被抽过血的鲎送回浅海。我严格限制了单只鲎的采血量，但是总有工人想一次多抽一点。一个繁殖季下来，岛长说利润还不够支付添置设备的成本。</p><p class='bio-entry'>整个1993年的压力都非常大，但是幸福的生活支撑住了我。妻子生下了一对拥有像深海一样清澈眼睛的双胞胎女儿。我黑夜工作白天睡觉，她黑夜睡觉白天工作，黎明和傍晚的短暂团聚，也足够幸福了。</p><p class='bio-entry'>站在2003年回看过去的十年，我发现自己在不断妥协，鲎实验室的功能被逐渐转变。巨大的养殖池里养着拥挤的鲎，这些鲎被定期抓出来抽血，抽完后在拥挤的养殖池内康复，然后再被定期抓出来抽血。鲎的死亡率一直上升，但池子里的鲎越来越拥挤，因为海滩那边轻松就能抓到一大把。我唯一能守住的底线是：单只鲎单次抽血量不能超过百分之三十。</p><p class='bio-entry'><strong>2004年</strong> — 我发表了一篇重要的论文，关于医学采血对鲎种群的威胁。因为我发现海洋协会只有针对过度捕捞的禁令，而“抓起来—采血—放回去”这种行为完全没有法规来管。论文引起了各界的注意，赞美声中我脑海里跳出一个问题——我作为鲎实验室的主任，是什么时候失去保护我的实验对象的能力的？</p><p class='bio-entry'>每年还是能收到亏损的财务报告。我也无法潜心做研究，天天等着协会出台保护鲎的制度。<strong>2016年</strong>，海洋保护协会终于将“医学采血”纳入“鲎资源管理”的范畴。我有了法规依据，立刻找岛长开诚布公地谈了一次，要求控制鲎的死亡率，否则我将上报海洋保护协会。岛长说他考虑一下。</p><p class='bio-entry'><strong>2017年2月14日</strong> — 我收到了一封用报纸字母拼凑的匿名威胁信，警告我“海浪能吞噬多管闲事的人”。</p><p class='bio-entry'><strong>2017年4月12日</strong> — 我被害了，凶手把现场伪装成意外溺水。查案的治安官明明发现了带血的潜水表和我的防水笔记，却没有继续查下去。</p><p class='bio-entry'>妻子和孩子们都没有离开橘子岛，她们把我安葬在墓园。她们经常来看我。</p>"
                },

                        "sum_en": "Came from North Mountain City for the night shift, bought a house with his wife, and pinned every hope on his granddaughter.",
                        "sum_zh": "从北山市来上夜班的工人，和妻子攒钱买下独栋屋，把全部希望寄托在聪明的外孙女身上。",
                        "bio_en": "<p class='bio-entry'><strong>March 10, 1960</strong> — I was born in North Mountain City. There was never enough water there, never enough land, and it was hard to get anywhere.</p><p class='bio-entry'><strong>1980</strong> — I got married. My wife heard from someone back home that a place called Orange Island was hiring night-shift workers. One month's wages there was worth half a year in North Mountain City. We took a bus to Plains City, a train to Harbor City, and a boat to Orange Island. This place was rich. The general store sold everything. My wife and I both found work at the orange processing plant, and during picking season we could take overtime for extra pay. We could not spend what we earned.</p><p class='bio-entry'><strong>1985</strong> — With every coin we had saved plus a bank loan, we bought our own detached house on the island. That was the proudest day of my life. That same year my daughter was born.</p><p class='bio-entry'><strong>2003</strong> — My daughter grew up. She put on a white coat and became a technician on the perfume line at the orange processing plant.</p><p class='bio-entry'><strong>2007</strong> — My daughter married. Her husband was a technician at the crab lab, doing high-skill work.</p><p class='bio-entry'><strong>2008</strong> — My granddaughter was born. She was clever from the start and did well in school. My hope was that she would go to the Royal Ocean University in Harbor City, like the director of the crab lab, and come back an engineer.</p><p class='bio-entry'><strong>December 24, 2023</strong> — I died of illness. I was buried in the cemetery on Orange Island. I love this island.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1960年3月10日</strong> — 我出生在北山市。北山市缺水，缺土地，交通不便。</p><p class='bio-entry'><strong>1980年</strong> — 我结婚了。我妻子从同乡那里听到消息，一个叫橘子岛的地方在招收夜班工人，一个月的工资顶北山市半年的收入。我和妻子坐大巴到了平原市，又坐火车到了海港城，最后坐船到了橘子岛。这里太富有了，杂货铺里什么都能买得到。我和妻子在橘子加工厂里都找到了工作，每年的采摘季我们还能加班多拿工资，我们赚的钱根本花不完。</p><p class='bio-entry'><strong>1985年</strong> — 我和妻子用攒下的所有积蓄加上银行贷款，在岛上买下了一栋属于我们自己的独栋屋。那是我这辈子最自豪的一天。同一年，我的女儿出生了。</p><p class='bio-entry'><strong>2003年</strong> — 我的女儿长大成人。她穿上了白大褂，在橘子加工厂的香水生产线上当技术员。</p><p class='bio-entry'><strong>2007年</strong> — 我女儿结婚了，丈夫是鲎实验室的技术员，做的都是高技术含量的工作。</p><p class='bio-entry'><strong>2008年</strong> — 我的宝贝外孙女出生了。她从小就聪明，成绩很好，我希望她像鲎实验室的主管一样，去海港城的皇家海洋大学，回来能当工程师。</p><p class='bio-entry'><strong>2023年12月24日</strong> — 我因病去世。我被葬在橘子岛的墓园里，我热爱这个岛。</p>"
                },
                "GroceryFounderF": {
                        "x": 812.5,
                        "y": 227,
                        "bp": "orange_island",
                        "by": "1973",
                        "dy": "2025",
                        "name_en": "Grocer",
                        "name_zh": "杂货铺老板",
                        "rel_en": "Grocer",
                        "rel_zh": "杂货铺老板",
                        "sum_en": "Born on the island, taken away at twelve, widowed at twenty-four. She came back and bought the store one year at a time.",
                        "sum_zh": "岛上出生、12 岁离岛、24 岁丧夫。带着幼子回到橘子岛接手杂货铺，用二十年把它买了下来。",
                        "bio_en": "<p class='bio-entry'><strong>October 20, 1973</strong> — I was born on Orange Island. Both my parents worked at the orange processing plant.</p><p class='bio-entry'><strong>1985</strong> — Like a lot of Orange Island workers, my parents had saved enough money and could not stand living by night any longer, so they took me back to our hometown, Old Sail Town.</p><p class='bio-entry'><strong>1994</strong> — I married a young man from Old Sail Town. Our son was born the next year.</p><p class='bio-entry'><strong>1997</strong> — My husband and I talked about going to Harbor City or Orange Island for a few years to save some money. Just as we were about to leave, he fell suddenly ill and died. I took care of everything he left behind and went back to Orange Island with my little boy. The general store on the island had belonged to the dock owner, but he had too much to handle and asked me to take it over.</p><p class='bio-entry'>I had been gone twelve years, and the islanders recognized me immediately. They carried me through the hardest years. The doctor waived our fees; the factory workers fixed our roof.</p><p class='bio-entry'>The store made very little money, but there was not much we needed to spend it on. We saved what we had and paid the dock owner at the end of every year, and over twenty years we really did buy the whole store. <strong>2017</strong> — My son and I had roots again.</p><p class='bio-entry'><strong>2020</strong> — My son got married. The next year I had a grandson.</p><p class='bio-entry'><strong>November 11, 2025</strong> — I died of illness and was buried on Orange Island. My life was complete.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1973年10月20日</strong> — 我出生在橘子岛，父母都是橘子加工厂的工人。</p><p class='bio-entry'><strong>1985年</strong> — 和很多橘子岛的工人一样，我父母赚够了一些钱，不愿意再忍受昼伏夜出的作息，带我回到了老家旧帆镇。</p><p class='bio-entry'><strong>1994年</strong> — 我和旧帆镇的一个小伙子结婚了。次年，我们的儿子出生了。</p><p class='bio-entry'><strong>1997年</strong> — 我和丈夫商量去海港城或者橘子岛工作几年，攒点钱。我们快要出发的时候，丈夫因突发急病离开了我们。我收拾了丈夫的身后事，带着年幼的儿子回到了橘子岛。岛上的杂货铺本来是码头老板的，码头老板忙不过来，让我接手。</p><p class='bio-entry'>虽然离开十二年了，但是岛民马上都认出了我。他们帮我渡过了前几年最艰难的日子，医生免过我们的诊费，工人们帮我们修过屋顶。</p><p class='bio-entry'>杂货铺赚的钱很少，但好在我们的生活不怎么花钱。我们的钱都攒下来了，每年年底付给码头老板，二十年下来真的把杂货铺全部买下来了。<strong>2017年</strong>，我和孩子又是有根的人了。</p><p class='bio-entry'><strong>2020年</strong> — 儿子结婚了。第二年，我也有孙子了。</p><p class='bio-entry'><strong>2025年11月11日</strong> — 我因病去世，葬在了橘子岛。我的这一生很圆满。</p>"
                },
                "HotelFounderM": {
                        "x": 463.5,
                        "y": 135,
                        "bp": "outside",
                        "by": "1935",
                        "dy": "2010",
                        "name_en": "Hotel Founder",
                        "name_zh": "旅馆创始人",
                        "rel_en": "Hotel Founder",
                        "rel_zh": "旅馆创始人",
                        "sum_en": "Furnished his hotel entirely out of fittings salvaged from the island's old houses. Left one hard family rule behind.",
                        "sum_zh": "用全岛老房子拆下来的旧物凑齐了旅馆陈设，并立下“长子不得离岛”的死规矩。",
                        "bio_en": "<p class='bio-entry'><strong>April 16, 1935</strong> — I was born in Harbor City. My father was a craftsman.</p><p class='bio-entry'><strong>Late 1950s</strong> — The wave of migration and money on Orange Island, sixty kilometers out, drew me to it.</p><p class='bio-entry'>Orange Island was building everything at once then; new houses were going up everywhere. I fell in love at first sight with a three-story building facing the beach. The Island Mayor said it was planned as a hotel, but nobody dared take it on, because the fittings you had to buy all came from the mainland at double the price.</p><p class='bio-entry'>I took the building on impulse, and that nearly emptied my pockets. It was still bare inside. That did not stop me. I went all over the island collecting fittings stripped out of old houses: a red-brick oven from the 1920s, wooden railings from the 1930s, flowerpots from the 1940s. Eventually I had enough to furnish a hotel and a restaurant, and I opened in <strong>1961</strong>.</p><p class='bio-entry'>The restaurant and the hotel did wonderful business. Once there was money, some of the old things were replaced with new ones, but some I could not bear to part with — the red-brick oven, for one. Everything it bakes still tastes better than anything from a modern oven.</p><p class='bio-entry'>That three-story building is everything I have. To keep it in the family, I wrote out a hard rule in my own hand and framed it: <em>the eldest son shall not leave the island.</em></p><p class='bio-entry'><strong>September 9, 2010</strong> — I died in old age and was buried in the cemetery at the northeast corner of Orange Island. Looking southwest from my grave, you can see the thing I am proudest of in my life.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1935年4月16日</strong> — 我出生在海港城，父亲是手艺人。</p><p class='bio-entry'><strong>1950年代末期</strong> — 六十公里外的橘子岛的移民潮和经济繁荣，吸引我来到了这座岛上。</p><p class='bio-entry'>当时的橘子岛正在大兴土木，到处都在盖新房子。我一眼爱上了面朝海滩的三层小楼，岛长说这是规划中的旅馆，但是没人敢接，因为需要购买的设施太多了，这些设施从大陆运过来，价格还得翻一倍。</p><p class='bio-entry'>我头脑一热，把三层小楼接下来了，这已经差不多花光了我全部的资金。小楼里还是空空的，这难不倒我。我全岛收集从旧房子里拆下来的设施：1920年代的红砖烤炉，1930年代的木制栏杆，1940年代的花盆。终于凑齐了旅馆和餐馆的陈设，并在 <strong>1961年</strong> 开了业。</p><p class='bio-entry'>餐馆和旅馆的生意好得不得了。赚了钱之后，有些旧物换了新，但有的我舍不得换——比如那个红砖烤炉，它比新式烤炉烤出来的东西都要好吃。</p><p class='bio-entry'>这栋三层小楼就是我的全部。为了保住这份基业，我亲手写下并裱起了一条死规矩：<strong>“长子不得离岛。”</strong></p><p class='bio-entry'><strong>2010年9月9日</strong> — 我年迈去世，安葬在橘子岛东北角的墓园里。从我的墓地往西南望去，能看到我一生最骄傲的资本。</p>"
                },
                "LibraryFounderM": {
                        "x": 774.5,
                        "y": 177,
                        "bp": "orange_island",
                        "by": "1952",
                        "dy": "2025",
                        "name_en": "Library Founder",
                        "name_zh": "图书馆建立者",
                        "rel_en": "Library Founder",
                        "rel_zh": "图书馆建立者",
                        "sum_en": "An island child who was never allowed out in daylight. He came home with a boatful of books and one very strange rule.",
                        "sum_zh": "从小被禁止在白天出门的岛上孩子。带着一船旧书回岛，把娱乐中心改成图书馆，还定下一条古怪的借还规矩。",
                        "bio_en": "<p class='bio-entry'><strong>November 3, 1952</strong> — I was born on Orange Island. My parents worked at the orange factory. They and all their workmates had come from off the island. Everyone was deeply grateful to Orange Island for steady work, steady wages, and a steady life. I liked Orange Island too, but I wanted to go outside in the daytime. \"The sun here is poison,\" the grown-ups always said. I said, \"I want to see how poisonous.\" They said, \"Not allowed.\"</p><p class='bio-entry'><strong>1960</strong> — The Island Mayor built the water park on the plaza and made the whole island live by night. I had been waiting to grow old enough that nobody could tell me \"not allowed\" anymore, so I could find out how poisonous the sun was. Now that was impossible, because the thing saying \"not allowed\" was the rules themselves.</p><p class='bio-entry'><strong>1970</strong> — I left the island for Plains University. It took me a long time to get back to sleeping at night like everyone else. In the huge, sunlit city library, I felt something I had never felt before: freedom that had never been tamed. The Holy Water Plaza came back to me in my dreams night after night. I kept feeling I ought to do something.</p><p class='bio-entry'><strong>1982</strong> — I came back to Orange Island with a boat full of carefully chosen secondhand books, took over the recreation center in the town center, and turned it into a library and cinema. I set one strange rule: <em>to return a book, put an old book in the place of the one you are borrowing.</em> The islanders called me the sleepyhead librarian, always dozing behind the shelves, and they said the library was a mess. But they always found something they were not looking for.</p><p class='bio-entry'><strong>October 5, 2025</strong> — I left this world.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1952年11月3日</strong> — 我出生在橘子岛。父母是橘子工厂的工人。父母和工友们都是从岛外来的移民，大家都深深地感谢橘子岛，因为这里有稳定的工作和收入、稳定的生活环境。我也很喜欢橘子岛，但是我想白天出去玩。“岛上的太阳有毒”，大人们总是这么说。我说：“我想试试有多毒。”大人们说：“不准。”</p><p class='bio-entry'><strong>1960年</strong> — 岛长在广场建起了水上乐园，强制全岛人必须“昼伏夜出”。我原本想等我长大到没有人对我说“不准”的年龄，试试“太阳有多毒”，看来不可能了，因为对你说“不准”的变成了制度。</p><p class='bio-entry'><strong>1970年</strong> — 我离岛去了平原大学，花了好长时间才改回夜间休息的正常作息。在布满阳光的巨大市立图书馆里，我第一次感受到了未被驯化的自由。橘子岛的圣水广场夜夜回到我的梦中，我总觉得我应该做点什么。</p><p class='bio-entry'><strong>1982年</strong> — 我带着一船精心挑选的旧书回到了橘子岛，接手了镇中心的娱乐中心，把它改造成了图书馆和电影院。我定下了一条古怪的规矩：<strong>“归还书籍的方式是，把旧书放在新借的书的位置上。”</strong> 岛民们说我是“瞌睡虫图书管理员”，总在书架后睡觉，还说图书馆的书乱糟糟的。但他们总是能找到意外之喜。</p><p class='bio-entry'><strong>2025年10月5日</strong> — 我离开了人世。</p>"
                },
                "MrMailMoneyM": {
                        "x": 662.5,
                        "y": 200,
                        "bp": "outside",
                        "by": "1961",
                        "dy": "2026",
                        "name_en": "The One Who Sent His Wages Home",
                        "name_zh": "工资全寄回老家的人",
                        "rel_en": "The One Who Sent His Wages Home",
                        "rel_zh": "工资全寄回老家的人",
                        "sum_en": "Fifty years of wages posted back to Old Sail Town. He was still saving for a retirement on the Golden Coast.",
                        "sum_zh": "半辈子的工资都寄回旧帆镇养家，剩下的钱攒着，为了退休后去黄金海岸生活。",
                        "bio_en": "<p class='bio-entry'><strong>February 28, 1961</strong> — I was born in Old Sail Town. My parents were fishing people. I have two younger brothers and a younger sister.</p><p class='bio-entry'><strong>1975</strong> — I was fourteen, old enough to go to sea with my father. But there were no fish left inshore at all, and what the two of us brought in did not even cover the repairs on our boat. People said there were plenty of fish in deep water, but deep-water fishing belonged to the big Harbor City companies with the big boats. Children born in Old Sail Town got a thin childhood, and for most of us the only way out was to find a job in Harbor City.</p><p class='bio-entry'><strong>1976</strong> — I took the money from my father's sold boat and went to Harbor City. The whole family's hopes rode with me. What I had not expected was that fifteen is too young; almost nobody would hire me. Then I happened to see that Orange Island, sixty kilometers away, was recruiting seasonal orange pickers. Good pay, meals and lodging included, and the boat ticket both ways. So I went. It really was a good job. The pay was good and there was nothing to spend it on, so I could send nearly all of it home. My parents stopped worrying, and my brothers and sister kept growing.</p><p class='bio-entry'>I kept looking for a way to become a permanent worker on Orange Island. Four years later, in <strong>1980</strong>, the orange factory was hiring and I signed up immediately. I started as a loader. A year later I was trained onto the cold press, and my wages went up a lot. When my brothers and sister — who had been about to quit school — heard that, they cheered. Instead of dropping out to find work in Harbor City, they stayed in school.</p><p class='bio-entry'><strong>1980s</strong> — One after another they graduated from vocational school, and one of my brothers even won a scholarship to university. I was so proud of them.</p><p class='bio-entry'><strong>1990s</strong> — My parents said the family was no longer under any money pressure. I suggested we fix up the house. I wanted to save a few more years, then go home to Old Sail Town and start a family.</p><p class='bio-entry'><strong>From the 2000s</strong> — My parents started getting sick more easily. My brothers and sister had all just married and had children, and they were under pressure of their own. I was never going to spend my money anyway, so I sent it home to take care of our parents. And I saw a program about the Golden Coast again — beautiful, houses not expensive, fish still in the water nearby. I decided that was where I would go when I retired.</p><p class='bio-entry'><strong>2014 and 2015</strong> — My parents died, one after the other. My brothers and sister all had settled lives now, but every month I still walked to the post office in the dormitory building and wired them some money. Everything else I saved, for my life on the Golden Coast after I retired.</p><p class='bio-entry'><strong>May 30, 2026</strong> — I died in the great explosion at the orange factory.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1961年2月28日</strong> — 我出生在旧帆镇，父母是渔民，我还有两个弟弟和一个妹妹。</p><p class='bio-entry'><strong>1975年</strong> — 我十四岁，到了随父亲出海捕鱼的年纪，但近海已经完全没有鱼了，我和父亲捕鱼的收入连家里渔船的维修费用都无法覆盖。人们说远洋的鱼很多，但远洋的捕鱼机会属于海港城大公司的大渔船。出生在旧帆镇的孩子们在镇上草草地过完童年和少年时期，大部分人的出路就是去海港城找份工作。</p><p class='bio-entry'><strong>1976年</strong> — 我带着父亲卖掉渔船的钱，来到了海港城，全家的希望都在我身上。然而没预料到的是，十五岁还太小，没有多少人愿意雇我。偶然的机会我看到离海港城六十公里的橘子岛在招季节性橘子采摘工人，薪资不错，包吃包住，而且包往返的船票。我来到了橘子岛，这确实是一份好工作，薪资不错，也没有什么花钱的地方，我能把绝大多数钱都寄回家。父母不再发愁，弟弟妹妹们也在长大。</p><p class='bio-entry'>我一直在找机会成为橘子岛的正式工人。终于在四年后，<strong>1980年</strong>，橘子工厂招工，我赶快报了名。一开始是搬运货物的工人，一年后经过培训，我升级成为冷压机器的操作工，工资涨了很多。正准备辍学的弟弟妹妹们知道了这个消息后欢呼雀跃，他们不再着急辍学去海港城谋生，而是继续在学校念书。</p><p class='bio-entry'><strong>1980年代</strong> — 弟弟妹妹们陆续从职业学校毕业，有一个弟弟甚至得到了奖学金去念大学。我真为他们骄傲。</p><p class='bio-entry'><strong>1990年代</strong> — 父母说家里已经没有经济压力了。我提议把房子修一修，我想再攒几年钱，然后回旧帆镇成立家庭。</p><p class='bio-entry'><strong>2000年代开始</strong> — 父母的身体开始容易生病了，弟弟妹妹都是刚刚结婚有孩子，压力也很大。我的钱反正也花不掉，就寄回家照顾父母。我又一次在电视上看到黄金海岸的介绍，很美，房子也不贵，近海有鱼，我决定退休了就去那里住。</p><p class='bio-entry'><strong>2014年和2015年</strong> — 父母相继过世，弟弟妹妹也都过上了稳定的生活，但是我每个月还是会去员工宿舍楼的邮局，给他们汇一些钱。剩下的钱我都攒起来了，为了退休后在黄金海岸的生活。</p><p class='bio-entry'><strong>2026年5月30日</strong> — 我死于橘子工厂的大爆炸。</p>"
                },
                "PowerStationMomofEngineerF": {
                        "x": 712.5,
                        "y": 178,
                        "bp": "outside",
                        "by": "1953",
                        "dy": "2015",
                        "name_en": "Mother of the Power Engineer",
                        "name_zh": "电站工程师的妈妈",

                        "sum_en": "She had her child late and left early, missing her son's eighteenth birthday.",
                        "sum_zh": "年纪很大才有了孩子，却没能等到儿子的十八岁生日。",
                        "bio_en": "<p class='bio-entry'><strong>August 30, 1953</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1997</strong> — I was already old when my child finally came.</p><p class='bio-entry'><strong>August 1, 2015</strong> — My body gave out and I left this world early, too early even to reach my son's eighteenth birthday. The great regret of my life is this: I had my child too late, and I died too soon.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1953年8月30日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1997年</strong> — 我在年纪很大的时候，才迎来了自己的孩子。</p><p class='bio-entry'><strong>2015年8月1日</strong> — 我因为身体原因，早早地离开了人世，甚至没能坚持到儿子的十八岁生日。我这一辈子最大的遗憾是：生孩子太晚，去世得又太早。</p>"

                        "name_en": "Great War Veteran",
                        "name_zh": "大战退伍老兵",
                        "rel_en": "Great War Veteran",
                        "rel_zh": "大战退伍老兵",
                        "sum_en": "Exiled himself to the island to keep his family safe from his own night terrors. The dark here healed him.",
                        "sum_zh": "为了不在夜惊中误伤家人而自我流放上岛，成为第一批夜班工人。橘子岛的黑夜治好了他。",
                        "bio_en": "<p class='bio-entry'><strong>December 7, 1918</strong> — I was born in South Lake City.</p><p class='bio-entry'><strong>1940</strong> — I enlisted.</p><p class='bio-entry'><strong>1945</strong> — The war stopped for a while. I went home with my discharge pay and got my wife and children settled. But I had come back with severe post-traumatic stress. I did not sleep at all, and one night I had a war hallucination in the middle of a night terror and nearly hurt my own family. When I came out of it, all I saw was the terror in my wife's and daughter's eyes.</p><p class='bio-entry'>To keep them safe, the only thing I could do was exile myself. I came to Orange Island and became one of its first night-shift workers. I worked deep in the night, and the sweetness that burst out of the peel when I opened an orange washed the gunsmoke out of my head. In the daytime, behind heavy curtains, I could finally sleep six solid hours. The nights of Orange Island healed me.</p><p class='bio-entry'><strong>1946</strong> — My condition settled for good. I called home and told my wife and children I was safe. I wanted to ask, \"Are you still afraid of me coming home?\" but I could not get it out. My wife spoke first: \"Aren't you planning to come home yet?\"</p><p class='bio-entry'>After that I lived a quiet life, without incident.</p><p class='bio-entry'><strong>August 8, 2008</strong> — I left this world peacefully.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1918年12月7日</strong> — 我出生在南湖市。</p><p class='bio-entry'><strong>1940年</strong> — 我应征入伍。</p><p class='bio-entry'><strong>1945年</strong> — 战争暂时结束了，我带着退伍费回到了家，安置了妻子和孩子。但我患上了严重的创伤后应激障碍（PTSD），彻夜失眠，甚至在一次夜惊中产生了战争幻觉，差点误伤了我的家人。等我惊醒过来，看到的只有妻子和女儿惊恐的眼神。</p><p class='bio-entry'>为了保护家人，我只能自我流放。我来到了橘子岛，成了橘子岛的第一批“夜班工人”。每天深夜劳作，剥开橘皮时喷涌而出的甜香洗刷了我的硝烟幻觉；白天，在厚重的窗帘下，我终于能安稳地睡上六个小时。橘子岛的黑夜治愈了我。</p><p class='bio-entry'><strong>1946年</strong> — 我的病情彻底稳定下来。我拨通了家里的电话，告诉妻子和孩子我很平安。我想问“你们还怕我回家吗？”却问不出口，妻子率先开了口：“你还不打算回家吗？”</p><p class='bio-entry'>后来，我过上了波澜不惊的日子。</p><p class='bio-entry'><strong>2008年8月8日</strong> — 我平静地离开了这个世界。</p>"
                },
                "BartenderM": {
                        "x": 453.5,
                        "y": 260,
                        "bp": "outside",
                        "by": "1985",
                        "dy": "2023",
                        "name_en": "Moonlight Bartender",
                        "name_zh": "月光调酒师",
                        "rel_en": "Moonlight Bartender",
                        "rel_zh": "月光调酒师",
                        "sum_en": "Born with xeroderma pigmentosum. One afternoon in the sun won him a gold medal and cost him his life.",
                        "sum_zh": "患有着色性干皮病。一次白天的调酒比赛为他赢得金奖，也埋下了十年后的黑色素瘤。",
                        "bio_en": "<p class='bio-entry'><strong>April 12, 1985</strong> — I was born in Harbor City. The doctors found out very quickly that I had xeroderma pigmentosum, a rare condition that makes ultraviolet light dangerous to me.</p><p class='bio-entry'><strong>2007</strong> — After twenty-two years of carefully avoiding the sun, I entered a daytime beach cocktail competition. My drink, the Solar Blaze, took the gold. I pulled off my heavy sun gear and walked up onto the podium in full daylight, with liquor and fruit juice spilling all over me.</p><p class='bio-entry'><strong>2008</strong> — I got married. My wife was a sun-loving girl with skin the color of wheat.</p><p class='bio-entry'><strong>2015</strong> — My wife found Orange Island on a map and suggested we move there. I took a job behind the bar of a restaurant on the island. Orange Island's nocturnal schedule let me work \"normal hours\" without wearing any protective gear at all. It was wonderful.</p><p class='bio-entry'><strong>2017</strong> — That one day of sun ten years earlier finally added up, and a melanoma grew out of my body. For the next six years I kept working as a bartender on painkillers, and I failed to notice that my wife's seasonal affective disorder was getting worse and worse.</p><p class='bio-entry'><strong>August 15, 2023</strong> — I left this world. Before I went, I bought my wife a boat ticket off the island.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1985年4月12日</strong> — 我出生在海港城。但很快，医生就发现我患有着色性干皮病（XP），这是一种让我极度惧怕紫外线的罕见疾病。</p><p class='bio-entry'><strong>2007年</strong> — 认真躲避阳光二十二年的我，参加了一场白天的海滩调酒比赛，我的“阳光烈焰”获得了金奖。我扯下厚重的防晒服走上烈日下的领奖台，美酒和果汁都洒在我身上。</p><p class='bio-entry'><strong>2008年</strong> — 我结婚了，妻子是个小麦色肌肤的阳光女孩。</p><p class='bio-entry'><strong>2015年</strong> — 妻子在地图上找到了橘子岛，并提议我们移居过来，我在岛上的餐馆吧台工作。橘子岛昼伏夜出的作息让我能在“正常时间”内工作，而且不用穿任何防护服，这简直太棒了。</p><p class='bio-entry'><strong>2017年</strong> — 十年前的暴晒终于积累成了黑色素瘤，从我的身体里长了出来。接下来的六年内，我靠止痛药片坚持去当调酒师，却忽略了妻子的季节性抑郁症（SAD）越来越严重。</p><p class='bio-entry'><strong>2023年8月15日</strong> — 我离开了这个世界。去世前，我为妻子买好了离开小岛的船票。</p>"
                },
                "OldTeacherF": {
                        "x": 612.5,
                        "y": 167,
                        "bp": "outside",
                        "by": "1950",
                        "dy": "2024",
                        "name_en": "Schoolmaster",
                        "name_zh": "教书先生",
                        "rel_en": "Schoolmaster",
                        "rel_zh": "教书先生",
                        "sum_en": "Taught the island's children in the middle of the night for thirty years, and raised the girl who would replace them.",
                        "sum_zh": "在半夜给岛上的孩子上课三十年，也养大了那个后来回岛接班的女孩小白。",
                        "bio_en": "<p class='bio-entry'><strong>January 5, 1950</strong> — I was born into a scholarly household in Plains City. I started teaching at twenty and taught primary school children for twenty-five years.</p><p class='bio-entry'><strong>1995</strong> — I applied for a post on distant Orange Island. To fit their parents' working hours, the children here slept during the day and came to school in the middle of the night.</p><p class='bio-entry'>The children on Orange Island were not like the children I had taught before. They were shorter than mainland children, they started going nearsighted at seven or eight, and their tempers were short. They could finish middle school at our school, but some parents asked me whether they should send their children away earlier. It tore at me. I did not know which does more damage to a child: distance from their parents, or distance from the sun.</p><p class='bio-entry'><strong>1998</strong> — A little girl came to the school. Bai, three years old, from the lighthouse keeper's family. She was a quiet child. She said her dream was to be a teacher — the teacher at the Orange Island school. When Bai was five, something happened at home: her mother fell ill, and her father sold everything they owned and still could not save her. Bai and her father moved into the narrow lighthouse.</p><p class='bio-entry'><strong>2001</strong> — I brought Bai home to live with me. My house is small too, but it is far roomier than the inside of a lighthouse. She still went back once every day, because she said, \"I haven't made my dad laugh yet today.\"</p><p class='bio-entry'><strong>2010</strong> — Bai left the island for high school, and later she got into Plains University and chose education. She and I wrote to each other often. She had never forgotten the dream she had as a child: to be the teacher on Orange Island. I told her to go and look at what children elsewhere are like, because that is the only way to know what the children here are missing.</p><p class='bio-entry'><strong>2020</strong> — I was seventy, and I could feel that I would not be able to teach much longer, but I could not find anyone to take over. In the end I asked Bai. Ten days later she was back.</p><p class='bio-entry'>Bai is a good teacher, but she is always in a hurry. She runs on coffee and sleeping pills, she flipped her body clock the day she landed, she is always busy, she never has one second to spare. When the students play in the schoolyard, she comes out to check on them every five minutes. Bai, it is all right to stop and rest.</p><p class='bio-entry'><strong>June 20, 2024</strong> — I left this world on Orange Island. I am not worried about the students, because they have Bai. The one I worry about is Bai.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1950年1月5日</strong> — 我出生在平原市的一个书香门第。从二十岁开始当老师，教了二十五年的小学生。</p><p class='bio-entry'><strong>1995年</strong> — 我应聘来到了偏远的橘子岛。这里的孩子们为了适应家长们工作的作息，白天睡觉，半夜上学。</p><p class='bio-entry'>橘子岛的孩子和我之前教过的孩子不太一样，他们比大陆的孩子矮，才七八岁年纪就开始近视，脾气很焦躁。孩子可以在学校念完初中，但有父母问我是否要更早送孩子出去念书，我很纠结，我不知道远离父母和远离阳光，哪个对孩子的伤害更大。</p><p class='bio-entry'><strong>1998年</strong> — 学校来了一个小女孩小白，三岁，是灯塔管理员一家的孩子，她是个安静的孩子。她说她的理想就是当老师，当橘子岛学校的老师。小白五岁的时候，家里发生了变故，妈妈生病了，爸爸卖掉家里所有的东西还是没能治好妈妈。小白和爸爸住进了狭窄的灯塔。</p><p class='bio-entry'><strong>2001年</strong> — 我把小白接到家里来住，虽然我的房子也很小，但是比灯塔里面宽敞多了。小白每天都要回去一次，因为她说：“我今天还没逗我爸爸笑过。”</p><p class='bio-entry'><strong>2010年</strong> — 小白离开岛去念高中，后来她考上了平原大学，选的教育学。我和小白经常写邮件，她一直没忘记小时候的梦想——当橘子岛的老师。我建议她多看看外面的孩子是怎么样的，这样才能知道岛上的孩子缺什么。</p><p class='bio-entry'><strong>2020年</strong> — 我已经七十岁了，我感觉我可能教不了很久了，却迟迟找不到能接替我的人选。无奈，我问了问小白。十天后小白就回来了。</p><p class='bio-entry'>小白是个好老师，但是总是急匆匆的。她靠喝咖啡和吃安眠药撑着，上岛的当天就倒好了时差，永远都在忙，没有一秒钟的空闲时间。学生们在学校院子里的游乐场玩的时候，她每五分钟都要来看一次。小白，你可以停下来休息一下。</p><p class='bio-entry'><strong>2024年6月20日</strong> — 我在橘子岛离开了人世。我不担心学生们，因为他们有小白。我担心的是小白。</p>"
                },
                "FounderGrandmaF": {
                        "x": 737.5,
                        "y": 107,
                        "bp": "outside",
                        "by": "1925",
                        "dy": "2015",
                        "name_en": "Botanical Lady",
                        "name_zh": "香料女王",
                        "rel_en": "Botanical Lady",
                        "rel_zh": "香料女王",
                        "sum_en": "Took the boat nobody else would take, pressed the first Moon-white Orange peel, and built a spice empire.",
                        "sum_zh": "别人都不肯去的时候她去了橘子岛，压出第一批月白橘皮精油，建起了自己的香料帝国。",
                        "bio_en": "<p class='bio-entry'><strong>May 8, 1925</strong> — I was born somewhere remote. I no longer remember the name of the place. For as long as I can remember, my parents were dragging me around Harbor City looking for work, and we lived inside a tiny spice workshop.</p><p class='bio-entry'><strong>1945</strong> — My parents died. I inherited their heavy cast-iron mortar, their copper sieves, their hand press, and their entire savings — enough for two years.</p><p class='bio-entry'><strong>1946</strong> — I carried the heavy equipment and the money to Plains University and found work as a lab assistant in the chemistry department. Because I had grown up around plant materials, I quickly became the person in that lab who best understood distillation, extraction, and handling plant matter.</p><p class='bio-entry'><strong>1948</strong> — With the professor's help, I passed a special entrance examination and enrolled in the chemistry department. <strong>1952</strong> — I earned my bachelor's degree in chemistry. I wanted to buy a distillation and extraction set and rebuild my parents' workshop, but the money was gone.</p><p class='bio-entry'><strong>1952</strong> — Orange Island, sixty kilometers from Harbor City, was building a perfume factory and looking for a partner in plant extraction. Most people in the trade refused to go. They said the seas were too rough, the equipment was too heavy, they did not want to be that far from family, and the lady of the island was an aristocrat who would never get along with people in our business. I went. And I met the woman who would later be called the Perfume Queen. We became close friends and business partners.</p><p class='bio-entry'><strong>End of 1952</strong> — I watched her sign away everything she owned for the loan that bought a cold-press line. And I used that line to extract the essence out of Moon-white Orange peel.</p><p class='bio-entry'><strong>1958</strong> — Blanc de Lune was a triumph. With my share from the label, I built spice factories all over the mainland. By the 1980s I had close to a third of the plant-materials industry. Calling me the Botanical Lady was not an exaggeration.</p><p class='bio-entry'>I stopped going to Orange Island much after that, but I always kept the house the Perfume Queen gave me. Every few years I took my children there on holiday to see where our spice empire began. Honestly, not one of my children or grandchildren inherited my fight or my stubbornness. That was the great worry of my old age.</p><p class='bio-entry'><strong>November 20, 2015</strong> — I left this world. I left the house on Orange Island to the granddaughter I had the most hope for.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1925年5月8日</strong> — 我出生在一个偏远的地方，我已经不记得具体的地名了。从记事开始，我就被父母带着在海港城谋生，我们住在一个小小的香料作坊里。</p><p class='bio-entry'><strong>1945年</strong> — 父母去世，我接过他们留下的粗重铸铁研磨钵、铜筛和手工压榨器，以及他们全部的储蓄——够我用两年。</p><p class='bio-entry'><strong>1946年</strong> — 我带着沉重的手工设备和钱来到平原大学，在化学实验室找到一份实验助理的工作。因为从小接触植物香料，我很快成为教授手下最熟悉蒸馏、萃取和植物材料处理的人。</p><p class='bio-entry'><strong>1948年</strong> — 在教授的帮助下，我通过特别入学考试进入化学系。<strong>1952年</strong>，我取得化学学士学位。我想买一套蒸馏萃取设备重建父母留下的香料作坊，但是钱全都花光了。</p><p class='bio-entry'><strong>1952年</strong> — 离海港城六十公里的橘子岛上准备建香水工厂，寻找植物香料提取的合作商。很多同行都不愿意去，说风浪太大，说设备太重，说不想离家人太远，说岛上的太太是个贵族、和香料行业气场不合。我去了，我结识了那位后来被誉为“香水女王”的女士，后来我们成为了挚友与商业伙伴。</p><p class='bio-entry'><strong>1952年年底</strong> — 我亲眼看到香水女王抵押了自己的全部资产，换取贷款买了一套冷压设备。而我，用这套设备提取了月白橘果皮里的精华。</p><p class='bio-entry'><strong>1958年</strong> — “白之月”香水大获成功，我用“白之月”品牌分到的钱在大陆各地建起了香料工厂。到1980年代，我几乎垄断了三分之一的植物香料行业，他们叫我“香料女王”一点都不夸张。</p><p class='bio-entry'>后来我去橘子岛很少了，但是香水女王送的橘子岛的房子我一直保留着，我每隔几年都会带我的孩子们去橘子岛度假，看看我们家香料帝国的第一站。说实话，我的儿女辈和孙辈一个都没继承我的斗志和决心——这是我老年时期最大的担忧。</p><p class='bio-entry'><strong>2015年11月20日</strong> — 我离开了人世。橘子岛的房子留给了我最抱有期待的外孙女。</p>"
                },

                        "bio_en": "<p class='bio-entry'><strong>November 11, 2005</strong> — I was born in Harbor City. My mom and dad and I were the happiest family in all of Harbor City.</p><p class='bio-entry'><strong>February 14, 2015</strong> — I had just stepped out of our front door when a speeding car hit me. I died right there.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>2005年11月11日</strong> — 我出生在海港城。我和爸爸妈妈是全海港城最幸福的家庭。</p><p class='bio-entry'><strong>2015年2月14日</strong> — 我刚出家门，就被一辆疾速行驶的汽车撞倒，当场去世。</p>"

                "OrangeChiefAngelFather": {

                        "name_zh": "早逝女儿的父亲",
                        "rel_en": "Father of the Daughter Who Left Too Soon",
                        "rel_zh": "早逝女儿的父亲",
                        "sum_en": "Moved to the island to get away from every street that reminded him of his daughter. Died in the factory explosion.",
                        "sum_zh": "为躲开海港城里女儿的身影搬来橘子岛当厂长。死于 2026 年橘子加工厂大爆炸。",
                        "bio_en": "<p class='bio-entry'><strong>March 31, 1976</strong> — I was born in Harbor City.</p><p class='bio-entry'><strong>2005</strong> — I got married. My daughter was born that November.</p><p class='bio-entry'><strong>February 14, 2015</strong> — My daughter was hit by a car and died at the scene.</p><p class='bio-entry'><strong>2017</strong> — My wife and I could not stand living in Harbor City any longer, because our daughter was in every park and on every street. We moved to Orange Island, where the orange processing plant needed a plant manager.</p><p class='bio-entry'>I know my wife packed our daughter's things and brought them to Orange Island too. She put the boxes in the small bedroom. Every day after I leave for work, she sits in that room and stares at nothing. I never say anything about it. The truth is I wish I had the chance to sit in that room all day myself.</p><p class='bio-entry'><strong>May 30, 2026</strong> — The orange processing plant exploded. A slab of the floor above came down on me. I was in the operating room for two days, and they could not bring me back.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1976年3月31日</strong> — 我出生在海港城。</p><p class='bio-entry'><strong>2005年</strong> — 我结婚了，同年十一月女儿出生。</p><p class='bio-entry'><strong>2015年2月14日</strong> — 女儿遭遇车祸，当场去世。</p><p class='bio-entry'><strong>2017年</strong> — 我和妻子实在无法忍受住在海港城了，因为每个公园、每条街道都是女儿的身影。我们搬到橘子岛住，那里的橘子加工厂需要一个厂长。</p><p class='bio-entry'>我知道妻子把女儿的物品也打包带到了橘子岛，她把那些箱子放在小卧室里。每天我上班之后，她就坐在那个小卧室发呆。我不拆穿她，其实我希望我也能有机会整天坐在那个小卧室发呆。</p><p class='bio-entry'><strong>2026年5月30日</strong> — 橘子加工厂大爆炸，我被掉下来的楼板砸中。我在手术室躺了两天，没能被救回来。</p>"

                        "sum_en": "A wealthy man with porphyria who hid on an island of night, with a Van Gogh in the smallest room.",
                        "sum_zh": "患卟啉症的富家子弟，为躲避亲戚隐居到这座黑夜之岛，最小的房间里挂着一幅梵高。",
                        "bio_en": "<p class='bio-entry'><strong>July 22, 1966</strong> — I was born into a wealthy merchant family in Harbor City. But I have had a rare porphyria since childhood, and even weak sunlight makes my skin break open. People called me Dracula behind my back. I did not mind. Like Dracula, I have money.</p><p class='bio-entry'><strong>1997</strong> — My parents died and left their entire estate to me, which astonished the relatives. \"Didn't they even have an illegitimate child?\" they said. They would have loved to be my parents' illegitimate children. Not long after the funeral, relatives who had never bothered to look at me twice started coming by to ask how I was doing. I am ill; I am not stupid. I knew what they were thinking. One day my mother's jewelry box was gone. That was when I understood the danger.</p><p class='bio-entry'>I had heard of a place at sea called Orange Island, where every single resident lived by night. To me that sounded like paradise from a story. I had my lawyer buy a small house there for me and seal up my assets on the mainland. On an ordinary day in May 1998, I boarded a boat to that island of night, alone, carrying my favorite things. The house was small but comfortable. Most of my collection I did not dare display. But I loved Van Gogh's <em>Starry Night Over the Rhône</em> too much to leave it shut in a dark crate, so I hung it in the smallest room, together with my grand piano.</p><p class='bio-entry'>I found work at the orange processing plant. Most of my workmates lived in the dormitory, though one of them had his own house right next door to mine, so I did not stand out too badly. Before long everyone on the island knew me as the young man \"who has to earn money to treat his illness.\"</p><p class='bio-entry'>Later I let my guard down, even invited workmates over to play cards. Once a workmate went into the small room looking for a bottle, and my stomach dropped while I scrambled for an excuse — <em>I'll say I painted a copy of it myself.</em> It turned out I had worried for nothing. He did not give the painting on the wall or the grand piano a second glance. He picked a bottle off the rack and went back to the living room.</p><p class='bio-entry'>These decades on the island have been peaceful. And slowly I worked out who my money should go to.</p><p class='bio-entry'><strong>May 30, 2026</strong> — The orange factory exploded, and I was killed in it.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1966年7月22日</strong> — 我出生在海港城一个富庶的商人家庭。但我从小患有罕见的卟啉症，哪怕是微弱的阳光都会让我的皮肤溃烂。人们背地里叫我德库拉，我不介意，我和德库拉一样有钱。</p><p class='bio-entry'><strong>1997年</strong> — 我父母去世，遗产都留给了我——这让亲戚们非常惊讶。“他们连私生子都没有吗？”亲戚们说，他们恨不得自己是我父母的私生子。父母去世后不久，那些以前都不愿意多看我一眼的亲戚们经常过来嘘寒问暖。我只是病了，我不是傻了，我知道他们在想什么。母亲的珠宝盒某一天不见了，我意识到了危险。</p><p class='bio-entry'>我听说海上有一座名叫橘子岛的地方，那里的居民全体昼伏夜出。对我而言，那简直是传说中的天堂。我请律师出面帮忙买下了岛上的一栋小房子，封存好大陆的资产。<strong>1998年5月的一个平常日子</strong>，我独自一人带着最喜欢的一些东西登上了那座黑夜之岛。岛上的房子不大，但很舒服。我有很多收藏品不敢摆出来，只是梵高的《罗讷河上的星夜》我实在是喜欢，不忍它放在黑暗的箱子中，就把它挂在最小的房间里，和我的三角钢琴放在一起。</p><p class='bio-entry'>我在橘子加工厂找到一份工作，工友们大都住在员工宿舍，不过也有一个工友有自己的房子，就住在我隔壁，所以我也不算太显眼。不久，岛上的人都知道了我——那个“需要赚钱给自己治病”的小伙子。</p><p class='bio-entry'>后来我慢慢放下了防备，甚至邀请工友到家里来打牌。有一次工友找酒进了小房间，我心里一阵紧张，脑子里赶紧想对策——“我就说那幅画是我临摹的”。事实证明我的担忧是多余的，工友对墙上的画和三角钢琴都没多看一眼，从酒架上挑了一瓶酒就回到客厅了。</p><p class='bio-entry'>在岛上这几十年，我过得很安心，我也慢慢想清楚了我的财富应该留给谁。</p><p class='bio-entry'><strong>2026年5月30日</strong> — 橘子工厂发生大爆炸，我被炸死了。</p>"
                },

                        "sum_en": "The island's first sheriff. He found the proof that it was murder, and hid it inside his own locker.",
                        "sum_zh": "橘子岛最早的治安官。他找到了海洋学家被谋杀的证物，却把它锁进了自己的储物柜。",
                        "bio_en": "<p class='bio-entry'><strong>September 12, 1958</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1985</strong> — I became the first sheriff Orange Island ever had. The island was in the middle of industrial expansion and tightening control, and I spent every day moving between the police station, the fire station, and the gym, doing my job. My greatest wish was the line I had engraved on the plate of the fire engine: <em>May our nights be forever quiet.</em></p><p class='bio-entry'><strong>April 2017</strong> — The marine scientist from the crab lab drowned. I was the first to reach the scene, and the first to see that it was murder. I found the dive watch with dried blue horseshoe crab blood on it, and the surviving pages of his waterproof notes. I did not pursue it. I closed the case as a drowning. I hid the evidence behind the slats inside my own locker in the changing room.</p><p class='bio-entry'><strong>2021</strong> — I retired from the sheriff's post on Orange Island and went back to Plains City.</p><p class='bio-entry'><strong>March 15, 2026</strong> — I died.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1958年9月12日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1985年</strong> — 我成为了橘子岛上最早的治安官。那时的岛屿正经历工业的扩张与管理的收紧，我每天在警察局、消防站和健身房之间穿梭，恪尽职守。我最大的心愿，就像我刻在消防车铭牌上的那句话一样：<strong>“愿我们的夜晚永远宁静。”</strong></p><p class='bio-entry'><strong>2017年4月</strong> — 鲎实验室的海洋学家溺水死亡，我是最先到达现场并发现谋杀真相的人——我找到了那块带有干涸蓝色鲎血的潜水表，以及他的防水笔记残页。然而，我没有查下去，以“溺水”结案。我把证物藏在了更衣室里我专属储物柜的百叶窗夹层中。</p><p class='bio-entry'><strong>2021年</strong> — 我从橘子岛治安官的职位退休，回到平原市养老。</p><p class='bio-entry'><strong>2026年3月15日</strong> — 我去世了。</p>"

                "OrchardGardenerM": {
                        "x": 687.5,

                        "name_en": "Master Grafter",
                        "name_zh": "嫁接大师",
                        "rel_en": "Master Grafter",
                        "rel_zh": "嫁接大师",
                        "sum_en": "A prize-winning horticulturist with a prison record. He buried his release papers under the twelve mother trees.",
                        "sum_zh": "得过大奖、也坐过牢的园艺师。把释放文件和囚服编号布章埋进了十二棵母树旁的土里。",
                        "bio_en": "<p class='bio-entry'><strong>August 14, 1905</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1928</strong> — I was a brilliant young talent in horticulture, and I won the Horticultural Society's Rising Star Award. I was full of myself then, and I had the finest honor in the field.</p><p class='bio-entry'><strong>Early 1930s</strong> — The Depression came through and life turned over in a single night. In one bad moment, I stole a bag of meat and went to prison for it.</p><p class='bio-entry'><strong>1935</strong> — I finished my sentence. Unemployment was terrifying, and nobody hiring would give a man with a record a second glance. I could see exactly three possibilities: starve, hang myself, or risk stealing again. God gave me a fourth. In the margin of a newspaper I found a recruitment notice from Orange Island. They needed an expert in grafting orange trees. The word \"expert\" felt like it belonged to another lifetime, but I was certain of one thing: I could graft orange trees.</p><p class='bio-entry'>I went to the island without a moment's hesitation. When I saw the twelve Moon-white Orange mother trees the owners had raised, I could tell almost at once that those twelve trees could be propagated reliably. I buried my prison release papers and a numbered patch cut from my prison uniform in the soil beside those twelve trees, forever.</p><p class='bio-entry'><strong>1936</strong> — We finished grafting the first stand of Sea-Thorn, five hundred trees. I did not spend a single coin of my first year's wages. I buried the money under that little grove, as the last defense I would have if the world threw me out again.</p><p class='bio-entry'><strong>1940</strong> — Three thousand orange trees had taken. My name was carved beside the owner's on the granite foundation stone halfway up the orchard slope.</p><p class='bio-entry'><strong>1945</strong> — After the great harvest, the owner gave me a share of the mainland sales routes. I went back to Plains City on a boat loaded with oranges in crates printed with my name.</p><p class='bio-entry'><strong>April 5, 1982</strong> — I died of old age and left this world.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1905年8月14日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1928年</strong> — 我曾是园艺界才华横溢的年轻新秀，并荣获了“园艺协会新秀奖”。那时的我意气风发，拥有着最顶尖的荣誉。</p><p class='bio-entry'><strong>1930年代初</strong> — 大萧条席卷而来，一夜之间生活天翻地覆。一念之差下，我因为偷窃了一袋肉而锒铛入狱。</p><p class='bio-entry'><strong>1935年</strong> — 我刑满释放。当时失业率高得吓人，我这种有案底的人，招工的人看都不会看一眼。我当时只能看到三种可能：要么饿死，要么上吊自杀，要么再冒险偷一次。上帝给了我第四条路：我在报纸的夹缝中看到了橘子岛的招工广告，他们需要会嫁接橘子树的专家。“专家”这个词恍若隔世，但是我确信我会嫁接橘子树。</p><p class='bio-entry'>我没有丝毫犹豫地上岛了，看到了老板夫妇养出的十二棵月白橘母树，我很快判断出这十二棵树有稳定繁殖的价值。我把监狱释放文件和一块从囚服上剪下来的编号布章，永远埋进了十二棵母树旁的土里。</p><p class='bio-entry'><strong>1936年</strong> — 我们完成了第一片海棘果树林的嫁接，一共五百棵。我第一年的薪水分文未动，我把这些钱埋在小树林地下，作为防备被社会再次扫地出门的最后底气。</p><p class='bio-entry'><strong>1940年</strong> — 三千棵橘子树活了。我的名字和老板并列刻在了果园半山腰的花岗岩基石上。</p><p class='bio-entry'><strong>1945年</strong> — 橘子树大丰收后，老板把大陆的销售线分给了我一些。我和一船装在印着我名字的木箱里的橘子一起回到了平原市。</p><p class='bio-entry'><strong>1982年4月5日</strong> — 我自然老去，离开了这个世界。</p>"
                },

                        "rel_zh": "码头工人",
                        "sum_en": "Loaded the island's cargo for twenty-six years. His dog Orange waited at the pier for a boat that came back without him.",
                        "sum_zh": "在码头装卸押货二十六年。他捡回来的狗“橘子”，最后等回了一条没有他的船。",
                        "bio_en": "<p class='bio-entry'><strong>July 1978</strong> — I was born in the workers' dormitory on Orange Island. My father worked at the orange factory.</p><p class='bio-entry'><strong>1996</strong> — I found work at the dock, loading and escorting cargo. Orange Island shipped to the mainland on Tuesday and Thursday mornings: canned oranges, perfume, chemical goods with hazard labels, expensive reagents that had to stay cold. Because the island and the mainland kept different hours, I worked from nine on Monday night straight through to six on Tuesday evening, and from nine Thursday night to six Friday evening.</p><p class='bio-entry'><strong>A stormy night in 2013</strong> — The wind was howling. I found a shivering puppy under the breakwater at the dock. He had probably come over from the mainland by accident on a boat. I carried him back to the dormitory, and it turned out he ate oranges. So I named him Orange. From then on Orange came to the dock with me every day, and if I sailed to the mainland he waited at the dock until I came back the next day, and we walked home together.</p><p class='bio-entry'><strong>2022</strong> — My parents died within months of each other. They did not want to be buried on Orange Island. In September I took them back to Old Sail Town. When I returned, the boss told me cargo had been piling up unshipped for over ten days and asked me to run it to the mainland as soon as possible. I loaded the boat, gave Orange a hug, and sailed.</p><p class='bio-entry'><strong>September 22, 2022</strong> — It rained hard that day. After we docked, I was checking the cargo at the stern when a sharp pain went through my chest. I lost my footing and fell into the water.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1978年7月</strong> — 我出生在橘子岛的工人宿舍内，父亲是橘子工厂的工人。</p><p class='bio-entry'><strong>1996年</strong> — 我在码头上找到了一份工作，码头装卸工兼押货员。橘子岛每周二和周四早上都往大陆运货：橘子罐头、香水、标着危险标记的化工品、冷链运输的昂贵试剂。由于岛上和大陆的作息不一致，我每周一晚上九点会一直工作到周二晚上六点，周四晚上九点工作到周五晚上六点。</p><p class='bio-entry'><strong>2013年的一个深夜</strong> — 狂风大作。我在码头的防波堤下发现了一只瑟瑟发抖的小狗，大概是不小心随船从大陆到了岛上。我把它抱回了员工宿舍，它居然吃橘子，那么就叫橘子吧。从此，橘子每天跟我去码头上班；如果我送货去大陆，它就会在码头一直等我第二天回来，然后一起回家。</p><p class='bio-entry'><strong>2022年</strong> — 父母相继去世，他们不愿意安葬在橘子岛。九月，我把他们带回旧帆镇安葬。回到橘子岛，老板跟我说货物已经积压了十几天没有运了，要我尽快送货去大陆。我把货物搬上船，抱了抱橘子，就随船去了大陆。</p><p class='bio-entry'><strong>2022年9月22日</strong> — 那天雨下得特别大，到港后我在检查船尾的货物时，心脏一阵剧痛，站立不稳，跌落海中。</p>"
                },
                "ScientistFuranocoumarinM": {

                        "name_en": "Discoverer of Furanocoumarin",
                        "name_zh": "呋喃香豆素发现者",
                        "rel_en": "Discoverer of Furanocoumarin",
                        "rel_zh": "呋喃香豆素发现者",
                        "sum_en": "He found furanocoumarins, then spent seventy years trying to stop the world from misusing them.",
                        "sum_zh": "发现并提纯了呋喃香豆素，此后用七十年的时间试图阻止全世界滥用它。",
                        "bio_en": "<p class='bio-entry'><strong>September 1, 1922</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1942</strong> — I graduated from Plains University, the youngest graduate the chemistry department had, and stayed on to do research.</p><p class='bio-entry'><strong>1947</strong> — The high point of my life. I discovered furanocoumarins and invented a method to purify them, and for that I received the Fischer Prize for Chemical Discovery. I was the youngest recipient the prize ever had.</p><p class='bio-entry'><strong>1951</strong> — Orange Island was building an orange processing plant and brought me in as the expert to design the production line. I learned that the island's habit of sleeping by day and living by night came from \"the island's poisonous sun.\" But it was never the sun. It was furanocoumarins. The peel of the Moon-white Orange holds an enormous amount of them. On my advice, the factory added a line to produce furanocoumarins.</p><p class='bio-entry'>The production line was not hard to design, but I found a serious problem. The Island Mayor's daughter had congenital albinism, and some witch doctor from who-knows-where had claimed to be able to treat her — with the very compound I had discovered. I stopped that madness immediately and saved the girl's life. The Mayor's family treated me as a friend after that. They kept an office for me at the orange factory and gave me a house on the island.</p><p class='bio-entry'>That witch doctor made me realize furanocoumarins were already being misused. Back at Plains University, I turned my laboratory around and put everything into studying their harm to the human body. I submitted my results to every regulator and every association I could reach, trying to stop the misuse.</p><p class='bio-entry'>My warnings could not keep pace with how popular the compound was becoming. Within a dozen years of my discovery, furanocoumarins had spread into every field. Misuse in medicine was only the tip of it; the cosmetics industry was already buying them by the ton for tanning products.</p><p class='bio-entry'><strong>1960</strong> — Plains University took my laboratory back, because research into the harm furanocoumarins do makes no money at all. My funding had run dry five years earlier. All the university left me was a desk in a shared office and the small salary I earned by teaching.</p><p class='bio-entry'>Meanwhile the regulators and associations still would not ban the misuse. They only kept asking me for more evidence. I had lost my laboratory. I had no way to produce more evidence about the harm.</p><p class='bio-entry'>I remembered that I still had an office on Orange Island. I contacted the Island Mayor, and he agreed to let me use the furanocoumarin extraction equipment free of charge. In return, I took care of the orange factory's chemical problems.</p><p class='bio-entry'><strong>1961</strong> — I began travelling constantly between Orange Island and Plains City. The post office was the place I visited most. I kept mailing new evidence to the regulators, demanding a ban on the misuse of furanocoumarins.</p><p class='bio-entry'>The Mayor covered the laboratory and the materials, but there were plenty of other costs, and the fares back and forth were not small. A university teacher's salary came nowhere near covering it, so I sold off assets, one at a time, to fill the gap.</p><p class='bio-entry'><strong>1987</strong> — I retired. I sold the only home I had in Plains City and moved to Orange Island for good, to spend as little as possible.</p><p class='bio-entry'><strong>1990</strong> — After nearly forty years of arguing and travelling, the cosmetics associations in the major countries finally issued a warning about the toxicity of furanocoumarins.</p><p class='bio-entry'><strong>2014</strong> — Some countries began strictly limiting the use of furanocoumarins in medicines.</p><p class='bio-entry'><strong>2021</strong> — The global cosmetics industry formally restricted the ingredient.</p><p class='bio-entry'><strong>May 18, 2023</strong> — I died at the age of one hundred, still carrying my regret, because there are countries misusing it even now.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1922年9月1日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1942年</strong> — 我从平原大学毕业，是化学系最年轻的毕业生，我留在平原大学做研究。</p><p class='bio-entry'><strong>1947年</strong> — 我人生的高光时刻。我发现了呋喃香豆素，并发明了提纯方法，这一成就让我获得了“费舍尔化学发现奖”（Fischer Prize for Chemical Discovery），我是这个奖项最年轻的获奖者。</p><p class='bio-entry'><strong>1951年</strong> — 橘子岛筹建橘子加工厂，请我作为专家设计生产线。我了解到岛上昼伏夜出的作息源自“岛上毒辣的太阳”，而其实，是呋喃香豆素的问题！月白橘的果皮中含有巨量的呋喃香豆素！在我的建议下，橘子工厂增加了一个功能：生产呋喃香豆素。</p><p class='bio-entry'>生产线不难设计，但我发现了一个大问题：岛长的女儿患有先天性白化病，不知道从哪里来的巫医说可以治疗，而治疗的方案是用我发现的呋喃香豆素！我立刻阻止了这个疯狂的行为，救下那个小女孩一命。岛长一家把我当朋友，给我在橘子工厂留了一间办公室，还送给我一套岛上的住宅。</p><p class='bio-entry'>这个巫医的出现让我意识到呋喃香豆素在被滥用。回到平原大学后，我调整了实验室的研究方向，全力做呋喃香豆素的人体危害研究，我把研究成果提交到各个监管机构和协会，阻止呋喃香豆素的滥用。</p><p class='bio-entry'>而我的呼吁赶不上呋喃香豆素的风靡。从我发现呋喃香豆素后短短十几年时间，它已经迅速蔓延到了各个领域，医疗行业的滥用只是冰山一角，化妆品行业已经大量采购呋喃香豆素用于各类“美黑产品”。</p><p class='bio-entry'><strong>1960年</strong> — 我的实验室被平原大学收回了，因为我做的呋喃香豆素人体危害研究完全不赚钱，我的研究经费在五年前就已经见底。平原大学只留给我一张在公共办公间的桌子，以及仅仅靠教学生换来的微薄薪水。</p><p class='bio-entry'>而各个监管部门和协会迟迟不禁止呋喃香豆素的滥用，只是持续不断地问我要更多的证据。我已经失去了我的实验室，我没办法做更多的危害研究。</p><p class='bio-entry'>我想起来我在橘子岛还有一间办公室。我联系了岛长，他同意免费给我使用提取呋喃香豆素的设备。作为感谢，我负责解决橘子加工厂的化工问题。</p><p class='bio-entry'><strong>1961年</strong> — 我开始频繁地往返橘子岛和平原市，邮局是我去得最多的地方，我不断地寄新的证据给监管机构，要求禁止呋喃香豆素的滥用。</p><p class='bio-entry'>岛长支持了实验室和材料，但还有很多其他开销，我往返两岸的路费也不少。我当大学教员的工资远远不够，只能逐渐卖掉一些资产，补足资金上的缺口。</p><p class='bio-entry'><strong>1987年</strong> — 我退休了。我卖掉了在平原市的唯一住所，搬来橘子岛长住，尽量省钱。</p><p class='bio-entry'><strong>1990年</strong> — 经过我近四十年的艰难呼吁和奔走，主要几个国家的化妆品协会终于提出了“呋喃香豆素毒性”警告。</p><p class='bio-entry'><strong>2014年</strong> — 一些国家开始严格限定呋喃香豆素在药品中的使用。</p><p class='bio-entry'><strong>2021年</strong> — 全球化妆品行业正式限制了该成分的使用。</p><p class='bio-entry'><strong>2023年5月18日</strong> — 我以百岁高龄抱憾离世，因为还有几个国家在滥用呋喃香豆素。</p>"

                        "bio_en": "<p class='bio-entry'><strong>February 10, 1915</strong> — I was born in North Mountain City, where water was always short. I was fascinated by the reservoir outside town from the time I was small. At fifteen they took me on as a helper, and my master said I was the most gifted apprentice he had ever seen.</p><p class='bio-entry'><strong>1938</strong> — I found a job on Orange Island where I would be in charge of everything: building an irrigation system for the orchard. It took me two full years to lay the pipes, from the reservoir at the foot of the hill to the water tower at the top. That system is like the blood vessels of this hill, and it is the work I am proudest of.</p><p class='bio-entry'><strong>After 1945</strong> — My life settled into a rhythm. Every day I walked the hill road from end to end, checked the reservoir at the bottom and the tank at the top, looked at the soil, and decided whether to release water. In decades, not one tree died of thirst and not one tree drowned.</p><p class='bio-entry'><strong>1960</strong> — The island made living by night compulsory. That same year I brought fertigation to the orange grove, so every tree would be cared for a little better.</p><p class='bio-entry'><strong>Deep in the night of August 24, 1963</strong> — I slipped while checking the reservoir at the foot of the hill and fell in. I drowned. My workmates searched all of Orange Island and never found my body. It would never have occurred to them that an irrigation engineer could not swim. To be honest, I had forgotten it myself. For decades I had thought of water as a friend.</p>",

        let currentLang = 'en'; 
        let currentActiveChar = null;
        // 记录已经解开过的角色，用于给热区留下"已读"痕迹
        const solvedChars = new Set();

        // 获取 DOM 元素
        const treeContainer = document.getElementById('tree-container');
        const placeholder = document.getElementById('placeholder-text');
        const infoPanel = document.getElementById('info-panel');
        const portrait = document.getElementById('char-portrait');
        const relationBox = document.getElementById('char-relation');
        
        const selBp = document.getElementById('select-birthplace');
        const selBy = document.getElementById('select-birthyear');
        const selDy = document.getElementById('select-deathyear');
        const bioSection = document.getElementById('bio-section');
        const langButtons = document.querySelectorAll('.lang-btn');

        // 3. 动态计算精确像素并生成所有热区
        // 底图尺寸 850x400
        for (const [id, data] of Object.entries(charDatabase)) {
            const spot = document.createElement('div');
            spot.className = 'avatar-hotspot';
            spot.setAttribute('data-id', id);
            // 计算基于精确像素的百分比，适配不同屏幕
            spot.style.left = `${(data.x / 850) * 100}%`;
            spot.style.top = `${(data.y / 400) * 100}%`;
            
            spot.addEventListener('click', function() {
                // 处理选中状态的视觉反馈
                document.querySelectorAll('.avatar-hotspot').forEach(s => s.classList.remove('active-spot'));
                this.classList.add('active-spot');

                currentActiveChar = data;

                placeholder.style.display = 'none';
                infoPanel.style.display = 'flex';
                bioSection.style.display = 'none'; 

                // --- 2 倍无损放大与居中算法 ---
                // 因为目标是 100x100 容器 (中心在 50,50)，放大两倍后的实际像素坐标直接是 2 * 原坐标
                const bgPosX = 50 - (2 * data.x);
                const bgPosY = 50 - (2 * data.y);
                portrait.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;

                // 头像下面标注称谓（不剧透生卒年，那是谜题答案）
                relationBox.textContent = currentLang === 'en' ? data.rel_en : data.rel_zh;

                selBp.value = "";
                selBy.value = "";
                selDy.value = "";
            });
            treeContainer.appendChild(spot);
        }

        // 4. 提取唯一的出生年份和死亡年份用于生成下拉框
        const uniqueBirthYears = [...new Set(Object.values(charDatabase).map(c => c.by))].sort();
        const uniqueDeathYears = [...new Set(Object.values(charDatabase).map(c => c.dy))].sort();

        // 5. 渲染已解锁的生平
        function renderBio() {
            if (!currentActiveChar) return;
            const t = i18n[currentLang];
            const c = currentActiveChar;

            const name = currentLang === 'en' ? c.name_en : c.name_zh;
            const rel = currentLang === 'en' ? c.rel_en : c.rel_zh;
            const summary = currentLang === 'en' ? c.sum_en : c.sum_zh;
            const body = currentLang === 'en' ? c.bio_en : c.bio_zh;

            bioSection.innerHTML =
                `<span class="bio-unlock-label">${t.unlockLabel}</span>` +
                `<span class="bio-name">${name}</span>` +
                `<span class="bio-meta">${rel} · ${t.lifespan(c.by, c.dy)}</span>` +
                `<div class="bio-summary">${summary}</div>` +
                body;
            bioSection.style.display = 'block';
            bioSection.scrollTop = 0;
        }

        // 6. 语言切换核心逻辑
        function applyLanguage(lang) {
            currentLang = lang;
            const textData = i18n[lang];

            // 更新静态文本
            placeholder.innerHTML = textData.prompt;
            document.getElementById('ui-puzzle-title').textContent = textData.puzzleTitle;
            document.getElementById('ui-label-birthplace').textContent = textData.bpLabel;
            document.getElementById('ui-label-birthyear').textContent = textData.byLabel;
            document.getElementById('ui-label-deathyear').textContent = textData.dyLabel;

            // 记录当前的 value 以防重置
            const currBp = selBp.value;
            const currBy = selBy.value;
            const currDy = selDy.value;

            // 重新生成地点选项
            selBp.innerHTML = `<option value="">${textData.selectDefault}</option>
                               <option value="orange_island">${textData.places["orange_island"]}</option>
                               <option value="outside">${textData.places["outside"]}</option>`;
            
            // 生成年份选项
            selBy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueBirthYears.map(y => `<option value="${y}">${y}</option>`).join('');
            
            selDy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueDeathYears.map(y => `<option value="${y}">${y}</option>`).join('');

            // 恢复玩家的选项
            selBp.value = currBp;
            selBy.value = currBy;
            selDy.value = currDy;

            // 头像下的称谓也要跟着换语言
            if (currentActiveChar) {
                relationBox.textContent = lang === 'en' ? currentActiveChar.rel_en : currentActiveChar.rel_zh;
            }

            // 如果当前已经解锁了生平，立刻刷新其语言
            if (currentActiveChar && bioSection.style.display === 'block') {
                renderBio();
            }
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                langButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                applyLanguage(this.getAttribute('data-lang'));
            });
        });

        // 7. 解谜校验逻辑
        function checkPuzzle() {
            if(!currentActiveChar) return;

            const bpMatch = selBp.value === currentActiveChar.bp;
            const byMatch = selBy.value === currentActiveChar.by;
            const dyMatch = selDy.value === currentActiveChar.dy;

            if(bpMatch && byMatch && dyMatch) {
                renderBio();
                // 给对应热区留下"已解锁"标记
                const spot = document.querySelector('.avatar-hotspot.active-spot');
                if (spot) {
                    solvedChars.add(spot.getAttribute('data-id'));
                    spot.classList.add('solved-spot');
                }
            } else {
                bioSection.style.display = 'none';
            }
        }

        selBp.addEventListener('change', checkPuzzle);
        selBy.addEventListener('change', checkPuzzle);
        selDy.addEventListener('change', checkPuzzle);

        // 初始化
        applyLanguage('en');

    </script>
