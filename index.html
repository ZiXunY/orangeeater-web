<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Orange Island</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================
           Header (Logo & Language)
           ========================= */
        #site-header {
            width: 100%;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
        }

        .header-content {
            width: 850px; 
            padding: 20px 0;
            display: flex;
        }

        /* 左侧 2/3 放 Logo */
        .header-left {
            width: 66.66%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .site-logo {
            max-height: 50px;
            width: auto;
            font-style: italic; 
            color: #444;
        }

        /* 右侧 1/3 放语言切换 */
        .header-right {
            width: 33.33%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .lang-btn:hover {
            color: #aaa;
        }

        .lang-btn.active {
            color: #d35400;
            font-weight: bold;
            border-bottom: 2px solid #d35400;
        }

        /* =========================
           Family Tree (上半部分)
           ========================= */
        #family-tree {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .family-tree-image {
            display: block;
            width: 850px;
            height: 400px;
        }

        /* 隐形点击热区 */
        .avatar-hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent; 
            border: 2px solid transparent;
        }

        .avatar-hotspot:hover, .avatar-hotspot.active-spot {
            border: 2px solid #d35400;
            background: rgba(211, 84, 0, 0.3);
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 10px #d35400;
            z-index: 10;
        }

        /* =========================
           Character Information (下半部分)
           ========================= */
        #character-info {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            border-top: 1px solid #333;
            padding: 30px 20px;
            transition: all 0.3s ease;
        }

        .character-info-placeholder {
            color: #666;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        #info-panel {
            display: none; 
            width: 100%;
            max-width: 850px;
            flex-direction: row;
            gap: 40px;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        #char-portrait {
            width: 100px;  
            height: 100px;
            border-radius: 50%;
            background-image: url('images/family-tree/family-tree.png');
            background-size: 1700px 800px; 
            background-repeat: no-repeat;
            border: 3px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .info-right {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .puzzle-title {
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 横向排列的下拉框区域 */
        .puzzle-section {
            display: flex;
            flex-direction: row; /* 横向排列 */
            gap: 20px;
            background: #151515;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .select-group {
            display: flex;
            flex-direction: column; /* 标签在输入框上方 */
            flex: 1; /* 平分空间 */
            gap: 8px;
        }

        .select-group label {
            color: #aaa;
            font-size: 13px;
        }

        select {
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        select:focus {
            border-color: #d35400;
        }

        #bio-section {
            display: none; 
            background: rgba(211, 84, 0, 0.1);
            padding: 20px;
            border-left: 4px solid #d35400;
            border-radius: 4px;
            color: #ddd;
            line-height: 1.8;
            font-size: 15px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================
           Footer
           ========================= */
        footer {
            width: 100%;
            padding: 40px 20px;
            background: #050505;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            color: #666;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-links a:hover {
            color: #ff7b25;
            text-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
        }

        .footer-copyright {
            font-size: 12px;
            color: #444;
        }
    </style>
</head>

<body>

    <!-- =========================
         Header (Logo & Lang)
         ========================= -->
    <header id="site-header">
        <div class="header-content">
            <div class="header-left">
                <img src="images/logo.png" alt="Whispers of Orange Island" class="site-logo">
            </div>
            <div class="header-right">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </header>

    <!-- =========================
         上半部分：家族树
         ========================= -->
    <section id="family-tree">
        <div id="tree-container" style="position: relative; width: 850px; height: 400px;">
            <img src="images/family-tree/family-tree.png" alt="Family Tree" class="family-tree-image">
            <!-- 热区会由 JavaScript 自动基于精确像素计算并生成在此处 -->
        </div>
    </section>

    <!-- =========================
         下半部分：解谜与生平信息
         ========================= -->
    <section id="character-info">
        
        <div class="character-info-placeholder" id="placeholder-text">
            Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.
        </div>

        <div id="info-panel">
            <div class="info-left">
                <div id="char-portrait"></div>
            </div>

            <div class="info-right">
                <div class="puzzle-title" id="ui-puzzle-title">Complete the character's profile to unlock their biography:</div>
                
                <div class="puzzle-section">
                    <div class="select-group">
                        <label id="ui-label-birthplace">Birth Place:</label>
                        <select id="select-birthplace">
                            <!-- 选项由 JS 生成 -->
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-birthyear">Birth Year:</label>
                        <select id="select-birthyear">
                            <!-- 选项自动生成 -->
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-deathyear">Death Year:</label>
                        <select id="select-deathyear">
                            <!-- 选项自动生成 -->
                        </select>
                    </div>
                </div>

                <div id="bio-section"></div>
            </div>
        </div>
    </section>

    <!-- =========================
         Footer
         ========================= -->
    <footer>
        <div class="footer-links">
            <a href="https://store.steampowered.com/app/5165730" target="_blank">Steam</a>
            <a href="https://discord.gg/GMvHrNVfru" target="_blank">Discord</a>
            <a href="mailto:contact@orangeeater.com">contact@orangeeater.com</a>
        </div>
        <div class="footer-copyright">
            © 2026 ZiXunY. All rights reserved.
        </div>
    </footer>

    <!-- =========================
         核心交互与双语逻辑
         ========================= -->
    <script>
        // 1. 语言字典库
        const i18n = {
            en: {
                prompt: "Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.",
                puzzleTitle: "Complete the character's profile to unlock their biography:",
                bpLabel: "Birth Place:",
                byLabel: "Birth Year:",
                dyLabel: "Death Year:",
                selectDefault: "-- Select --",
                places: { "orange_island": "Orange Island", "outside": "Outside Island" },
                bioPrefix: "<strong>Unlocked Memory:</strong><br><br>"

            zh: {

                puzzleTitle: "请补全该角色的档案线索，以解锁生平记忆：",
                bpLabel: "出生地 (Birth Place):",
                byLabel: "出生年份 (Birth Year):",
                dyLabel: "死亡年份 (Death Year):",
                selectDefault: "-- 选择 --",
                places: { "orange_island": "橘子岛", "outside": "岛外" },
                bioPrefix: "<strong>解锁生平：</strong><br><br>"
            }
        };

        // 2. 游戏数据库 (含 34 个角色精确像素坐标和生平)
        const charDatabase = {
            "Player": { x: 200.5, y: 350, bp: "orange_island", by: "2022", dy: "2026", 
                bio_en: "The protagonist. Comatose due to family illness and environmental pollution, her soul left her body. Her final mission is to donate her corneas to her blind father and return the island to nature.", 
                bio_zh: "第四代，主角。因家族遗传病和环境污染陷入昏迷，灵魂离体。最终使命是捐献角膜给失明的父亲，让小岛重归自然。" },
            "Guide": { x: 138.5, y: 277, bp: "orange_island", by: "1993", dy: "2022", 
                bio_en: "Mother of the Player. Passed away giving birth. Her soul lingered to become a Guide, leading her daughter through the island's haunting history.", 
                bio_zh: "主角母亲 Bi1。因难产去世，灵魂化为引导者（Guide），指引女儿走完这趟探寻家族历史的旅程。" },
            "a": { x: 138.5, y: 46, bp: "outside", by: "1899", dy: "1956", 
                bio_en: "First generation islander and fisherman. Named the island and discovered the medicinal value of the Sea-Thorn.", 
                bio_zh: "第一代岛民、渔民。为橘子岛命名，并发现了海棘果的药用价值。" },
            "B": { x: 188.5, y: 47, bp: "outside", by: "1901", dy: "1956", 
                bio_en: "Wife of 'a'. One of the earliest settlers who braved the untamed seas.", 
                bio_zh: "a 的妻子，与丈夫一同在荒芜时期建立起渔业生活的初代岛民。" },
            "c": { x: 239.5, y: 43, bp: "outside", by: "1898", dy: "1960", 
                bio_en: "Second batch of settlers. Introduced the Royal Sour Orange and grafted it to create the iconic 'Moon-white Orange'.", 
                bio_zh: "第二批上岛者。引入皇家酸橙并意外嫁接出“月白橙”，奠定了全岛的橙子产业基础。" },
            "D": { x: 289.5, y: 50, bp: "outside", by: "1902", dy: "1963", 
                bio_en: "Wife of 'c'. Co-founder of the island's earliest agricultural prosperity.", 
                bio_zh: "c 的妻子，共同开创了橘子岛早期的农业繁荣时代。" },
            "Ba1": { x: 188.5, y: 104, bp: "orange_island", by: "1924", dy: "1944", 
                bio_en: "Daughter of a and B, first wife of cD. Died giving birth to the albino daughter Bc, causing the first rift between the two founding families.", 
                bio_zh: "a 与 B 之女，cD 第一任妻子。生下患白化病的女儿 Bc 时难产去世，导致两大家族决裂。" },
            "cD": { x: 264.5, y: 105, bp: "outside", by: "1924", dy: "1985", 
                bio_en: "The second Island Chief. Established the 'nocturnal society' and Holy Water Ritual to protect his albino daughter, inadvertently creating a dystopian cage.", 
                bio_zh: "第二任岛主。为保护患白化病的女儿建立“夜间社会”规则和“圣水仪式”，初衷是父爱，却造就后来的反乌托邦牢笼。" },
            "Ba2": { x: 138.5, y: 104, bp: "orange_island", by: "1924", dy: "1995", 
                bio_en: "Twin sister of Ba1. A gentle lighthouse watcher who gave up her university dreams to stay and protect her niece Bc.", 
                bio_zh: "Ba1 的双胞胎妹妹。性格温和的灯塔守望者，为信守照顾侄女 Bc 的承诺，撕毁了大学录取通知书永远留在岛上。" },
            "f": { x: 88.5, y: 112, bp: "outside", by: "1926", dy: "1980", 
                bio_en: "Husband of Ba2. A silent, kind fisherman representing the island's pure old days. Passed away in a shipwreck.", 
                bio_zh: "Ba2 的丈夫。沉默善良的渔民，代表岛上淳朴旧时光，最终死于海难。" },
            "E": { x: 313.5, y: 115, bp: "outside", by: "1928", dy: "2020", 
                bio_en: "The Perfume Queen and cD's second wife. Pushed the island towards industrialization. Resented the islanders and died seeking to erase her ties to the island.", 
                bio_zh: "cD 的第二任妻子，香水女王。工业化幕后推手，一生看不起岛民，死后灵魂化作执念试图烧毁自己的肖像。" },
            "g": { x: 63.5, y: 148, bp: "outside", by: "1940", dy: "1998", 
                bio_en: "A war photographer who sought peace on the island in 1968. Recorded the island's dark history through his lens before his suspicious death.", 
                bio_zh: "战地摄影师，因厌战上岛。用照片和“月光显影术”记录了岛屿被遗忘的历史，死因可疑。" },
            "Bc": { x: 213.5, y: 153, bp: "orange_island", by: "1944", dy: "1980", 
                bio_en: "Born with albinism. The 'first curse' of the families' marriage. Her illness indirectly caused the dark era of the nocturnal society.", 
                bio_zh: "先天性白化病患者。虽受尽溺爱却一直觉得自己不幸，她的病情促使了“昼伏夜出”习俗的形成。" },
            "Bf": { x: 113.5, y: 167, bp: "orange_island", by: "1949", dy: "2025", 
                bio_en: "Daughter of Ba2 and f. A resilient woman who acts as a bridge between generations. Provided the Player with the protective 'Block'.", 
                bio_zh: "Ba2 与 f 的女儿。坚韧的斗士，连接两代人的桥梁，教会了主角如何利用掩体（Block）保护自己。" },
            "cE": { x: 288.5, y: 185, bp: "orange_island", by: "1955", dy: "2026", 
                bio_en: "The third Island Chief and factory boss. An elitist who maintained oppressive rule. Died in the 2026 massive explosion and became a lingering boss spirit.", 
                bio_zh: "第三任岛长。精英主义者，建立鲎工厂残酷抽血维持高压统治。死于2026大爆炸，死后化为执念继续向水塔投毒。" },
            "i": { x: 138.5, y: 210, bp: "outside", by: "1965", dy: "2017", 
                bio_en: "A marine biologist with a strong sense of justice. Assassinated and disguised as an accident after discovering the cruel truth of the HorseCrab factory.", 
                bio_zh: "热爱大海、充满正义感的海洋学家。发现了鲎工厂虐杀鲎的真相后，被暗杀并伪装成意外。" },
            "ProudGrandpaM": { x: 338.5, y: 198, bp: "outside", by: "1960", dy: "2023", 
                bio_en: "A hardworking grandpa who took pride in the factory. Wished to deliver a custom pen to his granddaughter for getting into college.", 
                bio_zh: "在岛上奋斗一辈子的外公。坚信工厂带来了好日子，遗愿是把定制钢笔送给考上大学的孙女。" },
            "GroceryFounderF": { x: 813.5, y: 227, bp: "outside", by: "1973", dy: "2025", 
                bio_en: "The founder of the grocery store. Kept a secret ledger of islanders' debts, wishing to show her strict son the true meaning of community support.", 
                bio_zh: "杂货店创始人老太太。见证了岛民的窘迫，遗愿是让立下“概不赊账”规矩的儿子体会岛民彼此的情谊。" },
            "HotelFounderM": { x: 464.5, y: 135, bp: "outside", by: "1935", dy: "2010", 
                bio_en: "Founder of the hotel. Regretted his strict 'eldest son must not leave' rule and wished to encourage his grandson to pursue architectural dreams off-island.", 
                bio_zh: "旅馆创始人。建起岛上最高的三层楼，死后决定亲手砸碎“长子不得离岛”的家训，鼓励孙子去外面的世界。" },
            "LibraryFounderM": { x: 775.5, y: 177, bp: "outside", by: "1958", dy: "2025", 
                bio_en: "The old bookstore librarian. Maintained traditional reading rules to break echo chambers, warning against cold classification algorithms.", 
                bio_zh: "书店老馆长。坚守传统的借阅规矩，试图用书籍打破信息茧房，警告新管理员不要被冰冷的算法控制。" },
            "MrMailMoneyM": { x: 663.5, y: 200, bp: "outside", by: "1961", dy: "2026",

                bio_zh: "底层异乡劳工。忍受违背生理节律的“强制黑夜”，遗愿是把藏了一辈子的“梦想基金”存折寄给家人。" },
            "PowerStationMomofEngineerF": { x: 713.5, y: 178, bp: "outside", by: "1953", dy: "2015", 
                bio_en: "Mother of the power station engineer. Lingered to watch her son's colleagues celebrate his birthday.", 
                bio_zh: "电站工程师的母亲。灵魂久久未散，只为默默看着同事们给仍在世的儿子庆祝生日。" },
            "OrchardSoldierM": { x: 539.5, y: 90, bp: "outside", by: "1918", dy: "2008", 
                bio_en: "A WWII veteran who found peace in the island's night shifts in 1945. Returned to encourage his depressed great-grandson to survive this harsh era.", 
                bio_zh: "饱受二战创伤折磨的老兵。在橘子岛的黑夜中找到了救赎，跨越时空鼓舞深陷教育贷款绝望中的曾孙。" },
            "BartenderM": { x: 454.5, y: 260, bp: "outside", by: "1985", dy: "2023", 
                bio_en: "A passionate bartender suffering from XP disease (sunlight allergy). Wished his healthy wife would leave the dark island and embrace the sun again.", 
                bio_zh: "患有着色性干皮病的调酒师。用死亡为健康的妻子松绑，鼓励她重新拥抱白昼、离开这座避光的岛。" },
            "OldTeacherF": { x: 613.5, y: 167, bp: "outside", by: "1950", dy: "2024",

            "FounderGrandmaF": { x: 738.5, y: 107, bp: "outside", by: "1925", dy: "2015",

            "ClinicAngelDaughterF": { x: 613.5, y: 307, bp: "outside", by: "2005", dy: "2015",

            "OrangeChiefAngelFather": { x: 588.5, y: 234, bp: "outside", by: "1976", dy: "2026",

            "LikeVampireM": { x: 425.5, y: 212, bp: "outside", by: "1966", dy: "2026", 
                bio_en: "A porphyria patient who feared sunlight like a vampire. Desired to hand his hidden will to his lawyer.", 
                bio_zh: "患卟啉症、极度畏光的岛民（像吸血鬼）。遗愿是把遗嘱拿出来交给自己的律师。" },
            "ExPoliceChiefM": { x: 562.5, y: 193, bp: "outside", by: "1958", dy: "2026", 
                bio_en: "The old police chief who hid evidence of murder to protect the island's economy. Handed the crucial evidence to his successor to finally deliver justice.", 
                bio_zh: "老治安官。当年为保住岛屿资金链隐瞒了命案真相，遗愿是交出致命证物，完成迟来的正义接力。" },
            "OrchardGardenerM": { x: 688.5, y: 57, bp: "outside", by: "1905", dy: "1982", 
                bio_en: "A reformed thief who became a master grafter. His journey through the orchard reconciles his past shame and honors.", 
                bio_zh: "曾入狱的青年园艺师。在岛上通过大规模嫁接“月白橙”找回尊严，最终与世俗的荣辱彻底和解。" },
            "PierDogOwnerM": { x: 688.5, y: 243, bp: "outside", by: "1978", dy: "2022", 
                bio_en: "A pier worker whose only regret was losing his beloved dog. The player brings the Yarnball to reunite them.", 
                bio_zh: "码头工人。唯一的遗愿是找到自己死去的狗狗灵魂。" },
            "ScientistFuranocoumarinM": { x: 613.5, y: 103, bp: "outside", by: "1922", dy: "2023", 
                bio_en: "The chemist who discovered and purified Furanocoumarin. Devoted his life to exposing its toxicity, returning to report the island's abuse of it.", 
                bio_zh: "发现并提纯呋喃香豆素的化学家。一生在学术界呼吁其毒性，死后致力于举报橘子岛对其的滥用。" },
            "OrchardIrrigatorM": { x: 438.5, y: 84, bp: "outside", by: "1915", dy: "1963", 
                bio_en: "The island's first trapped soul. Built the irrigation system and drowned accidentally. Just wanted to walk the water channels one last time.", 
                bio_zh: "搭建了最早灌溉系统的工程师。意外淹死成为岛上“第一个灵魂”，只愿再看一眼自己照料的水渠并与尸骨告别。" }
        };

        let currentLang = 'en'; 
        let currentActiveChar = null;

        // 获取 DOM 元素
        const treeContainer = document.getElementById('tree-container');
        const placeholder = document.getElementById('placeholder-text');
        const infoPanel = document.getElementById('info-panel');
        const portrait = document.getElementById('char-portrait');
        
        const selBp = document.getElementById('select-birthplace');
        const selBy = document.getElementById('select-birthyear');
        const selDy = document.getElementById('select-deathyear');
        const bioSection = document.getElementById('bio-section');
        const langButtons = document.querySelectorAll('.lang-btn');

        // 3. 动态计算精确像素并生成所有热区
        // 底图尺寸 850x400
        for (const [id, data] of Object.entries(charDatabase)) {
            const spot = document.createElement('div');
            spot.className = 'avatar-hotspot';
            spot.setAttribute('data-id', id);
            // 计算基于精确像素的百分比，适配不同屏幕
            spot.style.left = `${(data.x / 850) * 100}%`;
            spot.style.top = `${(data.y / 400) * 100}%`;
            
            spot.addEventListener('click', function() {
                // 处理选中状态的视觉反馈
                document.querySelectorAll('.avatar-hotspot').forEach(s => s.classList.remove('active-spot'));
                this.classList.add('active-spot');

                currentActiveChar = data;

                placeholder.style.display = 'none';
                infoPanel.style.display = 'flex';
                bioSection.style.display = 'none'; 

                // --- 2 倍无损放大与居中算法 ---
                // 因为目标是 100x100 容器 (中心在 50,50)，放大两倍后的实际像素坐标直接是 2 * 原坐标
                const bgPosX = 50 - (2 * data.x);
                const bgPosY = 50 - (2 * data.y);
                portrait.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;

                selBp.value = "";
                selBy.value = "";
                selDy.value = "";
            });
            treeContainer.appendChild(spot);
        }

        // 4. 提取唯一的出生年份和死亡年份用于生成下拉框
        const uniqueBirthYears = [...new Set(Object.values(charDatabase).map(c => c.by))].sort();
        const uniqueDeathYears = [...new Set(Object.values(charDatabase).map(c => c.dy))].sort();

        // 5. 语言切换核心逻辑
        function applyLanguage(lang) {
            currentLang = lang;
            const textData = i18n[lang];

            // 更新静态文本
            placeholder.innerHTML = textData.prompt;
            document.getElementById('ui-puzzle-title').textContent = textData.puzzleTitle;
            document.getElementById('ui-label-birthplace').textContent = textData.bpLabel;
            document.getElementById('ui-label-birthyear').textContent = textData.byLabel;
            document.getElementById('ui-label-deathyear').textContent = textData.dyLabel;

            // 记录当前的 value 以防重置
            const currBp = selBp.value;
            const currBy = selBy.value;
            const currDy = selDy.value;

            // 重新生成地点选项
            selBp.innerHTML = `<option value="">${textData.selectDefault}</option>
                               <option value="orange_island">${textData.places["orange_island"]}</option>
                               <option value="outside">${textData.places["outside"]}</option>`;
            
            // 生成年份选项
            selBy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueBirthYears.map(y => `<option value="${y}">${y}</option>`).join('');
            
            selDy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueDeathYears.map(y => `<option value="${y}">${y}</option>`).join('');

            // 恢复玩家的选项
            selBp.value = currBp;
            selBy.value = currBy;
            selDy.value = currDy;

            // 如果当前已经解锁了生平，立刻刷新其语言
            if (currentActiveChar && bioSection.style.display === 'block') {
                const bioText = lang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = textData.bioPrefix + bioText;
            }
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                langButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                applyLanguage(this.getAttribute('data-lang'));
            });
        });

        // 6. 解谜校验逻辑
        function checkPuzzle() {
            if(!currentActiveChar) return;

            const bpMatch = selBp.value === currentActiveChar.bp;
            const byMatch = selBy.value === currentActiveChar.by;
            const dyMatch = selDy.value === currentActiveChar.dy;

            if(bpMatch && byMatch && dyMatch) {
                const bioText = currentLang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = i18n[currentLang].bioPrefix + bioText;
                bioSection.style.display = 'block';
            } else {
                bioSection.style.display = 'none';
            }
        }

        selBp.addEventListener('change', checkPuzzle);
        selBy.addEventListener('change', checkPuzzle);
        selDy.addEventListener('change', checkPuzzle);

        // 初始化
        applyLanguage('en');

    </script>
</body>
</html>
