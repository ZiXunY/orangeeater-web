<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Orange Island</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================
           Header (Logo & Language)
           ========================= */
        #site-header {
            width: 100%;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
        }

        .header-content {
            width: 850px; 
            padding: 20px 0;
            display: flex;
        }

        /* 左侧 2/3 放 Logo */
        .header-left {
            width: 66.66%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .site-logo {
            max-height: 50px;
            width: auto;
            font-style: italic; 
            color: #444;
        }

        /* 右侧 1/3 放语言切换 */
        .header-right {
            width: 33.33%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #f3eed5;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .lang-btn:hover {
            color: #aaa;
        }

        .lang-btn.active {
            color: #d35400;
            font-weight: bold;
            border-bottom: 2px solid #d35400;
        }

        /* =========================
           Family Tree (上半部分)
           ========================= */
        #family-tree {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .family-tree-image {
            display: block;
            width: 850px;
            height: 400px;
        }

        /* 隐形点击热区 */
        .avatar-hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent; 
            border: 2px solid transparent;
        }

        .avatar-hotspot:hover, .avatar-hotspot.active-spot {
            border: 2px solid #d35400;
            background: rgba(211, 84, 0, 0.3);
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 10px #d35400;
            z-index: 10;
        }

        /* 已解锁过生平的热区，留一点暗金色余晖 */
        .avatar-hotspot.solved-spot {
            border: 2px solid rgba(211, 84, 0, 0.45);
        }

        /* =========================
           Character Information (下半部分)
           ========================= */
        #character-info {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            border-top: 1px solid #333;
            padding: 30px 20px;
            transition: all 0.3s ease;
        }

        .character-info-placeholder {
            color: #666;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        #info-panel {
            display: none; 
            width: 100%;
            max-width: 850px;
            flex-direction: row;
            gap: 40px;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            gap: 12px;
        }

        #char-portrait {
            width: 100px;  
            height: 100px;
            border-radius: 50%;
            background-image: url('images/family-tree/family-tree.png');
            background-size: 1700px 800px; 
            background-repeat: no-repeat;
            border: 3px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        #char-relation {
            width: 120px;
            text-align: center;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        .info-right {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .puzzle-title {
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 横向排列的下拉框区域 */
        .puzzle-section {
            display: flex;
            flex-direction: row; /* 横向排列 */
            gap: 20px;
            background: #151515;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .select-group {
            display: flex;
            flex-direction: column; /* 标签在输入框上方 */
            flex: 1; /* 平分空间 */
            gap: 8px;
        }

        .select-group label {
            color: #aaa;
            font-size: 13px;
        }

        select {
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        select:focus {
            border-color: #d35400;
        }

        #bio-section {
            display: none; 
            background: rgba(211, 84, 0, 0.08);
            padding: 24px 26px;
            border-left: 4px solid #d35400;
            border-radius: 4px;
            color: #ddd;
            line-height: 1.85;
            font-size: 15px;
            animation: fadeIn 0.8s ease forwards;
            max-height: 460px;
            overflow-y: auto;
        }

        /* 生平区滚动条，配合暗色主题 */
        #bio-section::-webkit-scrollbar { width: 8px; }
        #bio-section::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        #bio-section::-webkit-scrollbar-thumb { background: #4a2a12; border-radius: 4px; }
        #bio-section::-webkit-scrollbar-thumb:hover { background: #d35400; }

        .bio-unlock-label {
            display: block;
            color: #d35400;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .bio-name {
            display: block;
            color: #f0f0f0;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .bio-meta {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .bio-summary {
            color: #c9c9c9;
            font-style: italic;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(211, 84, 0, 0.25);
        }

        .bio-entry {
            margin: 0 0 12px 0;
        }

        .bio-entry:last-child {
            margin-bottom: 0;
        }

        .bio-entry strong {
            color: #e8944e;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================
           Footer
           ========================= */
        footer {
            width: 100%;
            padding: 40px 20px;
            background: #050505;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            color: #666;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-links a:hover {
            color: #ff7b25;
            text-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
        }

        .footer-copyright {
            font-size: 12px;
            color: #444;
        }
    </style>
</head>

        // 2. 游戏数据库（34 个角色：精确像素坐标 + 解谜答案 + 双语生平）

                        "by": "2022",
                        "dy": "2026",
                        "name_en": "The Player",
                        "name_zh": "主角",
                        "rel_en": "The Player",
                        "rel_zh": "玩家本人",
                        "sum_en": "Born on Orange Island, she lost her mother the day she was born. In 2026 she fell ill and her soul slipped loose.",
                        "sum_zh": "出生在橘子岛，出生当天失去母亲。2026 年突发疾病昏迷，灵魂离体，踏上拯救先祖灵魂的旅程。",
                        "bio_en": "<p class='bio-entry'><strong>May 10, 2022</strong> — I was born on Orange Island. My father is the island's police officer and firefighter. My mother died giving birth to me.</p><p class='bio-entry'>The places I know best are my house, my grandmother's house, the Safety Center where my father works, and the school — though I only got one year of it.</p><p class='bio-entry'><strong>May 17, 2026</strong> — I fell suddenly ill, lost consciousness, and was taken to the hospital.</p><p class='bio-entry'><strong>June 14, 2026</strong> — My heart stopped. I was buried beside my mother.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>2022年5月10日</strong> — 我出生在橘子岛。我的父亲是岛上的警察兼消防员，母亲在生我的时候难产去世了。</p><p class='bio-entry'>岛上我最熟悉的地方是我的家、外婆家、爸爸的工作单位综合中心，还有学校——虽然我只上了一年学。</p><p class='bio-entry'><strong>2026年5月17日</strong> — 我突发疾病昏迷，被送进了医院。</p><p class='bio-entry'><strong>2026年6月14日</strong> — 我的心脏停止了跳动。我被葬在妈妈的墓旁。</p>"
                },
                "Guide": {
                        "x": 137.5,
                        "y": 277,
                        "bp": "orange_island",

                        "dy": "2022",
                        "name_en": "Mother",
                        "name_zh": "母亲",
                        "rel_en": "Mother",
                        "rel_zh": "母亲",
                        "sum_en": "Daughter of the marine scientist. She married the Island Mayor's son and died giving birth to the Player.",
                        "sum_zh": "海洋学家的女儿，与岛长的儿子结婚。生下主角当天难产去世。",
                        "bio_en": "<p class='bio-entry'><strong>Christmas Eve, December 24, 1993</strong> — My twin sister and I were born on Orange Island. Our father was a marine scientist; our mother was born on the island. Father worked nights and slept days; Mother worked days and slept nights; I slept at night and played on the beach all day. Dawn and dusk were the hours our father taught us at home.</p><p class='bio-entry'>As a child I had a secret playmate: the Island Mayor's son. We could both tell from the way the grown-ups talked that our friendship would never be approved of, but nobody would tell us what had actually happened, and neither of us dared to ask. He left Orange Island in 2008. I did not know if he would ever come back.</p><p class='bio-entry'><strong>2017</strong> — My father was murdered and it was staged as a drowning. My mother, my sister and I were frightened, but we believed Orange Island would protect us, so we stayed. We buried him in the cemetery.</p><p class='bio-entry'><strong>2018</strong> — My secret playmate came back. <strong>2021</strong> — We were married.</p><p class='bio-entry'><strong>May 10, 2022</strong> — I gave birth to our daughter. I died in childbirth the same day.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1993年12月24日的圣诞前夜</strong> — 我和双胞胎妹妹出生在橘子岛。我的父亲是一名海洋学家，母亲是岛上出生的居民。爸爸晚上工作白天睡觉，妈妈白天工作晚上睡觉，我晚上睡觉、白天在沙滩玩，而凌晨和傍晚，是爸爸在家给我们上课的时间。</p><p class='bio-entry'>童年的我有一个秘密的玩伴，是岛长的儿子。我们都从大人的对话中感受到，我们的友谊不会被家长赞同，但是没人告诉我们究竟发生过什么，我们也都不敢问。他2008年离开了橘子岛，我不知道他会不会再回来。</p><p class='bio-entry'><strong>2017年</strong> — 父亲被害，现场被伪装成溺水。我和母亲、妹妹很害怕，但是相信橘子岛会保护我们，所以我们留在了岛上，把父亲葬在了墓园。</p><p class='bio-entry'><strong>2018年</strong> — 我的秘密玩伴回来了。<strong>2021年</strong>，我们结了婚。</p><p class='bio-entry'><strong>2022年5月10日</strong> — 我生下了我们的女儿。同一天，我因为难产去世了。</p>"
                },
                "a": {
                        "x": 137.5,
                        "y": 46,
                        "bp": "outside",
                        "by": "1899",
                        "dy": "1956",
                        "name_en": "Husband in The First Settler Couple",
                        "name_zh": "第一对岛民夫妇中的丈夫",
                        "rel_en": "Great-Great-Great-Grandfather",
                        "rel_zh": "曾曾曾外公",
                        "sum_en": "The island's first settler and fisherman. He named the place Fish Island.",
                        "sum_zh": "岛上第一家居民中的丈夫，以捕鱼为生，把这座无人小岛命名为“渔岛”。",
                        "bio_en": "<p class='bio-entry'><strong>March 15, 1899</strong> — I was born in Old Sail Town.</p><p class='bio-entry'><strong>1920s</strong> — The fishing around Old Sail Town was dying, so my wife and I went looking for a new living. We ended up on an empty island about sixty kilometers southeast of the mainland. We were the first people to live there. I named it Fish Island. On the slope on the north side grew a whole forest of wild Sea-Thorn. The fruit was sour and rough on the tongue, but my wife learned to dry it into something faintly sweet. We took it with us on the boat, and we never got scurvy again.</p><p class='bio-entry'><strong>September 20, 1924</strong> — My wife gave birth to twin girls on Fish Island.</p><p class='bio-entry'><strong>1927</strong> — A second family moved to the island with a three-year-old son. We helped them build a small house on the north side, and my wife taught them how to dry Sea-Thorn.</p><p class='bio-entry'><strong>1932</strong> — Our neighbors grew an orange that was huge and sweet. They called it the Moon-white Orange. They traded oranges for our fish, and my wife and I went over to help them graft the new branches onto the Sea-Thorn trees.</p><p class='bio-entry'><strong>Late 1930s</strong> — Their orange business kept growing and they hired a lot of outside hands. People started calling the place Orange Island. The two families felt less and less like the same kind of people, and we drifted apart.</p><p class='bio-entry'><strong>December 24, 1943</strong> — My older daughter married their son. We did not agree to it. I heard they did not agree either. The two of them married anyway. Only my younger daughter went to the wedding.</p><p class='bio-entry'><strong>August 27, 1944</strong> — My older daughter died in childbirth. It was the deepest grief of my life. I buried her at the northeast corner of the island. It was the first grave there.</p><p class='bio-entry'><strong>September 20, 1948</strong> — My younger daughter married a young man who had come from Old Sail Town for the picking season. He learned to fish from me, and he became a fisherman again.</p><p class='bio-entry'><strong>August 27, 1949</strong> — My granddaughter was born.</p><p class='bio-entry'><strong>November 2, 1956</strong> — I left this world. They buried me at the northeast corner, not far from my older daughter.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1899年3月15日</strong> — 我出生在旧帆镇。</p><p class='bio-entry'><strong>1920年代</strong> — 旧帆镇周围的鱼越来越少，为了寻找新的生计，我和妻子离开了那里，来到距离大陆东南六十公里的一座荒无人烟的小岛。我们是这里的第一代居民，我给这个岛命名为“渔岛”。岛上北面的山坡生长着大片野生海棘果，果实又酸又涩，但妻子学会了把它做成微甜的果干。我们出海时带着它，再也没得过坏血病。</p><p class='bio-entry'><strong>1924年9月20日</strong> — 我和妻子在渔岛生下了一对双胞胎女儿。</p><p class='bio-entry'><strong>1927年</strong> — 岛上搬来了第二户人家，他们带着一个三岁的儿子。我们在小岛北面帮他们盖起了一栋小屋，妻子也教他们怎么做海棘果干。</p><p class='bio-entry'><strong>1932年</strong> — 邻居家种出了巨大甘甜的月白橘。他们用橘子跟我们换海鲜，我和妻子也去帮他们把橘枝嫁接到海棘果树上。</p><p class='bio-entry'><strong>1930年代后期</strong> — 邻居家的月白橘生意越做越大，雇了很多人，渔岛也开始被外人叫作“橘子岛”。我们两家越来越感觉不是同一类人，关系逐渐疏远。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 我的大女儿和邻居家的儿子结了婚。我们不同意这门婚事，据说邻居家也不同意。两个孩子还是执意结了婚，婚礼只有小女儿去参加了。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 大女儿难产去世。我经历了人生中最深的悲痛。我把她葬在小岛的东北角，那是岛上的第一座墓。</p><p class='bio-entry'><strong>1948年9月20日</strong> — 我的小女儿嫁给了一个从旧帆镇来做季节工的年轻人。他跟着我学会了捕鱼，重新做起了渔民。</p><p class='bio-entry'><strong>1949年8月27日</strong> — 我的外孙女出生了。</p><p class='bio-entry'><strong>1956年11月2日</strong> — 我离开了这个世界。我被安葬在小岛东北角，大女儿的墓离我不远。</p>"
                },
                "B": {
                        "x": 187.5,

                        "sum_en": "Wife in the first settler couple. She worked out how to dry Sea-Thorn into food that kept scurvy away.",
                        "sum_zh": "岛上第一家居民中的妻子。摸索出把酸涩的海棘果做成果干的方法，成为渔民出海防坏血病的口粮。",
                        "bio_en": "<p class='bio-entry'><strong>June 22, 1901</strong> — I was born in Old Sail Town.</p><p class='bio-entry'><strong>1920s</strong> — My husband and I left Old Sail Town and settled on a small island out at sea. He named it Fish Island. Wild Sea-Thorn covered the slope on the north side. The fruit was sour and scratchy, but I kept experimenting until I could dry it, and that dried fruit became the food that kept scurvy off our boat.</p><p class='bio-entry'><strong>September 20, 1924</strong> — I gave birth to twin girls.</p><p class='bio-entry'><strong>1927</strong> — A new family arrived, three of them. We helped them build their house, and I taught the wife how to dry Sea-Thorn. Later, half by accident, they grew the sweet Moon-white Orange, and dried orange slowly replaced the dried Sea-Thorn we took to sea.</p><p class='bio-entry'>The two families used to be inseparable. We worked side by side and traded fish for oranges. Then their orange business grew, the island turned into Orange Island, and the grown-ups grew apart. There were a lot of hard feelings nobody could fully explain. But my two daughters and their son stayed the closest of friends.</p><p class='bio-entry'><strong>December 24, 1943</strong> — My older daughter married him at the lighthouse, against everything we said. I never stopped worrying about that marriage.</p><p class='bio-entry'><strong>August 27, 1944</strong> — She died in childbirth and left behind a granddaughter born with albinism. My husband and I were destroyed by it, and after that the two families stopped speaking altogether.</p><p class='bio-entry'><strong>1948</strong> — My younger daughter married a young man from Old Sail Town.</p><p class='bio-entry'><strong>1949</strong> — She gave birth to a healthy granddaughter.</p><p class='bio-entry'><strong>December 14, 1956</strong> — A little over a month after my husband died, I followed him. I was buried beside him and my older daughter.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1901年6月22日</strong> — 我出生在旧帆镇。</p><p class='bio-entry'><strong>1920年代</strong> — 我和丈夫离开了旧帆镇，来到海上的一座小岛定居。丈夫给它起名叫“渔岛”。岛上北面的山坡生长着大片野生海棘果，果实又酸又涩，我反复摸索，终于把那些酸涩的果子做成了海棘果干，它成了我们出海预防坏血病的重要食物。</p><p class='bio-entry'><strong>1924年9月20日</strong> — 我生下了一对可爱的双胞胎女儿。</p><p class='bio-entry'><strong>1927年</strong> — 岛上来了新邻居一家三口。我们帮他们盖了房子，我也教邻居家的妻子做海棘果干。后来，邻居家阴差阳错种出了甜美的月白橘，月白橘干慢慢取代了我们出海带的海棘果干。</p><p class='bio-entry'>我们两家人曾经亲密无间，经常一起劳作，用海鲜换橘子。随着邻居家橘子生意做大，小岛变成了“橘子岛”，大人们的关系渐渐远了，中间夹杂着很多说不清的恩怨。但我的两个女儿和邻居家的儿子一直是最亲密的朋友。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 大女儿不顾反对，执意和邻居家的儿子在灯塔结了婚。对这桩婚事，我心里始终有挥之不去的隐忧。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 大女儿难产去世，留下了一个患有先天性白化病的外孙女。这让我和丈夫悲痛欲绝，两家大人也彻底不来往了。</p><p class='bio-entry'><strong>1948年</strong> — 小女儿嫁给了一个从旧帆镇来的年轻人。</p><p class='bio-entry'><strong>1949年</strong> — 小女儿生下了健康的外孙女。</p><p class='bio-entry'><strong>1956年12月14日</strong> — 在丈夫去世一个多月后，我也随他而去了。我葬在了丈夫和大女儿的身边。</p>"
                },
                "c": {
                        "x": 238.5,
                        "y": 43,
                        "bp": "outside",
                        "by": "1898",
                        "dy": "1960",
                        "name_en": "The Orchard Founder",
                        "name_zh": "橘园奠基人",
                        "rel_en": "Great-Great-Grandfather",
                        "rel_zh": "曾曾爷爷",
                        "sum_en": "Second family to settle. He grafted a dying Royal Sour Orange onto Sea-Thorn and created the Moon-white Orange.",
                        "sum_zh": "岛上第二户居民。把奄奄一息的皇家酸橙嫁接到海棘果树桩上，意外得到月白橘，奠定全岛橘子产业。",
                        "bio_en": "<p class='bio-entry'><strong>November 1898</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1923</strong> — I married the neighbor's daughter, the girl I had known since we were children.</p><p class='bio-entry'><strong>April 10, 1924</strong> — Our son was born in Plains City.</p><p class='bio-entry'><strong>1927</strong> — My wife and I took our three-year-old son to Fish Island, sixty kilometers southeast of the mainland. A fisherman and his wife were already living there with twin daughters exactly my son's age. With their help we built a house at the western foot of the northeast slope.</p><p class='bio-entry'><strong>Winter 1927</strong> — An ornamental Royal Sour Orange I had brought from home could not take the island climate and was nearly dead. I grafted it onto a native Sea-Thorn stump in the yard.</p><p class='bio-entry'><strong>Spring 1928</strong> — The graft pushed out new shoots. Somehow it had lived.</p><p class='bio-entry'><strong>1932</strong> — A branch on that grafted tree threw a bud sport, and it grew oranges that were pale, enormous, sweet, and full of juice. We called them Moon-white Oranges. Over the next few years, with help from the fishing family and hired hands from off the island, my wife and I and our son grafted Moon-white Orange onto the Sea-Thorn across the whole slope. That was the beginning of the island's orange industry.</p><p class='bio-entry'><strong>Late 1930s</strong> — We had a huge harvest and shipped it to the mainland. People started calling the place Orange Island. Our business kept getting bigger, and our friendship with the fishing family kept getting smaller.</p><p class='bio-entry'><strong>1940s</strong> — As we hired more seasonal pickers, the workers kept complaining that the sun here burned their skin. To protect them, I moved the picking to night and let them sleep through the day.</p><p class='bio-entry'><strong>December 24, 1943</strong> — My son married the fisherman's older daughter. The two families were barely speaking by then, but they went ahead anyway.</p><p class='bio-entry'><strong>August 27, 1944</strong> — My son's wife died in childbirth and left behind a sick granddaughter. That was the end of any relationship between the two houses.</p><p class='bio-entry'><strong>1947</strong> — My granddaughter was diagnosed with severe congenital albinism. She could never be in the sun. To protect her, my son started building a nighttime playground in the yard, and I quietly backed him.</p><p class='bio-entry'><strong>1950</strong> — My son remarried, to the daughter of a family of doctors in Harbor City. She used her education and her connections to build us an orange processing plant.</p><p class='bio-entry'><strong>January 9, 1960</strong> — I died of old age. Near the end my wife asked if I wanted to go back to Plains City. I said no. I love this island. They buried me in the cemetery at the northeast corner.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1898年11月</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1923年</strong> — 我和青梅竹马的邻居家女儿结婚。</p><p class='bio-entry'><strong>1924年4月10日</strong> — 我们的儿子出生在平原市。</p><p class='bio-entry'><strong>1927年</strong> — 我和妻子带着三岁的儿子移居到距离大陆东南六十公里的渔岛。岛上已经有一对渔民夫妻，他们有一对双胞胎女儿，和我儿子同岁。在他们的帮助下，我们在小岛北面山坡的西边山脚下盖了房子。</p><p class='bio-entry'><strong>1927年冬天</strong> — 我从老家带来的一株观赏用的皇家酸橙无法适应小岛气候，奄奄一息。我试着把它嫁接到了院子里的原生海棘果树桩上。</p><p class='bio-entry'><strong>1928年春天</strong> — 嫁接枝长出了新芽，奇迹般地存活了。</p><p class='bio-entry'><strong>1932年</strong> — 院子里的嫁接橙枝发生了芽变，长出了苍白、巨大、甘甜、多汁的橘子，我们叫它月白橘。随后几年，在渔民一家的帮助和岛外招募的帮手下，我和妻子带着儿子把月白橘嫁接到了整片山坡的海棘果上，奠定了岛屿橘子产业的基础。</p><p class='bio-entry'><strong>1930年代后期</strong> — 月白橘大丰收，销售到了大陆，渔岛也被人叫成了“橘子岛”。我们的生意越做越大，但也和渔民一家的关系逐渐疏远了。</p><p class='bio-entry'><strong>1940年代</strong> — 随着雇佣的季节性采摘工人变多，工人们总是抱怨被毒辣的阳光晒伤皮肤。为了保护工人，我决定把采摘工作改到夜间进行，白天睡觉。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 儿子和渔民家的大女儿结了婚。虽然我们两家关系已经很差，但他们还是走到了一起。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 儿媳妇难产去世，留下了一个患病的孙女，两家也因此彻底决裂。</p><p class='bio-entry'><strong>1947年</strong> — 孙女被诊断为严重的先天性白化病，终生不能见阳光。儿子为了保护她，开始在院子里建夜间游乐园，我也默默支持着他。</p><p class='bio-entry'><strong>1950年</strong> — 儿子再婚，娶了海港城医生世家的女儿。儿媳妇用她的学识和人脉帮家里建了橘子加工厂。</p><p class='bio-entry'><strong>1960年1月9日</strong> — 我自然老去，离开了人世。临终前妻子问我想不想回到平原市，我说不，我热爱这座岛。我被安葬在了岛东北角的墓园里。</p>"
                },
                "D": {
                        "x": 288.5,

                        "sum_en": "She planted the slope with her husband and watched the family turn rich, and distant.",
                        "sum_zh": "和丈夫一起把月白橘种满山坡，也眼看着两家人因生意而生分。",
                        "bio_en": "<p class='bio-entry'><strong>February 14, 1902</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1923</strong> — I married the neighbor's son, the boy I had known since we were children.</p><p class='bio-entry'><strong>April 10, 1924</strong> — Our son was born in Plains City.</p><p class='bio-entry'><strong>1927</strong> — My husband and I took our son to Fish Island. The fishing family next door helped us build our house, and the fisherman's wife taught me how to dry Sea-Thorn.</p><p class='bio-entry'><strong>Winter 1927</strong> — My husband grafted a half-dead Royal Sour Orange onto a Sea-Thorn stump. To our surprise, it lived.</p><p class='bio-entry'><strong>1932</strong> — That tree gave us the most delicious oranges I had ever tasted. Our whole family started planting Moon-white Orange across the slope.</p><p class='bio-entry'>As the oranges sold, we became a family that even the mainland had heard of. We also became strangers to the fishing family who had helped us in the beginning.</p><p class='bio-entry'><strong>December 24, 1943</strong> — Our son married the fisherman's older daughter. Both families were against it, and something in me was uneasy too.</p><p class='bio-entry'><strong>August 27, 1944</strong> — She died in childbirth and left behind a granddaughter with albinism.</p><p class='bio-entry'><strong>1950</strong> — Our son married again, and the family business moved from selling oranges to running a factory.</p><p class='bio-entry'><strong>January 9, 1960</strong> — My husband died.</p><p class='bio-entry'><strong>April 20, 1963</strong> — I died. I was buried on Orange Island, right next to him.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1902年2月14日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1923年</strong> — 我和青梅竹马的邻居家儿子结婚。</p><p class='bio-entry'><strong>1924年4月10日</strong> — 我们的儿子在平原市出生。</p><p class='bio-entry'><strong>1927年</strong> — 我和丈夫带着儿子搬到了海上的渔岛。邻居渔民一家帮我们盖了房子，我还跟渔民家的妻子学会了做海棘果干。</p><p class='bio-entry'><strong>1927年冬天</strong> — 丈夫把一株快死的皇家酸橙嫁接到了海棘果树桩上，没想到它活了下来。</p><p class='bio-entry'><strong>1932年</strong> — 那棵树长出了无比美味的月白橘。我们全家开始把月白橘种满山坡。</p><p class='bio-entry'>随着橘子大卖，我们家成了在大陆都闻名的富豪，但也和曾经帮过我们的渔民一家生分了。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 儿子娶了渔民家的大女儿。双方的大人都反对这桩婚事，我心里也隐隐不安。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 儿媳难产去世，留下了患白化病的孙女。</p><p class='bio-entry'><strong>1950年</strong> — 儿子娶了第二任妻子，家里的生意也从卖橘子变成了开加工厂。</p><p class='bio-entry'><strong>1960年1月9日</strong> — 丈夫去世。</p><p class='bio-entry'><strong>1963年4月20日</strong> — 我去世。我葬在了橘子岛，和丈夫的墓挨在一起。</p>"
                },
                "Ba1": {

                        "bp": "orange_island",

                        "name_en": "The Lighthouse Bride",
                        "name_zh": "灯塔新娘",
                        "rel_en": "Great-Great-Grand-Aunt",
                        "rel_zh": "曾曾外姨婆",
                        "sum_en": "One of the first children born on the island. She had her wedding in the lighthouse and died giving birth to the daughter.",
                        "sum_zh": "岛上最早出生的孩子之一。不顾反对在灯塔与完婚，生下女儿时难产去世，两家自此决裂。",
                        "bio_en": "<p class='bio-entry'><strong>September 20, 1924</strong> — My twin sister and I were born on Fish Island, which later became Orange Island. Our parents were the island's first settlers.</p><p class='bio-entry'><strong>1927</strong> — A new family arrived with a little boy our age. All through our childhood, the three of us were each other's best friends, and we grew up happy here.</p><p class='bio-entry'><strong>1932</strong> — The tree in their yard grew the delicious Moon-white Orange. Our families worked together all the time, and we traded fish for fruit.</p><p class='bio-entry'><strong>Late 1930s</strong> — Their orange business grew, and the grown-ups drifted apart, with a lot of resentment nobody could explain. It never touched the three of us. I fell in love with the boy next door.</p><p class='bio-entry'><strong>December 24, 1943</strong> — He and I were married on the top floor of the newly finished lighthouse. Hardly anyone blessed us; besides the two of us, the only guest was my twin sister. We swore that even if the whole world was against us, we would stay together.</p><p class='bio-entry'><strong>August 27, 1944</strong> — I gave birth to a daughter, white to the point of being transparent, like an angel. The birth was too hard, and my life ended there. Before I went, I put my daughter in my sister's hands, because I did not know whether my husband would survive this.</p><p class='bio-entry'>I was buried on the flat ground at the northeast corner of Orange Island. It was the island's first grave.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1924年9月20日</strong> — 我和双胞胎妹妹出生在渔岛（后来的橘子岛）。父母是岛上最早的定居者。</p><p class='bio-entry'><strong>1927年</strong> — 岛上来了新邻居，他们家有一个和我们同岁的小男孩。童年和少年时期，我和妹妹，还有他，是彼此最好的朋友，在岛上快乐地长大。</p><p class='bio-entry'><strong>1932年</strong> — 邻居家的树长出了好吃的月白橘，我们两家人经常一起劳作，用海鲜换橘子。</p><p class='bio-entry'><strong>1930年代后期</strong> — 邻居家的橘子生意做大了，大人们的关系渐渐疏远，还夹杂着很多说不清的怨恨。但这没有影响我们三个人的感情。我爱上了邻居家的男孩。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 我和他在新建成的灯塔顶层结了婚。我们的婚姻没有得到太多人的祝福，婚礼上除了我们，宾客只有我的双胞胎妹妹。我们发誓，即便全世界都反对，我们也要在一起。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 我生下了一个像天使一样白到透明的女儿。但我因为难产，生命走到了尽头。临终前，我把女儿托付给了妹妹，因为我不知道丈夫能不能撑过去。</p><p class='bio-entry'>我被安葬在橘子岛东北角的平地上，那是岛上的第一座墓。</p>"
                },
                "cD": {
                        "x": 263.5,
                        "y": 105,
                        "bp": "outside",
                        "by": "1924",
                        "dy": "1985",
                        "name_en": "The First Island Mayor",
                        "name_zh": "第一任岛长",
                        "rel_en": "Great-Grandfather · The First Island Mayor",
                        "rel_zh": "曾爷爷 · 第一任岛长",
                        "sum_en": "The First Island Mayor. To protect his albino daughter he built a nocturnal society and the Holy Water Ritual.",
                        "sum_zh": "第一任岛长。为保护患白化病的女儿，建立“昼伏夜出”的规则与“圣水仪式”，亲手打造了这座反乌托邦。",
                        "bio_en": "<p class='bio-entry'><strong>April 10, 1924</strong> — I was born in Plains City.</p><p class='bio-entry'><strong>1927</strong> — My parents brought me to Fish Island, sixty kilometers southeast of the mainland. One family already lived there, a fisherman and his wife with twin daughters born in 1924, the same year as me. With their help we built a small house on the north side of the island. On the slope behind it grew nothing but Sea-Thorn, tiny fruit, sour and rough. The fisherman's wife taught my mother how to dry it so we could eat it and keep scurvy away.</p><p class='bio-entry'><strong>Winter 1927</strong> — My father had brought an ornamental Royal Sour Orange from home. It could not take the island climate and was dying, so he grafted it onto a native Sea-Thorn stump in the yard. In the spring of 1928 the graft leafed out. It lived.</p><p class='bio-entry'><strong>1932</strong> — The grafted tree threw a bud sport and grew pale, enormous, sweet, juicy Moon-white Oranges. Hired hands came, and my parents took me along while we grafted Moon-white Orange onto the Sea-Thorn all over the slope.</p><p class='bio-entry'>I grew up happy here. The twin sisters were my best friends. Our two families got along; we always had the freshest fish, and Moon-white Orange became an important food for them, so they never had to fight with Sea-Thorn fruit again.</p><p class='bio-entry'><strong>Late 1930s</strong> — The harvest was huge and we shipped it to the mainland, where it became the fashionable fruit in every big city. My parents began teaching me how to grow and trade. Workers and merchants from the mainland started calling the place Orange Island, and a few years later nobody remembered the name Fish Island at all.</p><p class='bio-entry'><strong>December 24, 1943</strong> — I married the older of the twin sisters. Almost nobody blessed that marriage; by then the two families had drifted far apart, and mixed into that distance was a resentment nobody could explain. We held the wedding on the top floor of the lighthouse, which had been finished three years earlier. Apart from the two of us, the only guest was her twin sister.</p><p class='bio-entry'><strong>August 27, 1944</strong> — My daughter was born. She was so beautiful, white to the point of being transparent, like an angel. That same day my wife died in childbirth. It was the darkest day of my life.</p><p class='bio-entry'><strong>August 12, 1947</strong> — Harbor City Central Hospital diagnosed my daughter with \"congenital oculocutaneous albinism, complete type; macular hypoplasia with severe visual impairment.\" The doctor's instruction was: she must avoid sunlight for the rest of her life.</p><p class='bio-entry'><strong>Mid-to-late 1940s</strong> — As production rose we hired large numbers of seasonal pickers. They complained constantly that the island sun burned their skin. My father moved the picking to night and let them sleep through the day, out of the sun.</p><p class='bio-entry'><strong>1949</strong> — I built a small playground in our yard. My daughter loved it. Sometimes the seasonal workers' children came to play, and a noisy yard made her happy.</p><p class='bio-entry'><strong>1950</strong> — A young woman fresh out of the Royal Economics College, the daughter of a family of doctors, came to the island on her graduation trip. We married very quickly.</p><p class='bio-entry'><strong>1950–1955</strong> — With her education and her connections, we built an orange processing plant on the island. Low-margin, high-risk shipments of fresh fruit became manufacturing and industrial trade. In 1951, while we were developing the production line, she brought in a chemistry professor from Plains University. He confirmed that the peel of the Moon-white Orange contains an enormous amount of furanocoumarins. So we finally learned why \"the island sun burns you.\" It was never the sun. It was the juice from the peel on your skin.</p><p class='bio-entry'><strong>1951</strong> — My daughter had reached the age where she needed playmates. I took my wife's advice and had furanocoumarins added to the water in the yard's playground. After that the workers' children could no longer go out in the daytime. The yard was busy at night, and my daughter was happy.</p><p class='bio-entry'><strong>August 28, 1955</strong> — My son was born.</p><p class='bio-entry'><strong>1955–1960</strong> — The Moon-white Orange business grew fast. We needed people, so I built housing and everything that goes with it, plus a new water park: Holy Water Plaza. That is when people started calling me the Island Mayor.</p><p class='bio-entry'><strong>1958</strong> — My wife and I decided to send our three-year-old son off the island, to be raised by his grandfather and uncles. She said he should attend the best schools. She was probably right. With him gone she had more time too, and she ran the factory and the business better than I did. That left me more time with my daughter.</p><p class='bio-entry'><strong>1960</strong> — I had given the new residents safe, comfortable homes and decent wages, so I felt I had the right to ask something of everyone who came: sleep by day, live by night, and attend the Holy Water Ritual every Sunday. That way my daughter's world would always be full of people.</p><p class='bio-entry'><strong>1960</strong> — My father died. My mother died in 1963. The old fishing couple had passed a few years before that. Under my wife's management the factory and the business kept growing, and she started her own perfume label. Because of the factory she spent more than half her time in Harbor City. I did not mind. It meant more time with my daughter.</p><p class='bio-entry'><strong>February 14, 1980</strong> — My daughter died. After I buried her I did not know what I was supposed to do with myself. I kept going up to the top of the lighthouse to remember the day I got married in 1944. My late wife's twin sister went up there often too. We would sit without a word, neither of us knowing what to say.</p><p class='bio-entry'><strong>1985</strong> — I tried to reach my son in Harbor City. I could not get through.</p><p class='bio-entry'><strong>November 12, 1985</strong> — I died, probably of a heart attack. I was buried next to my daughter.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1924年4月10日</strong> — 我出生在平原市。</p><p class='bio-entry'><strong>1927年</strong> — 父母带着我一起移居到距离大陆东南六十公里的渔岛。当时岛上已有一户居民，是一对渔民夫妻，他们家有一对双胞胎女儿，和我一样出生于1924年。我们家在渔民一家的帮助下，在小岛北面盖起了一栋小屋子，屋子后的山坡上是整片的海棘果树林，果实小小的，又酸又涩。渔民家的阿姨教我妈妈怎么把它做成能吃的果干，预防坏血病。</p><p class='bio-entry'><strong>1927年冬天</strong> — 父亲从老家带来的一株观赏用的皇家酸橙无法适应小岛气候，奄奄一息，他把它嫁接到了院子里的原生海棘果树桩上。1928年春天，嫁接枝长出新芽，奇迹般存活。</p><p class='bio-entry'><strong>1932年</strong> — 院子里的嫁接橙树发生芽变，长出了苍白、巨大、甘甜、多汁的月白橘。后来，家里来了一些帮手，父母带着我把月白橘嫁接到了整片山坡的海棘果上。</p><p class='bio-entry'>童年和少年时期，我在渔岛上快乐地长大，双胞胎姐妹是我最好的朋友。我们两家的关系和睦融洽，我们总是能吃到最新鲜的鱼，而月白橘也成为了渔民家的重要食物，他们再也不用费劲处理海棘果的果实了。</p><p class='bio-entry'><strong>1930年代后期</strong> — 月白橘大丰收，销售往大陆，成为各大城市追捧的时尚水果。父母也开始教我月白橘的种植与贸易。大陆来的工人和商人开始管渔岛叫橘子岛，几年后，再也没有人记得“渔岛”这个名字了。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 我和渔民家双胞胎中的姐姐结婚。这桩婚姻没有得到多少人的祝福，因为当时两家人的关系已经疏远了很多，疏远中还夹杂着一些说不清缘由的怨恨。婚礼在落成三年的灯塔顶层举行，除了我和妻子，宾客只有妻子的双胞胎妹妹。</p><p class='bio-entry'><strong>1944年8月27日</strong> — 我的女儿出生，她太美了，像天使一样白到透明。女儿出生当日，妻子难产去世。这是我人生中最黑暗的一天。</p><p class='bio-entry'><strong>1947年8月12日</strong> — 女儿被海港城中心医院诊断为“先天性白化病，完全型；黄斑发育不良，视力严重受损”，医嘱为“终生需避免阳光照射”。</p><p class='bio-entry'><strong>1940年代中后期</strong> — 随着月白橘产量提升，采摘季招募了大量的季节性工人。工人们总是抱怨小岛的日光太毒辣、晒伤皮肤。父亲决定把橘子采摘工作改到晚上进行，白天睡觉，躲避毒辣的阳光。</p><p class='bio-entry'><strong>1949年</strong> — 我在院子里建造了小型乐园，女儿很喜欢，有时候季节性工人的孩子也来玩，热热闹闹的院子让女儿很开心。</p><p class='bio-entry'><strong>1950年</strong> — 一名刚刚从皇家经济学院毕业的医生世家的女儿来到小岛做毕业旅行，我们迅速结了婚。</p><p class='bio-entry'><strong>1950—1955年</strong> — 借助妻子的学识和人脉，我们在岛上建起了橘子加工厂，低附加值、高运输风险的橘子鲜果贸易升级为加工业和工业品贸易。1951年，研发加工生产线的时候，妻子请来了平原大学的化学教授，教授确定月白橘的果皮中含有巨量的呋喃香豆素。至此，“小岛的太阳晒伤皮肤”的原因也找到了：伤害季节性工人的不是阳光，而是沾到皮肤上的橘皮汁水。</p><p class='bio-entry'><strong>1951年</strong> — 女儿到了需要玩伴的年龄，我听从妻子的建议，往院子里乐园的水中添加呋喃香豆素。从此，季节性工人的孩子们再也无法白天出门，晚上的院子里很热闹，女儿很开心。</p><p class='bio-entry'><strong>1955年8月28日</strong> — 儿子出生。</p><p class='bio-entry'><strong>1955—1960年</strong> — 月白橘产品的规模和利润迅速增长，我们需要大量人手，所以我在岛上新建了大量住宅和生活配套，还有新的水上乐园——圣水广场。我获得了“岛长”的称号。</p><p class='bio-entry'><strong>1958年</strong> — 和妻子商量后决定，把三岁的儿子送往岛外，由外公和舅舅抚养。妻子说他应该念最好的学校，她应该是对的。儿子送走后，妻子也有了更多的时间，她管工厂和生意管得比我好，那么我就有更多的时间陪女儿。</p><p class='bio-entry'><strong>1960年</strong> — 我给了新移民安全舒适的居住环境和不错的工资，所以我觉得我有权力给上岛的新居民提一个要求——都必须昼伏夜出，而且周日必须参加圣水仪式。这样我女儿的世界就总是热热闹闹的了。</p><p class='bio-entry'><strong>1960年</strong> — 父亲去世了；1963年，母亲也去世了。渔民家的老两口前几年也去世了。工厂和生意在妻子的管理下越做越大，她还创建了自己的香水品牌。为了工厂，她有一大半时间住在海港城。我觉得还好，可以多陪陪女儿。</p><p class='bio-entry'><strong>1980年2月14日</strong> — 女儿去世。安葬好女儿后，我不知道自己还应该干什么。我经常去灯塔顶层，怀念1944年结婚那天的场景。亡妻的双胞胎妹妹也经常去灯塔，我们相对无言，不知该说什么。</p><p class='bio-entry'><strong>1985年</strong> — 我尝试联系在海港城的儿子，没联系上。</p><p class='bio-entry'><strong>1985年11月12日</strong> — 我去世了，可能是心脏病。我葬在女儿的墓旁。</p>"

                        "sum_en": "She tore up her university acceptance letter to raise her twin sister's albino daughter.",
                        "sum_zh": "为照顾双胞胎姐姐留下的白化病女儿，当场撕毁大学录取通知书，终身没有离岛。",
                        "bio_en": "<p class='bio-entry'><strong>September 20, 1924</strong> — My twin sister and I were born on Fish Island, though everyone ended up calling it Orange Island. Our parents were the first settlers, and they lived by fishing.</p><p class='bio-entry'><strong>1927</strong> — A new family arrived with a little boy who was also three. With our father and mother's help, they built a small house beside the Sea-Thorn slope and stayed. When my mother went out to pick Sea-Thorn, my sister and I played at their house.</p><p class='bio-entry'>Through childhood and into our teens, my sister, the boy next door, and I were each other's best friends. We grew up happy on this island.</p><p class='bio-entry'><strong>1932</strong> — Their Royal Sour Orange tree mutated and grew Moon-white Oranges. They were unbelievably sweet and juicy. The neighbors said they were going to plant the whole slope with them, which sounded wonderful to us. Our families were close; we traded fish for their fruit, and sometimes the whole family helped with the grafting. But grafting was hard work. Fishing was more fun.</p><p class='bio-entry'><strong>From 1936</strong> — Their oranges started selling off the island. They got busier and busier and hired a lot of outsiders, and we went back to fishing. The grown-ups drifted apart. Whatever the grown-ups did, my sister, the boy next door and I stayed as close as ever.</p><p class='bio-entry'><strong>1940</strong> — The lighthouse was finished. From that day on I went up there every single day to look at the view. I always ended up watching the shipping lane to the mainland, dreaming of the day I would go out into the world.</p><p class='bio-entry'><strong>December 24, 1943</strong> — My sister and the boy next door were married in the lighthouse. I watched them swear that even if the whole world was against them, they would stay together.</p><p class='bio-entry'><strong>April 5, 1944</strong> — My acceptance letter from Plains Art University arrived.</p><p class='bio-entry'><strong>August 22, 1944</strong> — My father packed my luggage for university in heavy canvas. Inside were my clothes, washed until they had faded, folded flat, and every gap stuffed with my father's dried fish and my mother's dried Sea-Thorn.</p><p class='bio-entry'><strong>1944</strong> — My sister was pregnant and due at the end of August. I decided to stay until the baby came and go to university after. Then it went wrong. She died in childbirth. Before she went she asked me to look after her child, and I promised, and I tore up my acceptance letter right there in front of her. We buried her on the flat ground at the northeast corner of the island. There was nothing out there. Hers was the only grave.</p><p class='bio-entry'><strong>August 1947</strong> — My father took my niece to Harbor City to see a doctor. I had already bought her a child's snorkeling set for her birthday, and I left the package unopened until she came home. What came home with her was bad news. It was confirmed: congenital albinism, incurable. She could never be in the sun.</p><p class='bio-entry'><strong>September 20, 1948</strong> — I married a young man who had come to the island as a seasonal picker. He was from Old Sail Town, where my parents were born. After the wedding he went back to fishing and went out to sea with my father. He loved fishing. His eyes lit up every time before he sailed.</p><p class='bio-entry'><strong>August 27, 1949</strong> — Our child was born, a healthy, lively daughter.</p><p class='bio-entry'><strong>1956</strong> — Both of my parents died in the same year. I buried them beside my sister. There were three graves there now; it was starting to be a cemetery. When the funeral was over I went home and tried to remember the way my mother had dried Sea-Thorn. After a lot of failures I got it right. My husband said it was good, and that from then on he would take that to sea instead of dried Moon-white Orange.</p><p class='bio-entry'><strong>February 14, 1980</strong> — My niece died. My promise to my sister was finished. From then on I meant to live entirely for myself and my own family.</p><p class='bio-entry'><strong>September 9, 1980</strong> — My husband died in a shipwreck while out fishing. I built him an empty grave in the cemetery and put a full sack of dried Sea-Thorn inside it.</p><p class='bio-entry'><strong>December 5, 1995</strong> — I died of old age. I was buried beside my husband, not far from my parents and my sister.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1924年9月20日</strong> — 我和双胞胎姐姐出生在渔岛（后来大家都叫它橘子岛）。父母是岛上最早的定居者，靠捕鱼为生。</p><p class='bio-entry'><strong>1927年</strong> — 岛上来了新邻居，他们带着一个同样三岁的小男孩。在爸爸妈妈的帮助下，他们在海棘果山坡旁边盖了一栋小房子住了下来。我妈妈去采海棘果的时候，我和姐姐就在他们家玩。</p><p class='bio-entry'>童年和少年时期，我和姐姐，还有邻居家的小男孩是彼此最好的朋友，在岛上快乐地长大。</p><p class='bio-entry'><strong>1932年</strong> — 邻居家的皇家酸橙树发生了变异，长出了月白橘。月白橘超甜超多汁，太好吃了。邻居家叔叔阿姨说他们要把这个好吃的橘子种满山坡，那真是太好啦。我们两家关系很亲密，我们家用海鲜换他们的橘子，全家有时候也帮忙嫁接果树，但是这个工作太难了，还是捕鱼更开心。</p><p class='bio-entry'><strong>1936年开始</strong> — 邻居家的月白橘卖到岛外了，他们越来越忙，请了很多岛外的人帮忙，我们又回归到捕鱼的生活。两家大人的关系逐渐疏远。但不管大人们怎样，我和姐姐，还有邻居家的男孩依然保持着最亲密的关系。</p><p class='bio-entry'><strong>1940年</strong> — 岛上建成了灯塔。从那一天起，我每天都会去灯塔看风景。我总是望着那条通往大陆的航道，梦想着有一天能去外面的世界。</p><p class='bio-entry'><strong>1943年12月24日</strong> — 姐姐和邻居家的男孩在灯塔完婚，我见证了他们“即便全世界都反对，也要在一起”的誓言。</p><p class='bio-entry'><strong>1944年4月5日</strong> — 我收到了大陆平原艺术大学的录取通知书。</p><p class='bio-entry'><strong>1944年8月22日</strong> — 父亲用粗帆布为我打包好了去大学的行李，里面整齐地叠着浆洗发白的衣服，还塞满了父亲做的鱼干和母亲做的海棘果干。</p><p class='bio-entry'><strong>1944年</strong> — 姐姐怀孕了，预产期在8月末，我决定陪她生完孩子再去上大学。但不幸还是发生了，姐姐难产去世。临终前，她托付我照顾她的孩子，我答应了她，并且当场撕掉了录取通知书。我们把姐姐葬在小岛东北角的平地上，那里什么都没有，连墓也只有她一座。</p><p class='bio-entry'><strong>1947年8月</strong> — 外甥女被爸爸带着去海港城看病。我早早买好了一套儿童浮潜套装给她当生日礼物，包裹等她从海港城回来再拆。然而，和她一起回来的是一个坏消息：她的病确诊了，是无法治好的先天性白化病，她永远不能见阳光。</p><p class='bio-entry'><strong>1948年9月20日</strong> — 我嫁给了一个来岛上做季节采摘工的年轻人，他来自旧帆镇，那里也是我父母的出生地。婚后，他重新做起了渔民，和爸爸一起出海。他很喜欢捕鱼，每次出海前，眼睛都亮亮的。</p><p class='bio-entry'><strong>1949年8月27日</strong> — 我们的孩子出生了，是个健康活泼的女儿。</p><p class='bio-entry'><strong>1956年</strong> — 我的父母在同一年去世。我把他们葬在姐姐的墓旁边。这里有三座墓了，可以算得上是个墓园了。葬礼结束后，我回到家，努力回想妈妈当年教的方法，失败了很多次后，做成了野生海棘果干。丈夫说很好吃，以后出海都带这个，不需要月白橘干了。</p><p class='bio-entry'><strong>1980年2月14日</strong> — 外甥女去世。我完成了对姐姐的承诺。以后的日子，我要全心全意为自己和自己的家了。</p><p class='bio-entry'><strong>1980年9月9日</strong> — 我的丈夫在出海捕鱼时遭遇海难去世。我在墓园为他建了一个衣冠冢，里面放了满满一袋子海棘果干。</p><p class='bio-entry'><strong>1995年12月5日</strong> — 我自然老去，离开了这个世界。我葬在丈夫身边，离父母和姐姐也不远。</p>"

                        "bio_en": "<p class='bio-entry'><strong>May 18, 1926</strong> — I was born in Old Sail Town, on the mainland coast. By the time I arrived, the waters around Old Sail Town were already bad for fishing. The old men said it was because Harbor City, thirty kilometers away, was too loud. Every young person went to Harbor City to make a living. There were hardly any young fishermen left.</p><p class='bio-entry'><strong>May 1, 1943</strong> — To earn a little more, I went to Orange Island as a Moon-white Orange picker. The work only lasted three months, May through July, and it paid more than a whole year of fishing.</p><p class='bio-entry'><strong>1947</strong> — When the picking season ended, I did not leave. I had found a fishing family on the southeast side of the island, and they happened to want a hand. I was in my twenties and I started learning to fish, and something in my Old Sail Town blood woke up. The old people said this place used to be called Fish Island. It was heaven for a fisherman. Picking oranges is easy: the fruit is right there, you reach out and take it. But where the fish are, and where they are going, is something you have to watch for, imagine, even understand.</p><p class='bio-entry'><strong>September 20, 1948</strong> — I proposed to a beautiful island girl. She was the daughter of the man teaching me to fish. She had been going to university on the mainland, but she stayed to look after her newborn niece. We were married.</p><p class='bio-entry'><strong>August 27, 1949</strong> — Our daughter was born.</p><p class='bio-entry'><strong>May 7, 1957</strong> — The water changed, and there were no fish left off the west or south sides of the island. I had to move to the waters two nautical miles north.</p><p class='bio-entry'><strong>March 5, 1970</strong> — My granddaughter was born. Like my daughter, she is the most cheerful and the toughest woman I have ever known.</p><p class='bio-entry'><strong>1970s</strong> — The fish kept thinning out. To keep us going, my trips got longer and longer, from two or three days to two or three weeks.</p><p class='bio-entry'><strong>September 9, 1980</strong> — I died in a shipwreck while out fishing. The sea never brought my body back to Orange Island, but my wife built me a headstone there. I like the direction it faces.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1926年5月18日</strong> — 我出生在大陆沿海的旧帆镇。我出生的时候，旧帆镇周围已经不太适合捕鱼了，老人们说是因为三十公里外的海港城太吵了。镇里的年轻人都去海港城谋生，年轻的渔民很少。</p><p class='bio-entry'><strong>1943年5月1日</strong> — 为了多赚点钱，我来到橘子岛做月白橘采摘工人。这份工作只有五月到七月三个月，却能赚到捕鱼一年都赚不到的钱。</p><p class='bio-entry'><strong>1947年</strong> — 采摘季结束后我没有离开。我发现小岛东南有一家渔民，他们正好也想找个帮手。二十多岁的我开始学习捕鱼，我的“旧帆镇”血统被激活了。听老人说这里曾经叫“渔岛”，这里简直是捕鱼的天堂。摘橘子真的太容易了，橘子就在那里，伸手去摘就行；而鱼在哪里、又会去哪里，不但需要观察，还需要想象，甚至需要理解鱼。</p><p class='bio-entry'><strong>1948年9月20日</strong> — 我向一位美丽的岛上姑娘求婚了。她是教我捕鱼的师傅的女儿，本来要去大陆上大学，却为了照顾刚出生的外甥女留了下来。后来我们结了婚。</p><p class='bio-entry'><strong>1949年8月27日</strong> — 我们的女儿出生了。</p><p class='bio-entry'><strong>1957年5月7日</strong> — 受环境变化影响，岛的西面和南面已经捕不到鱼了，我只能把目标改到岛北侧两海里的水域。</p><p class='bio-entry'><strong>1970年3月5日</strong> — 我的外孙女出生了，她和我女儿一样，是我见过最乐观最坚强的女性。</p><p class='bio-entry'><strong>1970年代</strong> — 鱼群越来越少，为了维持生计，我的出海周期越来越长，从两三天延长到两三周。</p><p class='bio-entry'><strong>1980年9月9日</strong> — 我在一次出海捕鱼中遭遇海难去世。海浪没能把我的尸骨冲回橘子岛，但是妻子给我在橘子岛上建了一个墓碑，墓碑的朝向我很满意。</p>"

                        "name_en": "Perfume Queen",
                        "name_zh": "香水女王",
                        "rel_en": "Great-Grandmother · The Perfume Queen",
                        "rel_zh": "曾奶奶 · 香水女王",
                        "sum_en": "The rebellious daughter of an elite Harbor City family. She turned the orchard into a factory and created Blanc de Lune.",
                        "sum_zh": "海港城精英世家的叛逆女儿，第一任岛长的第二任妻子。把果园升级成加工厂，创立“白之月”香水品牌。",
                        "bio_en": "<p class='bio-entry'><strong>January 30, 1928</strong> — I was born into a prominent family of doctors in Harbor City. I had no idea that on an island sixty kilometers away a grafted branch had just thrown a bud sport and grown a strange Moon-white Orange. And that I would spend my whole life tied to that island.</p><p class='bio-entry'><strong>1946</strong> — I got into the Royal Economics College. Unlike my brothers, I actually got in on my own marks. I graduated top of my year, and then discovered that what my family expected of me was to get married. I insisted on a graduation trip, and they gave me a check. The number on it told me everything: they wanted me to go and look at the world of the elite. So I bought the cheapest boat ticket I could find. Destination: Orange Island.</p><p class='bio-entry'><strong>July 23, 1950</strong> — I arrived on Orange Island and ate a few Moon-white Oranges straight off the tree. So sweet it was almost sad. The man who owned the grove was kind. I decided to marry him.</p><p class='bio-entry'>Married life was as dull as I expected, and an island this size made it duller. Every night my husband was out building a playground for his pale daughter, then he came home and collapsed. There were two-week stretches where we never had a real conversation. But that was exactly what I wanted. I read. I had the island's first telephone installed. I wrote to my classmates, my professors, my elders. And eventually I worked out how to run this place.</p><p class='bio-entry'><strong>1951</strong> — I talked my husband's family into putting up more than a decade's worth of orange money and started building the processing plant.</p><p class='bio-entry'><strong>December 22, 1952</strong> — To get the enormous loan for the perfume line, I signed away dozens of pieces of fine jewelry and the only home I owned in Harbor City. In exchange, I had a perfume label: Blanc de Lune. In three years I turned the island's low-margin fresh-fruit trade into manufacturing — canned oranges and perfume. I will not go into what those three years cost me. Meanwhile, my husband's greatest difficulty was that the workers' children would not sleep during the day, so they were not around at night to play with his sick daughter.</p><p class='bio-entry'><strong>August 28, 1955</strong> — My son was born.</p><p class='bio-entry'><strong>August 30, 1958</strong> — Days after his third birthday, I bought him a one-way first-class child's ticket to Harbor City and sent him off the island, to my father and my brothers, and to the best kindergarten in Harbor City, the Sunflower Kindergarten.</p><p class='bio-entry'><strong>1958</strong> — Blanc de Lune was a triumph. That Christmas season I was on the cover of every magazine: the Perfume Queen. For the rest of my life I lived all over the world. Orange Island and Harbor City were the two places I spent the least time.</p><p class='bio-entry'><strong>1985</strong> — My husband died. It was sudden. I did not get back in time.</p><p class='bio-entry'><strong>April 15, 2020</strong> — I died alone in the hospice ward of Harbor City Central Hospital. I had known this day was coming and had already written my will: no funeral, no headstone. I did not want to leave a trace behind.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1928年1月30日</strong> — 我出生在海港城一个显赫的医生世家。我出生的时候并不知道，离海港城六十公里的一座小岛上，有一条嫁接枝发生了芽变，长出了奇异的月白橘。而我这一辈子，也和那座小岛有着怎么也断不掉的关系。</p><p class='bio-entry'><strong>1946年</strong> — 我考入了皇家经济学院，和我的哥哥们不同，我可是真正考进去的。我以年级第一的成绩毕业，却发现家人对我的期待居然是：嫁人。在我的坚持下，父母同意我去毕业旅行，并给了我一张支票。看到支票上惊人的数目，我瞬间明白了，他们希望我去看一个“精英世界”。我偏要买一张最便宜的船票，目的地是橘子岛。</p><p class='bio-entry'><strong>1950年7月23日</strong> — 我到了橘子岛，尝到了刚下树的几个月白橘，甜到忧伤。橘子园的主人很和善，我决定和他结婚。</p><p class='bio-entry'>婚后的生活和我想象的一样无趣，这个巴掌大的小岛让生活更无趣。丈夫每天晚上都在为他苍白的女儿建儿童乐园，回家瘫倒呼呼大睡，我们甚至两周都没正经说过一次话。但这正是我想要的。我阅读，我给这个小岛装了第一台电话，我询问我的同学、老师和长辈，我终于研究出了怎么玩转这座小岛。</p><p class='bio-entry'><strong>1951年</strong> — 我说服丈夫家拿出十几年卖橘子的钱，开始建造橘子加工厂。</p><p class='bio-entry'><strong>1952年12月22日</strong> — 为了香水生产线的巨额贷款，我在担保书上抵押了几十件名贵珠宝和我在海港城的唯一住所，但我有了“白之月”香水品牌。我只花了三年时间，就把岛上低附加值的橘子鲜果贸易升级为加工业——生产橘子罐头和香水，过程中的艰苦不提也罢。而这几年间，丈夫遇到的最大困扰是：工人的孩子们不肯白天睡觉，晚上就不能来水上乐园陪他生病的女儿玩。</p><p class='bio-entry'><strong>1955年8月28日</strong> — 我的儿子出生。</p><p class='bio-entry'><strong>1958年8月30日</strong> — 儿子的三岁生日刚过，我就给他买了前往海港城的单程头等舱儿童船票，把他送出岛外，交由我父亲和兄弟抚养，去念最好的海港城向日葵幼儿园。</p><p class='bio-entry'><strong>1958年</strong> — 我的“白之月”香水大获成功。那一年的圣诞季，各大杂志的封面都是我——“香水女王”。此后的岁月里，我大部分时间都住在世界各地，橘子岛和海港城是我停留得最少的地方。</p><p class='bio-entry'><strong>1985年</strong> — 我的丈夫去世。事情很突然，我没来得及回去。</p><p class='bio-entry'><strong>2020年4月15日</strong> — 我独自一人在海港城中心医院的安宁病房去世。我早知道这一天会来，已经写好遗嘱：不举行葬礼，不留墓碑。我不想在人间留下痕迹。</p>"

                        "sum_en": "A war photographer who came to the island to escape drink. His photographs recorded what the island hid.",
                        "sum_zh": "厌战上岛的战地摄影师。用照片记录下水塔的暗管和鲎工厂的血腥，也一直与酗酒搏斗。",
                        "bio_en": "<p class='bio-entry'><strong>July 4, 1940</strong> — I was born on the mainland.</p><p class='bio-entry'><strong>1967</strong> — I ended seven years of work as a photographer. My reason for starting — to make people see the war — had not changed. I was the one who could not hold on any longer. By then I was drinking.</p><p class='bio-entry'><strong>1968</strong> — I came to Orange Island. You cannot buy liquor here, but you can buy sleeping pills, and that was exactly what I needed.</p><p class='bio-entry'><strong>Night of October 6, 1968</strong> — For the first time in over a year I lifted a camera again and photographed a sky full of mist under blazing lights. A few days later, on a sunlit beach, I lifted it a second time and caught an island girl laughing with a huge fish held over her head. We were married not long after.</p><p class='bio-entry'><strong>March 5, 1970</strong> — Our daughter was born. She cried easily and laughed even more easily, and she is the steadiest, most unbreakable woman I have ever met.</p><p class='bio-entry'><strong>August 15, 1975</strong> — I wandered into the water tower and happened to take a strange photograph: a thin unmarked pipe spliced into the supply line that fed the water park.</p><p class='bio-entry'><strong>December 13, 1997</strong> — I photographed something terrible inside the Horseshoe Crab Factory: hundreds of horseshoe crabs drained of their blue blood, and a pile of shells in the corner, alive or dead, no one could tell.</p><p class='bio-entry'>The war came back for me every so often, and the island shop kept getting better stocked. Still, something good always came along and made me decide to quit drinking, though I only ever managed it for a while.</p><p class='bio-entry'><strong>January 15, 1998</strong> — I drank my last bottle and decided, again, to quit. This time it was because I had broken my granddaughter's favorite toy while drunk. I did not actually get drunk that night, because my eyes and hands were steady enough to repair the toy. Then I fell asleep and never woke up.</p><p class='bio-entry'>I was buried in the Orange Island cemetery. My family comes to visit often.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1940年7月4日</strong> — 我出生在大陆。</p><p class='bio-entry'><strong>1967年</strong> — 我结束了七年的摄影师生涯。“要让别人看见战争”的初心没有改变，是我撑不下去了，我已经染上了酗酒的问题。</p><p class='bio-entry'><strong>1968年</strong> — 我来到了橘子岛，这里买不到酒，但是能买到安眠药，这正是我需要的。</p><p class='bio-entry'><strong>1968年10月6日夜晚</strong> — 我时隔一年多后第一次举起了相机，拍下了灯火通明下的漫天水雾。几天后的阳光沙滩上，我第二次举起了相机，这次捕捉到了一位美丽的岛上姑娘举着大鱼大笑的瞬间。不久后，我们结婚了。</p><p class='bio-entry'><strong>1970年3月5日</strong> — 我们的女儿出生了。她是个爱哭更爱笑的孩子，是我见过最稳定最坚韧的女子。</p><p class='bio-entry'><strong>1975年8月15日</strong> — 我逛到水塔里，偶然拍到了一张照片：水上乐园的供水管道上，被接入了一根来路不明的细管。</p><p class='bio-entry'><strong>1997年12月13日</strong> — 我拍下了鲎工厂里血腥的一幕：几百只鲎被抽干蓝色的血液，角落里堆积着不知死活的躯壳。</p><p class='bio-entry'>战争创伤每隔一段时间就会袭击我一次，而橘子岛小卖部的货架也越来越齐全。不过还好，总有特别美好的事情让我下定决心戒酒——虽然每次只成功一段时间。</p><p class='bio-entry'><strong>1998年1月15日</strong> — 我喝掉了最后一瓶酒，“又”决定戒酒了，这次的原因是我喝酒的时候弄坏了外孙女最心爱的玩具。最后一次我并没有喝醉，因为我还眼不花手不抖地修好了外孙女的玩具。但是后面睡着了，就再也没有醒来。</p><p class='bio-entry'>我被安葬在橘子岛的墓园，家人们经常来墓地看我。</p>"
                },
                "Bc": {
                        "x": 212.5,

                        "name_en": "The Albino Girl",
                        "name_zh": "白化病女孩",
                        "rel_en": "Great-Aunt · The Albino Girl",
                        "rel_zh": "曾姨外婆 · 白化病女孩",
                        "sum_en": "Born with complete albinism. Her illness is the reason the whole island turned nocturnal.",
                        "sum_zh": "cD 与 Ba1 的女儿，重度先天性白化病患者。她的病促成了全岛“昼伏夜出”的习俗。",
                        "bio_en": "<p class='bio-entry'><strong>August 27, 1944</strong> — I was born on Orange Island. My mother died in childbirth the same day. My father and my aunt raised me.</p><p class='bio-entry'>People always said I was unusually white. My father insisted it was because I had been born as beautiful as an angel. On <strong>August 12, 1947</strong> he took me to Harbor City Central Hospital, where they told us: complete congenital albinism, macular hypoplasia, severe visual impairment. The doctor said I could never be in the sun.</p><p class='bio-entry'>After the hospital my father stopped letting me outside during the day, but he did not spend one minute less with me. He took me out at night and let me sleep the whole day at home. I loved the picking season, because there were so many people and so much noise, and sometimes there were even a few children on the island.</p><p class='bio-entry'><strong>1949</strong> — My father built a small playground in the yard: swings, a seesaw, a carousel, and a giant water slide. It drew a lot of children, but by the middle of the night they were all too sleepy and went home to bed. The hours after midnight were always lonely.</p><p class='bio-entry'><strong>October 31, 1949</strong> — My father gave me a black velvet cloak with a soft lining. It stayed with me for years. It kept off the sun, and it kept off the way people looked at a monster.</p><p class='bio-entry'><strong>1950</strong> — My father remarried. Nothing much changed for me.</p><p class='bio-entry'><strong>1951</strong> — The water in the playground pool started to smell good. It smelled like the orange grove! I loved that smell, and I was sure the other children loved it too, because they started sleeping in the day and playing at night, just like their parents. I was so happy. I really did try everything I had to make friends.</p><p class='bio-entry'><strong>1950s</strong> — A lot of new houses went up on the island and we moved into a new home. It was very large and comfortable, but I still took the children back to the water park at the old house all the time.</p><p class='bio-entry'><strong>Summer 1955</strong> — I went to my father's orange grove, and a boy who had just moved to the island called me a monster. My father beat him badly, and his family left the island soon after. That same year my half-brother was born.</p><p class='bio-entry'><strong>1960</strong> — My father built a bigger water park called Holy Water Plaza. It was not just for children anymore; the adults liked it too. He arranged for the whole island to come every Sunday. Only my aunt's family never came. The water still smelled of the orange grove, much fainter now, but I still loved it. My father said I was the only one who could smell it. Maybe so — my eyes are bad, so my nose is very good.</p><p class='bio-entry'>I hope I never grow up. Once you grow up you start asking questions. Like when I look at my mother's portrait on the back of my little round mirror and think: if she saw me now, would she think it was worth it?</p><p class='bio-entry'><strong>February 14, 1980</strong> — I died of my illness. The doctors said I would not live to adulthood, but I made it to thirty-five. If I could choose, I would not grow up at all. I would stay a child forever, in the playground at the old house.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1944年8月27日</strong> — 我出生在橘子岛。我出生的那一天，母亲因为难产去世。我是被父亲和小姨抚养长大的。</p><p class='bio-entry'>总有人说我特别白，父亲坚持认为这是因为我生来就美得像天使。<strong>1947年8月12日</strong>，父亲带我去海港城中心医院看病，我被诊断为完全型先天性白化病，黄斑发育不良，视力严重受损。医生说我终生不能见阳光。</p><p class='bio-entry'>从医院回来后，父亲不再让我白天出门，但是他陪我的时间一点都没有减少。他经常带我晚上出门，让我整个白天在家睡觉。我喜欢橘子岛的采摘季，因为人特别多特别热闹，甚至会有几个小孩子在岛上。</p><p class='bio-entry'><strong>1949年</strong> — 父亲在院子里建了一个小乐园，有秋千、跷跷板、旋转木马，还有一个巨大的水上滑梯。乐园吸引了不少小孩子来玩，但是到了半夜他们都太困了，回去睡觉了。后半夜总是非常落寞。</p><p class='bio-entry'><strong>1949年10月31日</strong> — 父亲送给我一件内衬柔软的黑色天鹅绒斗篷，它陪了我很多年，帮我挡住了阳光，也挡住了别人看“怪物”的目光。</p><p class='bio-entry'><strong>1950年</strong> — 父亲再婚了，我的生活没什么变化。</p><p class='bio-entry'><strong>1951年</strong> — 乐园水池里的水变香了，是橘子林的香味！我喜欢这个气味，其他小孩子肯定也喜欢，因为他们也变得跟他们父母一样白天睡觉、晚上玩了。我太高兴了。我真的付出了所有努力去交朋友。</p><p class='bio-entry'><strong>1950年代</strong> — 岛上多了很多新房子，我们也搬进了新家，新家特别大，很舒服，不过我还是经常带着小孩子去老房子的水上乐园。</p><p class='bio-entry'><strong>1955年夏天</strong> — 我去父亲的橘子园，有个新搬来的小孩叫我怪物，父亲狠狠打了他，那家人随后离开了岛。同年，我同父异母的弟弟出生了。</p><p class='bio-entry'><strong>1960年</strong> — 父亲建了更大的水上乐园，叫“圣水广场”，不再仅仅适合小孩子，大人们也喜欢。父亲安排全岛人每周日在圣水广场玩，只有小姨家从来不来。水里依然有橘子林的香气，虽然淡了很多，但是我依然非常喜欢。父亲说只有我闻得到水里的香气，大概吧，我视力不好，所以我的鼻子特别灵敏。</p><p class='bio-entry'>我希望我永远也不要长大，长大了就会想很多问题。比如我常看着小圆镜背面母亲的画像想：她看到现在的我，会觉得值吗？</p><p class='bio-entry'><strong>1980年2月14日</strong> — 我病逝了。医生说我活不到成年，但我活到了三十五岁。如果给我选择，我不愿意长大，我想做一个小孩，永远待在老房子的游乐场里。</p>"

                        "rel_zh": "曾外婆 · 花田妈妈",
                        "sum_en": "The fourth child born on the island. She filled every yard on Orange Island with flowers, working while everyone slept.",
                        "sum_zh": "岛上出生的第四个孩子。趁着白天全岛人熟睡时耕作，让每一个院子都开出了花。",
                        "bio_en": "<p class='bio-entry'><strong>August 27, 1949</strong> — I was born. My father was a fisherman from Old Sail Town; my mother was the second child ever born on Orange Island. The first was my mother's twin sister, who died giving birth to my cousin. My cousin was the third child born on the island, and I was the fourth.</p><p class='bio-entry'>My cousin was ill and could not come out to play in the daytime. I wanted to keep her company, but I had spent my whole day on the beach and in the water, so by night I could barely keep my eyes open. I told my mother to go and look after her instead. I was perfectly happy alone on the sand. My father worried I was lonely and gave me a kitten. I named her Mimi.</p><p class='bio-entry'>Every day was a good day. I went out fishing with my father and sat at the lighthouse doing nothing with my mother. What I loved most was the Orange Island shoreline. Mimi and I found a cave in the rock face behind our house, and the cave led out to another beach, even more beautiful. I built my secret room in that cave and kept everything precious in there.</p><p class='bio-entry'><strong>1969</strong> — I married a photographer.</p><p class='bio-entry'><strong>March 5, 1970</strong> — Our daughter was born.</p><p class='bio-entry'>I had planned to be a fisherman, or a navigator. After my daughter was born I changed my mind. I decided to work out which flowers grew best on Orange Island. In under five years there were flowers blooming in every yard on the island. While I worked in those yards, the people inside were asleep. They wanted to watch the flowers being raised, but flowers have to be raised in the sun. Most islanders had never seen my face, but they all loved the flowers in their yards, and they called me the Mother in Flower Field.</p><p class='bio-entry'><strong>1980</strong> — My father was lost in a shipwreck. <strong>1995</strong> — My mother died.</p><p class='bio-entry'><strong>1993</strong> — My twin granddaughters were born. They were so close they were almost one person, and they reminded me of my mother and the aunt I never met. I used to resent, just a little, that my mother spent more time with my cousin than with me. Watching those two girls, I understood her immediately.</p><p class='bio-entry'>The house was full for a few years. <strong>1998</strong> — My husband died. <strong>2017</strong> — My son-in-law died. Both were buried in the cemetery. Our house got emptier and emptier, and the cemetery got fuller.</p><p class='bio-entry'><strong>2022</strong> — My great-granddaughter was born. Her father came from the family mine had refused to speak of for decades. Something felt wrong to me, and I was right: the news came that my older granddaughter had died in childbirth.</p><p class='bio-entry'><strong>January 8, 2025</strong> — I died and was buried in the family cemetery, with all of my people. None of us ever left Orange Island.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1949年8月27日</strong> — 我出生了。我的父亲是个从旧帆镇来的渔民，母亲是橘子岛上出生的第二个孩子。岛上出生的第一个孩子是母亲的双胞胎姐姐，她生我表姐的时候去世了。我的表姐是岛上出生的第三个孩子，我是岛上出生的第四个孩子。</p><p class='bio-entry'>表姐是个病人，白天不能出来玩。我也想陪她玩，但是我白天在沙滩和海里玩得太累了，晚上总是困得不行。我让妈妈多去照顾表姐，我一个人在沙滩上就玩得很开心。爸爸怕我孤单，给了我一只小猫，我叫它咪咪。</p><p class='bio-entry'>生活的每一天都很开心，跟爸爸出海捕鱼，跟妈妈去灯塔发呆。我最喜欢的还是橘子岛的海滩。我和咪咪在家后面的岩壁上发现了一个山洞，山洞通向另一片更美的沙滩。我在山洞里建了我的秘密小屋，珍贵的东西都放在那里。</p><p class='bio-entry'><strong>1969年</strong> — 我和一个摄影师结婚了。</p><p class='bio-entry'><strong>1970年3月5日</strong> — 我们的女儿出生了。</p><p class='bio-entry'>我本来打算做一个渔民或者航海家，女儿出生后，我改变了主意，我决定研究怎么养出最适合橘子岛的花。不到五年的时间，岛上所有的院子里都长出了美丽的花。我在那些院子里工作的时候，屋子里的人都在睡觉，他们也想观察花儿培育的过程，但是花儿一定要在阳光下培育。岛民们不一定见过我，但是他们都喜欢院子里的花，他们叫我“花田妈妈”。</p><p class='bio-entry'><strong>1980年</strong> — 我的父亲在出海时遭遇海难；<strong>1995年</strong>，我的母亲去世。</p><p class='bio-entry'><strong>1993年</strong> — 我的双胞胎外孙女出生了，她们亲密得就像一个人，让我想起了我的妈妈和我从未谋面的大姨。我曾经也有一点点怨我母亲陪我表姐更多，但是看到两个外孙女，我瞬间就理解了自己的母亲。</p><p class='bio-entry'>家里热闹了几年。<strong>1998年</strong>，我的丈夫去世；<strong>2017年</strong>，我的女婿去世。他们都被安葬在了墓园里。家里的人越来越少，墓园却越来越热闹。</p><p class='bio-entry'><strong>2022年</strong> — 我的曾外孙女出生了，她的父亲来自我的家人几十年都不愿意提及的那个家庭。我隐隐感觉不对，果然噩耗传来，我的大外孙女难产去世了。</p><p class='bio-entry'><strong>2025年1月8日</strong> — 我去世了，葬在家族墓园里，我的亲人们都在那里。我们都没有离开橘子岛。</p>"
                },

                        "name_en": "The Second Island Mayor",
                        "name_zh": "第二任岛长",
                        "rel_en": "Grandfather · The Second Island Mayor",
                        "rel_zh": "爷爷 · 第二任岛长",
                        "sum_en": "The Second Island Mayor. He knew the island's 'genes' were only furanocoumarins, and ruled on that lie anyway.",
                        "sum_zh": "第二任岛长。早已看穿“橘子岛的基因”不过是呋喃香豆素，仍以此立法统治；后转向鲎血生意。死于大爆炸。",
                        "bio_en": "<p class='bio-entry'><strong>August 28, 1955</strong> — I was born on Orange Island. My father was the Island Mayor; my mother came from a family of doctors in Harbor City.</p><p class='bio-entry'><strong>August 30, 1958</strong> — I left Orange Island to live with my grandfather in Harbor City. My mother said she would be in Harbor City often. She was — always for business. As for my father, I suppose there was simply too much to do on Orange Island. People told me my mother was the Perfume Queen, my father was the Mayor of Orange Island, Orange Island was a treasure island, and Orange Island belonged to my family.</p><p class='bio-entry'><strong>1973</strong> — I entered Plains University and stayed through a doctorate at its medical school. Afterward I went, as expected, to Harbor City Central Hospital, where my grandfather and my uncles were the authorities. I liked almost everything about that job, except being a doctor. That is probably why I chose the wife I did: her family ruled a commercial empire, and ruling struck me as the more worthwhile thing to do.</p><p class='bio-entry'><strong>1985</strong> — By the time I brought my wife back to Orange Island, my father had already died. I became the Island Mayor as a matter of course. The island's nocturnal rhythm was fascinating. Residents and tourists alike believed that living by night was written into Orange Island's genes. It did not take me long to work out that the famous \"genes of Orange Island\" were nothing but furanocoumarins. In 1986 I issued the <em>Orange Island Residents' Health Code</em>. My rule now stood on the side of \"the genes of nature,\" and that gave it an authority I never had to argue for.</p><p class='bio-entry'><strong>From 1990</strong> — The furanocoumarin product line started earning less, entirely because of the chief scientist at the orange factory. Furanocoumarins were his discovery, and he had spent his whole life trying to stop them being used. The tanning-product manufacturers who bought from us would keep dwindling. But I had found a new opportunity. On the eastern end of the southern beach, every breeding season, the sand filled up with horseshoe crabs. That blue blood was a gold mine that regrew itself. All I needed was to hire a marine biologist.</p><p class='bio-entry'><strong>1993</strong> — My son was born.</p><p class='bio-entry'><strong>2008</strong> — My son, fifteen, left Orange Island to study in Harbor City. The school here normally only takes primary students; the rest go to the mainland for middle school. I had spent years expanding the school's budget just so he could stay a few more years.</p><p class='bio-entry'><strong>From the 2000s</strong> — Demand for horseshoe crab blood products kept rising, and I came into conflict with the marine biologist at the crab lab. His working methods were badly hurting output and profit.</p><p class='bio-entry'>I spent a fortune rebuilding the island clinic into a small hospital, with wards and an operating room. <strong>2018</strong> — My son graduated from medical school and came back to the island the same year the hospital was finished.</p><p class='bio-entry'><strong>2021</strong> — My son married that marine biologist's daughter. In all these years he has never worked as a doctor. He became a firefighter, watching security cameras where nothing ever happens.</p><p class='bio-entry'><strong>May 30, 2026</strong> — The secret room behind my office — the store for furanocoumarins — exploded. The blast spread to the orange workshop on the ground floor and destroyed it. I died in that explosion.</p>",
                        "bio_zh": "<p class='bio-entry'><strong>1955年8月28日</strong> — 我出生在橘子岛。我的父亲是岛长，母亲来自海港城的医生世家。</p><p class='bio-entry'><strong>1958年8月30日</strong> — 我离开橘子岛，搬去和海港城的外公一起住。母亲说她会经常回海港城，她确实经常回海港城，但都是为了生意。而父亲，应该是橘子岛上的事情太忙了吧。他们说，我的母亲是香水女王，我的父亲是橘子岛岛长，橘子岛是宝藏岛，而橘子岛是我家的。</p><p class='bio-entry'><strong>1973年</strong> — 我考入平原大学，一直念到医学院的博士。毕业后顺理成章地进入了海港城中心医院，我的外公和舅舅们都是那家医院的权威。我喜欢在中心医院这份工作的绝大部分，除了——当医生本身。这大概也是我选择自己妻子的原因——她的家庭统治着一个商业帝国，而统治，应该是更值得我去做的事情。</p><p class='bio-entry'><strong>1985年</strong> — 我带着妻子回到橘子岛的时候，父亲已经去世。我顺理成章地成了岛长。岛上昼伏夜出的规律让人着迷，居民和旅游者都相信“昼伏夜出”是橘子岛的基因，我没多久就搞明白了，所谓“橘子岛的基因”只不过是呋喃香豆素。1986年，我颁布了《橘子岛居民健康守则》，我的统治站在了“大自然的基因”这一边，获得了天然的威权。</p><p class='bio-entry'><strong>1990年开始</strong> — 呋喃香豆素产品线的收益开始减少，这都是橘子工厂那位首席科学家导致的。呋喃香豆素是他的发现，而他花了毕生的精力阻止呋喃香豆素的应用。采购呋喃香豆素的美黑产品厂家将逐渐减少。不过我也发现了新的商机：岛南部沙滩的东侧，每到鲎的繁殖季就布满了鲎，那蓝色的血液像再生金矿一样。我只需要招募一个海洋学家来就行。</p><p class='bio-entry'><strong>1993年</strong> — 我的儿子出生了。</p><p class='bio-entry'><strong>2008年</strong> — 十五岁的儿子离开橘子岛去海港城读书。橘子岛上的学校通常只收小学生，其他孩子初中就去大陆念书了，这几年我特意扩充了学校的经费，才让儿子多读了几年。</p><p class='bio-entry'><strong>2000年代以来</strong> — 鲎血产品的需求量越来越高，我和鲎实验室的海洋学家发生了分歧，他的工作方法严重影响了产量和利润。</p><p class='bio-entry'>我斥巨资重建了岛上的诊所，把诊所扩建成了一个小医院，有病房和手术室。<strong>2018年</strong>，儿子从医学院毕业回到岛上，那一年医院刚好完工。</p><p class='bio-entry'><strong>2021年</strong> — 儿子娶了那个海洋学家的女儿。这几年，他也没有当医生，而是当了一个消防员，平时看看无事发生的监控。</p><p class='bio-entry'><strong>2026年5月30日</strong> — 我办公室后的秘密房间——堆放呋喃香豆素的仓库发生大爆炸，火势蔓延到一楼，橘子车间也毁了。我死在了这场爆炸里。</p>"
                },
                "i": {

                        "name_en": "Marine Scientist",
                        "name_zh": "海洋学家",
