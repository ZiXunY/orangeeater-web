<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Orange Island</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================
           Header (Logo & Language)
           ========================= */
        #site-header {
            width: 100%;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
        }

        .header-content {
            width: 850px; 
            padding: 20px 0;
            display: flex;
        }

        /* 左侧 2/3 放 Logo */
        .header-left {
            width: 66.66%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .site-logo {
            max-height: 50px;
            width: auto;
            font-style: italic; 
            color: #444;
        }

        /* 右侧 1/3 放语言切换 */
        .header-right {
            width: 33.33%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .lang-btn:hover {
            color: #aaa;
        }

        .lang-btn.active {
            color: #d35400;
            font-weight: bold;
            border-bottom: 2px solid #d35400;
        }

        /* =========================
           Family Tree (上半部分)
           ========================= */
        #family-tree {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .family-tree-image {
            display: block;
            width: 850px;
            height: 400px;
        }

        /* 隐形点击热区 */
        .avatar-hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent; 
            border: 2px solid transparent;
        }

        .avatar-hotspot:hover, .avatar-hotspot.active-spot {
            border: 2px solid #d35400;
            background: rgba(211, 84, 0, 0.3);
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 10px #d35400;
            z-index: 10;
        }

        /* =========================
           Character Information (下半部分)
           ========================= */
        #character-info {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            border-top: 1px solid #333;
            padding: 30px 20px;
            transition: all 0.3s ease;
        }

        .character-info-placeholder {
            color: #666;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        #info-panel {
            display: none; 
            width: 100%;
            max-width: 850px;
            flex-direction: row;
            gap: 40px;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        #char-portrait {
            width: 100px;  
            height: 100px;
            border-radius: 50%;
            background-image: url('images/family-tree/family-tree.png');
            background-size: 1700px 800px; 
            background-repeat: no-repeat;
            border: 3px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .info-right {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .puzzle-title {
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 横向排列的下拉框区域 */
        .puzzle-section {
            display: flex;
            flex-direction: row; /* 横向排列 */
            gap: 20px;
            background: #151515;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .select-group {
            display: flex;
            flex-direction: column; /* 标签在输入框上方 */
            flex: 1; /* 平分空间 */
            gap: 8px;
        }

        .select-group label {
            color: #aaa;
            font-size: 13px;
        }

        select {
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        select:focus {
            border-color: #d35400;
        }

        #bio-section {
            display: none; 
            background: rgba(211, 84, 0, 0.1);
            padding: 20px;
            border-left: 4px solid #d35400;
            border-radius: 4px;
            color: #ddd;
            line-height: 1.8;
            font-size: 15px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================
           Footer
           ========================= */
        footer {
            width: 100%;
            padding: 40px 20px;
            background: #050505;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            color: #666;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-links a:hover {
            color: #ff7b25;
            text-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
        }

        .footer-copyright {
            font-size: 12px;
            color: #444;
        }
    </style>
</head>

<body>

    <!-- =========================
         Header (Logo & Lang)
         ========================= -->
    <header id="site-header">
        <div class="header-content">
            <div class="header-left">
                <img src="images/logo.png" alt="Whispers of Orange Island" class="site-logo">
            </div>
            <div class="header-right">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </header>

    <!-- =========================
         上半部分：家族树
         ========================= -->
    <section id="family-tree">
        <div id="tree-container" style="position: relative; width: 850px; height: 400px;">
            <img src="images/family-tree/family-tree.png" alt="Family Tree" class="family-tree-image">
            <!-- 热区会由 JavaScript 自动基于精确像素计算并生成在此处 -->
        </div>
    </section>

    <!-- =========================
         下半部分：解谜与生平信息
         ========================= -->
    <section id="character-info">
        
        <div class="character-info-placeholder" id="placeholder-text">
            Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.
        </div>

        <div id="info-panel">
            <div class="info-left">
                <div id="char-portrait"></div>
            </div>

            <div class="info-right">
                <div class="puzzle-title" id="ui-puzzle-title">Complete the character's profile to unlock their biography:</div>
                
                <div class="puzzle-section">
                    <div class="select-group">
                        <label id="ui-label-birthplace">Birth Place:</label>
                        <select id="select-birthplace">
                            <!-- 选项由 JS 生成 -->
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-birthyear">Birth Year:</label>
                        <select id="select-birthyear">
                            <!-- 选项自动生成 -->
                        </select>
                    </div>
                    <div class="select-group">
                        <label id="ui-label-deathyear">Death Year:</label>
                        <select id="select-deathyear">
                            <!-- 选项自动生成 -->
                        </select>
                    </div>
                </div>

                <div id="bio-section"></div>
            </div>
        </div>
    </section>

    <!-- =========================
         Footer
         ========================= -->
    <footer>
        <div class="footer-links">
            <a href="https://store.steampowered.com/app/5165730" target="_blank">Steam</a>
            <a href="https://discord.gg/GMvHrNVfru" target="_blank">Discord</a>
            <a href="mailto:contact@orangeeater.com">contact@orangeeater.com</a>
        </div>
        <div class="footer-copyright">
            © 2026 ZiXunY. All rights reserved.
        </div>
    </footer>

    <!-- =========================
         核心交互与双语逻辑
         ========================= -->
    <script>
        // 1. 语言字典库
        const i18n = {
            en: {
                prompt: "Click on a character portrait in the family tree above<br>and complete their profile to unlock their memories.",
                puzzleTitle: "Complete the character's profile to unlock their biography:",
                bpLabel: "Birth Place:",
                byLabel: "Birth Year:",
                dyLabel: "Death Year:",
                selectDefault: "-- Select --",
                places: { "orange_island": "Orange Island", "outside": "Outside Island" },
                bioPrefix: "<strong>Unlocked Memory:</strong><br><br>"
            },
            zh: {
                prompt: "请点击上方家族树中的人物头像，补全档案线索，<br>以解锁其生平记忆。",
                puzzleTitle: "请补全该角色的档案线索，以解锁生平记忆：",
                bpLabel: "出生地 (Birth Place):",
                byLabel: "出生年份 (Birth Year):",
                dyLabel: "死亡年份 (Death Year):",
                selectDefault: "-- 选择 --",
                places: { "orange_island": "橘子岛", "outside": "岛外" },
                bioPrefix: "<strong>解锁生平：</strong><br><br>"
            }
        };

       // 2. 游戏数据库 (极简化生平，含 34 个角色精确像素坐标)
        const charDatabase = {
            "Player": { x: 199.5, y: 350, bp: "orange_island", by: "2022", dy: "2026", 
                bio_en: "The protagonist.", 
                bio_zh: "主角。" },
            "Guide": { x: 137.5, y: 277, bp: "orange_island", by: "1993", dy: "2022", 
                bio_en: "Mother of the Player. Passed away giving birth.", 
                bio_zh: "主角母亲 Bi1。因难产去世。" },
            "a": { x: 137.5, y: 46, bp: "outside", by: "1899", dy: "1956", 
                bio_en: "Great-great-great-grandfather of the Player. The first generation of islanders and fisherman. Named the island.", 
                bio_zh: "主角的曾曾曾外祖父。和妻子一起定居这个小岛，最早的岛民，以捕鱼为生，称呼小岛为“鱼热爱的地方”。" },
            "B": { x: 187.5, y: 47, bp: "outside", by: "1901", dy: "1956", 
                bio_en: "Great-great-great-grandmother of the Player. Wife of 'a', one of the earliest settlers. Invented the Sea-Thorn supplement.", 
                bio_zh: "主角的曾曾曾外祖母。和丈夫一起定居这个小岛，最早的岛民。并发明了处理酸涩的海棘果为维生素补充剂的方法。" },
            "c": { x: 238.5, y: 43, bp: "outside", by: "1898", dy: "1960", 
                bio_en: "Great-great-grandfather of the Player. Second batch of settlers. Grafted the iconic 'Moon-white Orange'.", 
                bio_zh: "主角的曾曾祖父。和妻子儿子一起定居到岛上，是岛上的第二家居民。带来皇家酸橙并意外嫁接出“月白橙”，奠定了全岛的橙子产业基础。" },
            "D": { x: 288.5, y: 50, bp: "outside", by: "1902", dy: "1963", 
                bio_en: "Great-great-grandmother of the Player. Wife of 'c', co-founder of the island's earliest agricultural prosperity.", 
                bio_zh: "主角的曾曾祖母。和丈夫儿子一起定居到岛上，是岛上的第二家居民。带来皇家酸橙并意外嫁接出“月白橙”，奠定了全岛的橙子产业基础。" },
            "Ba1": { x: 187.5, y: 104, bp: "orange_island", by: "1924", dy: "1944", 
                bio_en: "Great-great-great-aunt of the Player. Daughter of the fisherman family, first wife of cD. Died giving birth to the albino daughter.", 
                bio_zh: "主角的曾曾外姨祖母。岛上第一家居民——渔民家的女儿，和双胞胎姐妹是最早在岛上出生的孩子。和种橘子家的儿子结婚，生下患白化病的女儿时难产去世。这场悲剧也是导致两家决裂的导火索。" },
            "cD": { x: 263.5, y: 105, bp: "outside", by: "1924", dy: "1985", 
                bio_en: "Great-grandfather of the Player. The second Island Chief. Established the 'nocturnal society' to protect his albino daughter.", 
                bio_zh: "主角的曾祖父，也是主角的曾曾外姨祖母的丈夫。在岛外出生，和父母一起移居岛上，将父母嫁接出来的月白橙做成了产业，成为第一任岛长。和渔民的女儿结婚，为保护患白化病的女儿建立“夜间社会”规则和“圣水仪式”。" },
            "Ba2": { x: 137.5, y: 104, bp: "orange_island", by: "1924", dy: "1995", 
                bio_en: "Great-great-grandmother of the Player. Twin sister of Ba1. Gave up university to protect her albino niece.", 
                bio_zh: "主角的曾曾外祖母。岛上第一家居民——渔民家的女儿，和双胞胎姐妹是最早在岛上出生的孩子。为照顾难产去世的双胞胎姐妹的白化病女儿，撕毁了大学录取通知书永远留在岛上。" },
            "f": { x: 87.5, y: 112, bp: "outside", by: "1926", dy: "1980", 
                bio_en: "Great-great-grandfather of the Player. A fisherman, Passed away in a shipwreck.", 
                bio_zh: "主角的曾曾外祖父。渔夫，最终死于海难。" },
            "E": { x: 312.5, y: 115, bp: "outside", by: "1928", dy: "2020", 
                bio_en: "Great-grandmother of the Player. The Perfume Queen and cD's second wife. Pushed the island towards industrialization.", 
                bio_zh: "主角的曾祖母。出生于岛外的精英家庭的叛逆女儿，第一任岛长的第二任妻子，香水女王。" },
            "g": { x: 62.5, y: 148, bp: "outside", by: "1940", dy: "1998", 
                bio_en: "Great-grandfather of the Player. A war photographer who sought peace on the island in 1968. Died suspiciously.", 
                bio_zh: "主角的曾外祖父。战地摄影师，因厌战上岛。用照片和“月光显影术”记录了岛屿被遗忘的历史，死因可疑。" },
            "Bc": { x: 212.5, y: 153, bp: "orange_island", by: "1944", dy: "1980", 
                bio_en: "Great-aunt of the Player. Born with albinism. Her illness indirectly caused the dark era of the nocturnal society.", 
                bio_zh: "主角的曾祖父和曾曾外姨祖母的女儿。先天性白化病患者。虽受尽溺爱却一直觉得自己不幸，她的病情促使了“昼伏夜出”习俗的形成。" },
            "Bf": { x: 112.5, y: 167, bp: "orange_island", by: "1949", dy: "2025", 
                bio_en: "Great-grandmother of the Player.", 
                bio_zh: "主角的曾外婆。" },
            "cE": { x: 287.5, y: 185, bp: "orange_island", by: "1955", dy: "2026", 
                bio_en: "Grandfather of the Player. The third Island Chief and factory boss. Died in the 2026 massive explosion.", 
                bio_zh: "主角的爷爷。第二任岛长。转向高利润的呋喃香豆素生产和鲎血采集。死于2026橘子工厂大爆炸。" },
            "i": { x: 137.5, y: 210, bp: "outside", by: "1965", dy: "2017", 
                bio_en: "Grandfather of the Player. A marine biologist with a strong sense of justice. Assassinated after discovering the truth.", 
                bio_zh: "主角的外祖父。热爱大海、充满正义感的海洋学家。发现了鲎工厂虐杀鲎的真相后，被暗杀并伪装成意外。" },
            "ProudGrandpaM": { x: 337.5, y: 198, bp: "outside", by: "1960", dy: "2023", 
                bio_en: "Pround grandpa.", 
                bio_zh: "为孙女骄傲的外公。" },
            "GroceryFounderF": { x: 812.5, y: 227, bp: "outside", by: "1973", dy: "2025", 
                bio_en: "Grocer.", 
                bio_zh: "杂货铺老板。" },
            "HotelFounderM": { x: 463.5, y: 135, bp: "outside", by: "1935", dy: "2010", 
                bio_en: "Hotel Founder.", 
                bio_zh: "旅馆创始人。" },
            "LibraryFounderM": { x: 774.5, y: 177, bp: "outside", by: "1958", dy: "2025", 
                bio_en: "Library Founder.", 
                bio_zh: "图书馆建立者。" },
            "MrMailMoneyM": { x: 662.5, y: 200, bp: "outside", by: "1961", dy: "2026", 
                bio_en: "The One Who Sent His Wages Home.", 
                bio_zh: "工资全寄回老家的人。" },
            "PowerStationMomofEngineerF": { x: 712.5, y: 178, bp: "outside", by: "1953", dy: "2015", 
                bio_en: "Mother of the power station engineer.", 
                bio_zh: "电站工程师的妈妈。" },
            "OrchardSoldierM": { x: 538.5, y: 90, bp: "outside", by: "1918", dy: "2008", 
                bio_en: "World War II Veteran.", 
                bio_zh: "二战退伍老兵。" },
            "BartenderM": { x: 453.5, y: 260, bp: "outside", by: "1985", dy: "2023", 
                bio_en: "Moonlight Bartender.", 
                bio_zh: "月光调酒师。" },
            "OldTeacherF": { x: 612.5, y: 167, bp: "outside", by: "1950", dy: "2024", 
                bio_en: "Schoolmaster.", 
                bio_zh: "教书先生。" },
            "FounderGrandmaF": { x: 737.5, y: 107, bp: "outside", by: "1925", dy: "2015", 
                bio_en: "Botanical Lady.", 
                bio_zh: "香料女王。" },
            "ClinicAngelDaughterF": { x: 612.5, y: 307, bp: "outside", by: "2005", dy: "2015", 
                bio_en: "A daughter who passed away too soon.", 
                bio_zh: "早逝的女儿。" },
            "OrangeChiefAngelFather": { x: 587.5, y: 234, bp: "outside", by: "1976", dy: "2026", 
                bio_en: "Father of A daughter who passed away too soon.", 
                bio_zh: "早逝女儿的父亲。" },
            "LikeVampireM": { x: 424.5, y: 212, bp: "outside", by: "1966", dy: "2026", 
                bio_en: "The One Called a Vampire.", 
                bio_zh: "被称作吸血鬼的人。" },
            "ExPoliceChiefM": { x: 561.5, y: 193, bp: "outside", by: "1958", dy: "2026", 
                bio_en: "First Sheriff", 
                bio_zh: "第一任治安官。" },
            "OrchardGardenerM": { x: 687.5, y: 57, bp: "outside", by: "1905", dy: "1982", 
                bio_en: "Master Grafter.", 
                bio_zh: "嫁接大师。" },
            "PierDogOwnerM": { x: 687.5, y: 243, bp: "outside", by: "1978", dy: "2022", 
                bio_en: "Dockworker.", 
                bio_zh: "码头工人。" },
            "ScientistFuranocoumarinM": { x: 612.5, y: 103, bp: "outside", by: "1922", dy: "2023", 
                bio_en: "Discoverer of Furanocoumarin.", 
                bio_zh: "呋喃香豆素发现者。" },
            "OrchardIrrigatorM": { x: 437.5, y: 84, bp: "outside", by: "1915", dy: "1963", 
                bio_en: "The One Who Nourished the Orange Grove.", 
                bio_zh: "滋养橘园的人。" }
        };

        let currentLang = 'en'; 
        let currentActiveChar = null;

        // 获取 DOM 元素
        const treeContainer = document.getElementById('tree-container');
        const placeholder = document.getElementById('placeholder-text');
        const infoPanel = document.getElementById('info-panel');
        const portrait = document.getElementById('char-portrait');
        
        const selBp = document.getElementById('select-birthplace');
        const selBy = document.getElementById('select-birthyear');
        const selDy = document.getElementById('select-deathyear');
        const bioSection = document.getElementById('bio-section');
        const langButtons = document.querySelectorAll('.lang-btn');

        // 3. 动态计算精确像素并生成所有热区
        // 底图尺寸 850x400
        for (const [id, data] of Object.entries(charDatabase)) {
            const spot = document.createElement('div');
            spot.className = 'avatar-hotspot';
            spot.setAttribute('data-id', id);
            // 计算基于精确像素的百分比，适配不同屏幕
            spot.style.left = `${(data.x / 850) * 100}%`;
            spot.style.top = `${(data.y / 400) * 100}%`;
            
            spot.addEventListener('click', function() {
                // 处理选中状态的视觉反馈
                document.querySelectorAll('.avatar-hotspot').forEach(s => s.classList.remove('active-spot'));
                this.classList.add('active-spot');

                currentActiveChar = data;

                placeholder.style.display = 'none';
                infoPanel.style.display = 'flex';
                bioSection.style.display = 'none'; 

                // --- 2 倍无损放大与居中算法 ---
                // 因为目标是 100x100 容器 (中心在 50,50)，放大两倍后的实际像素坐标直接是 2 * 原坐标
                const bgPosX = 50 - (2 * data.x);
                const bgPosY = 50 - (2 * data.y);
                portrait.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;

                selBp.value = "";
                selBy.value = "";
                selDy.value = "";
            });
            treeContainer.appendChild(spot);
        }

        // 4. 提取唯一的出生年份和死亡年份用于生成下拉框
        const uniqueBirthYears = [...new Set(Object.values(charDatabase).map(c => c.by))].sort();
        const uniqueDeathYears = [...new Set(Object.values(charDatabase).map(c => c.dy))].sort();

        // 5. 语言切换核心逻辑
        function applyLanguage(lang) {
            currentLang = lang;
            const textData = i18n[lang];

            // 更新静态文本
            placeholder.innerHTML = textData.prompt;
            document.getElementById('ui-puzzle-title').textContent = textData.puzzleTitle;
            document.getElementById('ui-label-birthplace').textContent = textData.bpLabel;
            document.getElementById('ui-label-birthyear').textContent = textData.byLabel;
            document.getElementById('ui-label-deathyear').textContent = textData.dyLabel;

            // 记录当前的 value 以防重置
            const currBp = selBp.value;
            const currBy = selBy.value;
            const currDy = selDy.value;

            // 重新生成地点选项
            selBp.innerHTML = `<option value="">${textData.selectDefault}</option>
                               <option value="orange_island">${textData.places["orange_island"]}</option>
                               <option value="outside">${textData.places["outside"]}</option>`;
            
            // 生成年份选项
            selBy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueBirthYears.map(y => `<option value="${y}">${y}</option>`).join('');
            
            selDy.innerHTML = `<option value="">${textData.selectDefault}</option>` + 
                              uniqueDeathYears.map(y => `<option value="${y}">${y}</option>`).join('');

            // 恢复玩家的选项
            selBp.value = currBp;
            selBy.value = currBy;
            selDy.value = currDy;

            // 如果当前已经解锁了生平，立刻刷新其语言
            if (currentActiveChar && bioSection.style.display === 'block') {
                const bioText = lang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = textData.bioPrefix + bioText;
            }
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                langButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                applyLanguage(this.getAttribute('data-lang'));
            });
        });

        // 6. 解谜校验逻辑
        function checkPuzzle() {
            if(!currentActiveChar) return;

            const bpMatch = selBp.value === currentActiveChar.bp;
            const byMatch = selBy.value === currentActiveChar.by;
            const dyMatch = selDy.value === currentActiveChar.dy;

            if(bpMatch && byMatch && dyMatch) {
                const bioText = currentLang === 'en' ? currentActiveChar.bio_en : currentActiveChar.bio_zh;
                bioSection.innerHTML = i18n[currentLang].bioPrefix + bioText;
                bioSection.style.display = 'block';
            } else {
                bioSection.style.display = 'none';
            }
        }

        selBp.addEventListener('change', checkPuzzle);
        selBy.addEventListener('change', checkPuzzle);
        selDy.addEventListener('change', checkPuzzle);

        // 初始化
        applyLanguage('en');

    </script>
</body>
</html>
