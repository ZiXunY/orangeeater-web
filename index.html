<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Whispers of Orange Island</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        /* =========================
           Family Tree
           ========================= */

        #family-tree {
            width: 100%;
            min-height: 600px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
        }

        .family-tree-placeholder {
            color: #666;
            font-size: 20px;
        }


        /* =========================
           Character Information
           ========================= */

        #character-info {
            width: 100%;
            min-height: 500px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0a0a0a;

            border-top: 1px solid #333;
        }

        .character-info-placeholder {
            color: #444;
            font-size: 18px;
        }


        /* =========================
           Footer
           ========================= */

        footer {
            width: 100%;
            padding: 30px 20px;

            text-align: center;

            border-top: 1px solid #333;

            color: #777;
        }

        footer a {
            color: #d35400;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>

    <!-- =========================
         Family Tree
         ========================= -->

    <section id="family-tree">

        <div class="family-tree-placeholder">
            FAMILY TREE
        </div>

    </section>


    <!-- =========================
         Character Information
         ========================= -->

    <section id="character-info">

        <div class="character-info-placeholder">
            Select a character from the family tree
        </div>

    </section>


    <!-- =========================
         Footer
         ========================= -->

    <footer>

        <div>
            Whispers of Orange Island
        </div>

        <div>
            <a href="#" target="_blank">Steam</a>
            <a href="#" target="_blank">Discord</a>
            <a href="mailto:your@email.com">Email</a>
        </div>

    </footer>

</body>
</html>
